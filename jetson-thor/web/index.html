  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;

  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px;

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--accent); }

  #model { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { flex: 1; overflow-y: auto; }
  #thread { max-width: 780px; margin: 0 auto; padding: 24px 16px 32px; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; font-size: 15px; }
  .empty strong { display: block; color: var(--text); font-size: 20px; margin-bottom: 6px; }

  .msg { margin: 0 0 22px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .body { background: var(--user); border-radius: 14px; padding: 9px 14px; max-width: 85%;
                    white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.assistant .body { overflow-wrap: anywhere; }
  .body p { margin: 0 0 12px; }
  .body p:last-child { margin-bottom: 0; }
  .body h1, .body h2, .body h3, .body h4 { font-size: 16px; margin: 18px 0 8px; }
  .body ul, .body ol { margin: 0 0 12px; padding-left: 24px; }
  .body li { margin: 3px 0; }
  .body a { color: var(--accent); }
  .body table { border-collapse: collapse; margin: 10px 0; font-size: 14px; display: block; overflow-x: auto; }
  .body th, .body td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }

  .code .bar { display: flex; align-items: center; padding: 3px 6px 3px 12px; background: var(--bar);

  .code .bar span { flex: 1; font-family: ui-monospace, monospace; }

  .code pre { margin: 0; padding: 12px 14px; overflow-x: auto; tab-size: 4; }

  .tok-keyword { color: var(--tok-keyword); font-weight: 600; } .tok-type { color: var(--tok-type); }
  .tok-number { color: var(--tok-number); } .tok-macro { color: var(--tok-macro); font-weight: 600; }
  .tok-attr { color: var(--tok-attr); } .tok-lifetime { color: var(--tok-lifetime); } .tok-call { color: var(--tok-call); }

  details.sources { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  details.sources summary { cursor: pointer; user-select: none; }
  details.sources ol { margin: 6px 0 0; padding-left: 22px; }
  details.sources li { margin: 2px 0; overflow-wrap: anywhere; }
  details.sources a { color: var(--accent); }

  .composer { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;

  .composer:focus-within { border-color: var(--muted); }
  .composer textarea:focus-visible { outline: none; }

  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

<body>
<header>
  <span id="status" class="dot" title="server status"></span>
  <span id="model">connecting…</span>
  <span class="spacer"></span>
  <label class="toggle" title="Let the model search the web before answering"><input id="web" type="checkbox"> web</label>
  <label class="toggle" title="Let the model reason before answering"><input id="think" type="checkbox"> think</label>
  <select id="theme" title="Theme" aria-label="Theme">
    <option value="system">System</option>
    <option value="paper">Paper</option>
    <option value="night">Night</option>
    <option value="deep-ocean">Material Deep Ocean</option>
    <option value="github-light">GitHub Light</option>
    <option value="solarized-light">Solarized Light</option>
    <option value="solarized-dark">Solarized Dark</option>
    <option value="nord">Nord</option>
    <option value="dracula">Dracula</option>
    <option value="one-dark">One Dark</option>
    <option value="gruvbox-dark">Gruvbox Dark</option>
    <option value="monokai">Monokai</option>
  </select>
  <button id="new" title="Start a new conversation">New</button>
  <button id="open-settings" title="Settings" aria-label="Settings">⚙</button>
</header>

<main id="scroller"><div id="thread"></div></main>

<footer>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Message" autocomplete="off"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="hint">Enter sends · Shift+Enter new line · Esc stops</div>
</footer>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label for="key">Access key (if the server needs one)</label>
    <input id="key" type="password" autocomplete="off">
    <label for="system">System prompt (empty: none)</label>
    <textarea id="system"></textarea>
    <label for="temperature">Temperature (empty: the model's default)</label>
    <input id="temperature" type="number" step="0.1" min="0" max="2">
    <div class="row"><button value="cancel">Cancel</button><button id="save" value="save">Save</button></div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};

let settings = store.get("settings", { key: "", system: "", temperature: "" });
let messages = store.get("messages", []);
let modelName = "";
let controller = null;

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function headers() {
  const result = { "Content-Type": "application/json" };
  if (settings.key) result.Authorization = `Bearer ${settings.key}`;
  return result;
}

// ---- syntax highlighting: a small lexer, not a parser ----
const KEYWORDS = {
  rust: "as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while",
  python: "and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return self True try while with yield",
  go: "break case chan const continue default defer else fallthrough for func go goto if import interface map nil package range return select struct switch type var true false",
  c: "auto bool break case char class const constexpr continue default delete do double else enum explicit extern false float for if inline int long namespace new nullptr private protected public return short signed sizeof static struct switch template this true typedef typename union unsigned using virtual void volatile while",
  js: "async await break case catch class const continue default delete do else export extends false finally for function if import in instanceof let new null of return static super switch this throw true try typeof undefined var void while yield",
  shell: "if then else elif fi for in do done while case esac function return export local set echo cd sudo",
  data: "true false null",
};
const ALIASES = { rs: "rust", rust: "rust", py: "python", python: "python", go: "go", c: "c", h: "c", cpp: "c", "c++": "c",
  cc: "c", cu: "c", cuda: "c", js: "js", javascript: "js", ts: "js", typescript: "js", sh: "shell", bash: "shell",
  shell: "shell", zsh: "shell", console: "shell", toml: "data", json: "data", yaml: "data", yml: "data" };
const KINDS = ["comment", "string", "attr", "lifetime", "number", "macro", "word"];
const NEVER = String.raw`(?!)`;

function lexer(language) {
  const hash = ["python", "shell", "data"].includes(language);
  const strings = {
    python: String.raw`"""[\s\S]*?"""|'''[\s\S]*?'''|[rbf]?"(?:\\.|[^"\\\n])*"|[rbf]?'(?:\\.|[^'\\\n])*'`,
    rust: String.raw`b?r(?<hashes>#*)"[\s\S]*?"\k<hashes>|b?"(?:\\.|[^"\\])*"|b?'(?:\\.|[^'\\\n])'`,
  };
  const patterns = {
    comment: hash ? String.raw`#.*` : String.raw`\/\/.*|\/\*[\s\S]*?\*\/`,
    string: strings[language] || String.raw`"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|` + "`[^`]*`",
    attr: language === "rust" ? String.raw`#!?\[[^\]\n]*\]` : language === "python" ? String.raw`@\w+` : NEVER,
    lifetime: language === "rust" ? String.raw`'[a-z_]\w*\b(?!')` : NEVER,
    number: String.raw`\b(?:0x[\da-fA-F_]+|\d[\d_]*(?:\.\d[\d_]*)?(?:e[+-]?\d+)?)(?:[iu](?:8|16|32|64|128|size)|f32|f64)?\b`,
    macro: language === "rust" ? String.raw`\b[a-z_]\w*!` : NEVER,
    word: String.raw`\b[A-Za-z_]\w*\b`,
  };
  return new RegExp(KINDS.map((kind) => `(?<${kind}>${patterns[kind]})`).join("|"), "g");
}

function highlight(code, lang) {
  const language = ALIASES[lang] || (lang ? "" : "rust");
  const fragment = document.createDocumentFragment();
  if (!language) { fragment.append(code); return fragment; }
  const keywords = new Set(KEYWORDS[language].split(" "));
  let position = 0;
  for (const match of code.matchAll(lexer(language))) {
    const word = match[0];
    const kind = KINDS.find((name) => match.groups[name] !== undefined);
    const style = kind !== "word" ? kind
      : keywords.has(word) ? "keyword"
      : /^[A-Z]/.test(word) ? "type"
      : code[match.index + word.length] === "(" ? "call" : "";
    if (!style) continue;
    fragment.append(code.slice(position, match.index), element("span", `tok-${style}`, word));
    position = match.index + word.length;
  }
  fragment.append(code.slice(position));
  return fragment;
}

// ---- markdown: built with DOM nodes only, so model output is never run as HTML ----
const INLINE = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(\*[^*\n]+\*|(?<!\w)_[^_\n]+_(?!\w))|(\[[^\]\n]+\]\((?:https?:\/\/)[^)\s]+\))/g;

function inline(parent, text) {
  let position = 0;
  for (const match of text.matchAll(INLINE)) {
    parent.append(text.slice(position, match.index));
    const token = match[0];
    if (token.startsWith("`")) parent.append(element("code", "", token.slice(1, -1)));
    else if (token.startsWith("**")) { const node = element("strong"); inline(node, token.slice(2, -2)); parent.append(node); }
    else if (token.startsWith("*") || token.startsWith("_")) { const node = element("em"); inline(node, token.slice(1, -1)); parent.append(node); }
    else {
      const link = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(token);
      const anchor = element("a", "", link[1]);
      anchor.href = link[2]; anchor.target = "_blank"; anchor.rel = "noreferrer";
      parent.append(anchor);
    }
    position = match.index + token.length;
  }
  parent.append(text.slice(position));
}

function codeBlock(code, lang) {
  const block = element("div", "code");
  const bar = element("div", "bar");
  const copy = element("button", "", "copy");
  copy.type = "button";
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(code); copy.textContent = "copied"; }
    catch { copy.textContent = "select + copy"; }
    setTimeout(() => { copy.textContent = "copy"; }, 1400);
  });
  bar.append(element("span", "", lang || "text"), copy);
  const pre = element("pre");
  const node = element("code");
  node.append(highlight(code, lang));
  pre.append(node);
  block.append(bar, pre);
  return block;
}

function markdown(parent, text) {
  const lines = text.split("\n");
  let index = 0;
  let paragraph = [];
  const flush = () => {
    if (paragraph.length) { const p = element("p"); inline(p, paragraph.join("\n")); parent.append(p); paragraph = []; }
  };
  while (index < lines.length) {
    const line = lines[index];
    const fence = /^\s*(```+|~~~+)\s*([\w+#.-]*)/.exec(line);
    if (fence) {
      flush();
      const body = [];
      index += 1;
      while (index < lines.length && !lines[index].trim().startsWith(fence[1])) { body.push(lines[index]); index += 1; }
      index += 1;
      parent.append(codeBlock(body.join("\n"), fence[2].toLowerCase()));
      continue;
    }
    if (!line.trim()) { flush(); index += 1; continue; }
    const heading = /^(#{1,6})\s+(.*)$/.exec(line);
    if (heading) { flush(); const h = element(`h${Math.min(heading[1].length + 1, 4)}`); inline(h, heading[2]); parent.append(h); index += 1; continue; }
    if (/^\s*>/.test(line)) {
      flush();
      const quote = element("blockquote");
      const body = [];
      while (index < lines.length && /^\s*>/.test(lines[index])) { body.push(lines[index].replace(/^\s*>\s?/, "")); index += 1; }
      inline(quote, body.join("\n"));
      parent.append(quote);
      continue;
    }
    if (/^\s*\|/.test(line)) {
      flush();
      const table = element("table");
      let first = true;
      while (index < lines.length && /^\s*\|/.test(lines[index])) {
        const cells = lines[index].trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim());
        index += 1;
        if (cells.every((cell) => /^:?-{2,}:?$/.test(cell))) continue;
        const row = element("tr");
        cells.forEach((cell) => { const td = element(first ? "th" : "td"); inline(td, cell); row.append(td); });
        table.append(row);
        first = false;
      }
      parent.append(table);
      continue;
    }
    const item = /^\s*([-*+]|\d+[.)])\s+(.*)$/.exec(line);
    if (item) {
      flush();
      const list = element(/\d/.test(item[1]) ? "ol" : "ul");
      while (index < lines.length) {
        const next = /^\s*([-*+]|\d+[.)])\s+(.*)$/.exec(lines[index]);
        if (!next) break;
        const li = element("li"); inline(li, next[2]); list.append(li);
        index += 1;
      }
      parent.append(list);
      continue;
    }
    paragraph.push(line);
    index += 1;
  }
  flush();
}

// ---- thread ----
function renderMessage(message) {
  const wrap = element("div", `msg ${message.role}`);
  const body = element("div", "body");
  if (message.role === "user") {
    body.textContent = message.content;
  } else {
    if (message.searches && message.searches.length) {
      const details = element("details", "sources");
      const count = message.searches.reduce((sum, search) => sum + search.results.length, 0);
      details.append(element("summary", "", `searched: ${message.searches.map((search) => `“${search.query}”`).join(", ")} · ${count} sources`));
      const list = element("ol");
      message.searches.flatMap((search) => search.results).forEach((result) => {
        const item = element("li");
        const anchor = element("a", "", result.title || result.url);
        anchor.href = /^https?:\/\//.test(result.url) ? result.url : "#";
        anchor.target = "_blank"; anchor.rel = "noreferrer";
        item.append(anchor);
        list.append(item);
      });
      details.append(list);
      body.append(details);
    }
    if (message.reasoning) {
      const details = element("details", "thinking");
      details.append(element("summary", "", message.thinkingDone ? "thought" : "thinking…"), element("div", "text", message.reasoning));
      body.append(details);
    }
    const content = element("div");
    markdown(content, message.content || "");
    if (message.streaming) content.classList.add("cursor");
    body.append(content);
    if (message.error) body.append(element("div", "error", message.error));
    if (message.stats) body.append(element("div", "stats", message.stats));
  }
  wrap.append(body);
  return wrap;
}

function render() {
  const thread = $("thread");
  thread.replaceChildren();
  if (messages.length === 0) {
    const empty = element("div", "empty");
    empty.append(element("strong", "", modelName || "Thor"), "Ask about code, systems or anything else. Replies stream from the Jetson Thor.");
    thread.append(empty);
    return;
  }
  messages.forEach((message) => thread.append(renderMessage(message)));
}

function nearBottom() {
  const scroller = $("scroller");
  return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
}

function updateLast() {
  const stick = nearBottom();
  const thread = $("thread");
  const last = thread.lastElementChild;
  const fresh = renderMessage(messages[messages.length - 1]);
  const openBefore = last && last.querySelector("details.thinking")?.open;
  if (openBefore && fresh.querySelector("details.thinking")) fresh.querySelector("details.thinking").open = true;
  if (last) last.replaceWith(fresh); else thread.append(fresh);
  if (stick) $("scroller").scrollTop = $("scroller").scrollHeight;
}

function save() { store.set("messages", messages.map(({ streaming, ...rest }) => rest)); }

// ---- server ----
async function connect() {
  try {
    const response = await fetch("v1/models", { headers: headers() });
    if (response.status === 401) { $("status").className = "dot bad"; $("model").textContent = "access key needed"; $("settings").showModal(); return; }
    const data = await response.json();
    modelName = (data.data && data.data[0] && data.data[0].id || "model").split("/").pop().replace(/\.gguf$/, "");
    $("model").textContent = modelName;
    $("status").className = "dot ok";
    document.title = `${modelName} · Thor Chat`;
    if (messages.length === 0) render();
  } catch {
    $("status").className = "dot bad";
    $("model").textContent = "server not reachable";
  }
}

async function send(text) {
  messages.push({ role: "user", content: text });
  const reply = { role: "assistant", content: "", reasoning: "", streaming: true };
  messages.push(reply);
  render();
  $("scroller").scrollTop = $("scroller").scrollHeight;
  setBusy(true);

  const history = messages.slice(0, -1).filter((m) => !m.error && (m.role === "user" || m.content)).map(({ role, content }) => ({ role, content }));
  if (settings.system.trim()) history.unshift({ role: "system", content: settings.system.trim() });
  const body = { messages: history, stream: true, chat_template_kwargs: { enable_thinking: $("think").checked },
    thor_web_search: $("web").checked };
  if (settings.temperature !== "" && !Number.isNaN(Number(settings.temperature))) body.temperature = Number(settings.temperature);

  controller = new AbortController();
  const started = performance.now();
  let firstToken = 0;
  try {
    const response = await fetch("v1/chat/completions", {
      method: "POST", headers: headers(), body: JSON.stringify(body), signal: controller.signal,
    });
    if (!response.ok) throw new Error(response.status === 401 ? "Access key needed: open settings (⚙)." : `${response.status} ${await response.text()}`);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let timings = null;
    let frame = 0;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        const chunk = JSON.parse(payload);
        if (chunk.thor) {
          if (chunk.thor.search) (reply.searches = reply.searches || []).push(chunk.thor.search);
          if (chunk.thor.error) reply.error = chunk.thor.error;
          continue;
        }
        const delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta || {};
        if ((delta.content || delta.reasoning_content) && !firstToken) firstToken = performance.now();
        if (delta.reasoning_content) reply.reasoning += delta.reasoning_content;
        if (delta.content) { reply.content += delta.content; reply.thinkingDone = true; }
        if (chunk.timings) timings = chunk.timings;
      }
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; updateLast(); });
    }
    reply.thinkingDone = true;
    const seconds = ((performance.now() - started) / 1000).toFixed(1);
    reply.stats = timings
      ? `${timings.predicted_n} tokens · ${timings.predicted_per_second.toFixed(1)} tok/s · first token ${(timings.prompt_ms / 1000).toFixed(1)}s · ${seconds}s`
      : `${seconds}s${firstToken ? ` · first token ${((firstToken - started) / 1000).toFixed(1)}s` : ""}`;
  } catch (error) {
    if (error.name === "AbortError") reply.stats = "stopped";
    else reply.error = error.message;
  } finally {
    reply.streaming = false;
    controller = null;
    setBusy(false);
    updateLast();
    save();
  }
}

function setBusy(busy) {
  $("send").textContent = busy ? "Stop" : "Send";
  $("send").type = busy ? "button" : "submit";
}

// ---- input ----
const input = $("input");
function autosize() { input.style.height = "auto"; input.style.height = `${input.scrollHeight}px`; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); $("composer").requestSubmit(); }
});
$("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  if (controller) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  autosize();
  send(text);
});
$("send").addEventListener("click", () => { if (controller) controller.abort(); });
document.addEventListener("keydown", (event) => { if (event.key === "Escape" && controller) controller.abort(); });
$("new").addEventListener("click", () => { if (controller) controller.abort(); messages = []; save(); render(); input.focus(); });
function applyTheme(name) {
  if (name === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = name;
}
$("theme").value = store.get("theme", "system");
applyTheme($("theme").value);
$("theme").addEventListener("change", () => { applyTheme($("theme").value); store.set("theme", $("theme").value); });

$("think").checked = store.get("think", false);
$("web").checked = store.get("web", false);
$("web").addEventListener("change", () => store.set("web", $("web").checked));
$("think").addEventListener("change", () => store.set("think", $("think").checked));

$("open-settings").addEventListener("click", () => {
  $("key").value = settings.key; $("system").value = settings.system; $("temperature").value = settings.temperature;
  $("settings").showModal();
});
$("settings").addEventListener("close", () => {
  if ($("settings").returnValue !== "save") return;
  settings = { key: $("key").value.trim(), system: $("system").value, temperature: $("temperature").value };
  store.set("settings", settings);
  connect();
});

render();
connect();
input.focus();
</script>
</body>
</html>
