<!doctype html>

<header>
  <span class="brand"><svg viewBox="70 40 300 300" aria-hidden="true"><use href="#cub-art"/></svg><span class="name">Thor Tigress Cub</span></span>
  <span class="model-chip"><span id="status" class="dot" title="server status"></span><select id="model" title="Model" aria-label="Model" disabled><option>connecting…</option></select></span>
  <span class="spacer"></span>
  <a id="about" class="about" href="/about.html">About</a>
  <label class="pill" title="Let the model search the web before answering"><input id="web" type="checkbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Web</label>
  <label class="pill" title="Let the model reason before answering (slower, often better)"><input id="think" type="checkbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Think</label>
  <button id="new" class="icon-btn" title="New conversation" aria-label="New conversation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="open-settings" class="icon-btn" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
</header>

<main id="scroller"><div id="thread"></div></main>

<footer>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Message the cub" autocomplete="off"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="hint">Nemotron 3 Nano on a Jetson AGX Thor · Enter sends · Shift+Enter new line · Esc stops</div>
</footer>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label for="theme">Theme</label>
    <select id="theme">
      <option value="system">Cub (follows your device)</option>
      <option value="paper">Paper</option>
      <option value="night">Night</option>
      <option value="deep-ocean">Material Deep Ocean</option>
      <option value="github-light">GitHub Light</option>
      <option value="solarized-light">Solarized Light</option>
      <option value="solarized-dark">Solarized Dark</option>
      <option value="nord">Nord</option>
      <option value="dracula">Dracula</option>
      <option value="one-dark">One Dark</option>
      <option value="gruvbox-dark">Gruvbox Dark</option>
      <option value="monokai">Monokai</option>
    </select>
    <label for="key">Access key</label>
    <input id="key" type="password" autocomplete="off">
    <label for="system">System prompt (empty: none)</label>
    <textarea id="system"></textarea>
    <label for="temperature">Temperature (empty: the model's default)</label>
    <input id="temperature" type="number" step="0.1" min="0" max="2">
    <label for="thinkbudget">Think budget, tokens (empty: no limit)</label>
    <input id="thinkbudget" type="number" step="128" min="0">
    <div class="row"><button value="cancel">Cancel</button><button id="save" value="save">Save</button></div>
  </form>
</dialog>

<script type="module" src="chat.js"></script>
</body>
</html>
