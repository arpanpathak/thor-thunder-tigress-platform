<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reinforcer review</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1016; --rail: #11151d; --panel: #161b24; --panel-2: #1c2230; --raised: #222a3a;
    --text: #e6e9f0; --muted: #8a94a8; --faint: #5d6679; --border: #262e3d; --border-strong: #354055;
    --accent: #5eead4; --accent-ink: #062a26; --good: #4ade80; --slop: #fb7185; --warn: #fbbf24;
    --code-bg: #0f131b; --code-bar-bg: #141a24; --gutter: #4b5568;
    --mark: #854d0e; --mark-text: #fef3c7;
    --tok-comment: #6b7a90; --tok-string: #a5e3b0; --tok-keyword: #d6a8ff;
    --tok-type: #ffd27a; --tok-number: #7fd8f0; --tok-macro: #8fb4ff;
    --tok-attr: #a3adbf; --tok-lifetime: #f7a1c4; --tok-call: #9cc8ff;
    --c-flattery_filler_opener: #f472b6; --c-wrap_up_repeat: #a78bfa; --c-fake_importance: #fb923c;
    --c-dramatic_setup: #f87171; --c-empty_depth_words: #facc15; --c-fake_balance_hedging: #38bdf8;
    --c-rhythm_trick: #34d399; --c-other: #94a3b8;
    --radius: 12px; --rail-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.6 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  code, pre, .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  a { color: var(--accent); }

  .layout { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100vh; }
  aside.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--rail);
    border-right: 1px solid var(--border); padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #818cf8);
    display: grid; place-items: center; color: var(--accent-ink); font-weight: 800; }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }
  .rail h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); margin: 0 0 8px; }
  .datasets { display: flex; flex-direction: column; gap: 6px; }
  .dataset { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 10px 12px;
    cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .dataset:hover { background: var(--panel); }
  .dataset.active { background: var(--panel-2); border-color: var(--border-strong); box-shadow: inset 3px 0 0 var(--accent); }
  .dataset .name { font-weight: 600; }
  .dataset .count { color: var(--muted); font-size: 12px; justify-self: end; align-self: center; }
  .dataset .sub { grid-column: 1 / -1; font-size: 12px; color: var(--faint); }
  .dataset .sub b { color: var(--slop); font-weight: 600; }
  .missing { font-size: 12px; color: var(--faint); margin-top: 6px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .search { position: relative; }
  .search input { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 9px 36px 9px 12px; }
  .search kbd { position: absolute; right: 8px; top: 8px; }
  select { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .toggle { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .toggle.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 18px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .keys { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  kbd { font: 11px/1 "JetBrains Mono", ui-monospace, monospace; border: 1px solid var(--border-strong); border-bottom-width: 2px;
    border-radius: 5px; padding: 3px 5px; background: var(--panel-2); color: var(--text); white-space: nowrap; }

  main { min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 16px; }
  .topbar .title { min-width: 0; flex: 1; }
  .topbar h2 { margin: 0; font-size: 18px; }
  .topbar .file { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { width: 180px; }
  .progress .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .progress .fill { height: 100%; background: linear-gradient(90deg, var(--accent), #818cf8); width: 0; transition: width .3s; }
  .progress-text { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .pager { display: flex; align-items: center; gap: 8px; }
  .icon { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; }
  .icon:disabled { opacity: .35; cursor: default; }
  .pager span { font-size: 13px; color: var(--muted); min-width: 120px; text-align: center; }
  .banners { padding: 0 28px; }
  .banner[hidden] { display: none; }
  .banner { margin-top: 14px; border: 1px solid; border-radius: var(--radius); padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 14px; }
  .banner.phrase { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .banner.orphans { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 7%, transparent); flex-direction: column; align-items: stretch; }
  .banner .item { display: flex; gap: 10px; align-items: center; }
  .banner .item .id { color: var(--faint); font-size: 12px; }
  .list { padding: 18px 28px 80px; display: flex; flex-direction: column; gap: 16px; max-width: 1180px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }

  article { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  article.focused { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  article.flagged { border-color: color-mix(in srgb, var(--slop) 55%, var(--border)); }
  article.good { border-color: color-mix(in srgb, var(--good) 40%, var(--border)); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel-2); font-size: 13px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--accent); }
  .badge { border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .collection { font-weight: 600; }
  .origin { color: var(--faint); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px; }
  .chip { border: 1px solid var(--border-strong); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--muted); }
  .spacer { flex: 1; }
  .verdict { display: flex; gap: 6px; }
  .verdict button { border: 1px solid var(--border-strong); background: var(--panel); border-radius: 8px; padding: 4px 11px; font-size: 13px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .verdict button kbd { font-size: 10px; padding: 1px 4px; }
  .verdict .good.on { border-color: var(--good); color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
  .verdict .slop.on { border-color: var(--slop); color: var(--slop); background: color-mix(in srgb, var(--slop) 12%, transparent); }
  .hits { width: 100%; color: var(--warn); font-size: 12px; }

  .part { padding: 14px 18px; border-bottom: 1px dashed var(--border); }
  .part:last-of-type { border-bottom: none; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); display: flex; gap: 10px; margin-bottom: 6px; }
  .label .size { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none; }
  .turn { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 14px 18px; border-bottom: 1px dashed var(--border); }
  .turn .avatar { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
  .turn.user .avatar { background: color-mix(in srgb, #818cf8 22%, transparent); color: #a5b4fc; }
  .turn.assistant .avatar { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .turn.user .bubble { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
  .grounding { margin: 0; border-bottom: 1px solid var(--border); background: color-mix(in srgb, #818cf8 6%, transparent); }
  .grounding summary { padding: 10px 18px; cursor: pointer; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; list-style: none; }
  .grounding summary::-webkit-details-marker { display: none; }
  .grounding summary::before { content: "▸"; transition: transform .15s; }
  .grounding[open] summary::before { transform: rotate(90deg); }
  .grounding .body { padding: 4px 18px 14px; max-height: 420px; overflow: auto; }
  .notes { padding: 8px 18px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--border); }
  .notes div { font-size: 12px; color: var(--warn); }
  .rejected .spans li .category { color: var(--warn); }

  .prose { overflow-wrap: anywhere; }
  .prose p { margin: .4em 0; white-space: pre-wrap; }
  .prose h3 { font-size: 15px; margin: .8em 0 .3em; }
  .prose ul, .prose ol { margin: .3em 0 .3em 1.3em; padding: 0; }
  .prose code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; font-size: .88em; }
  .prose table { border-collapse: collapse; margin: .6em 0; font-size: 14px; display: block; overflow-x: auto; }
  .prose th, .prose td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  .prose th { background: var(--panel-2); }
  .shortened { position: relative; }
  .more { margin-top: 8px; border: 1px dashed var(--border-strong); background: transparent; border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--accent); }

  .code-block { margin: .7em 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
  .code-bar { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: var(--code-bar-bg); border-bottom: 1px solid var(--border); font-size: 12px; }
  .code-lang { font-weight: 700; color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; }
  .code-lines { color: var(--faint); flex: 1; }
  .code-copy { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 12px; }
  pre { margin: 0; padding: 10px 0; overflow-x: auto; font-size: 13px; line-height: 1.55; counter-reset: line; }
  pre .line { display: block; padding-right: 16px; counter-increment: line; min-height: 1.55em; }
  pre .line::before { content: counter(line); display: inline-block; width: 3.2em; padding-right: 1em; text-align: right; color: var(--gutter); user-select: none; }
  .short pre .line::before { display: none; }
  .short pre .line { padding-left: 14px; }
  pre .line:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  pre .line.violation { background: color-mix(in srgb, var(--slop) 10%, transparent); }
  .rule-tag { float: right; margin-left: 12px; font-size: 11px; color: var(--slop); border: 1px solid color-mix(in srgb, var(--slop) 50%, transparent); border-radius: 5px; padding: 0 5px; user-select: none; }
  .tok-comment { color: var(--tok-comment); font-style: italic; }
  .tok-string { color: var(--tok-string); }
  .tok-keyword { color: var(--tok-keyword); }
  .tok-type { color: var(--tok-type); }
  .tok-number { color: var(--tok-number); }
  .tok-macro { color: var(--tok-macro); }
  .tok-attr { color: var(--tok-attr); }
  .tok-lifetime { color: var(--tok-lifetime); }
  .tok-call { color: var(--tok-call); }

  mark { background: var(--mark); color: var(--mark-text); border-radius: 3px; padding: 0 1px; }
  mark.slop { background: color-mix(in srgb, var(--cat, var(--slop)) 30%, transparent); color: var(--text);
    box-shadow: inset 0 -2px 0 var(--cat, var(--slop)); }
  mark.suggest { background: transparent; color: inherit; border-bottom: 2px dotted var(--cat, var(--warn)); cursor: pointer; }
  mark.suggest:hover { background: color-mix(in srgb, var(--cat, var(--warn)) 18%, transparent); }

  .curation { padding: 12px 18px 14px; background: var(--panel-2); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .curation:empty { display: none; }
  .spans { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .spans li { display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .spans .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .spans .category { color: var(--muted); white-space: nowrap; }
  .spans .quote { flex: 1; overflow-wrap: anywhere; }
  .spans button, .note-row button { border: 1px solid var(--border-strong); background: var(--panel); border-radius: 7px; padding: 2px 9px; font-size: 12px; cursor: pointer; }
  .note-row { display: flex; gap: 8px; }
  .note-row input { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .hint { font-size: 12px; color: var(--faint); }

  .popover { position: fixed; z-index: 30; background: var(--raised); border: 1px solid var(--border-strong); border-radius: 12px; padding: 8px;
    box-shadow: 0 18px 40px -12px rgba(0,0,0,.7); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; width: 420px; }
  .popover[hidden] { display: none; }
  .popover .quote { grid-column: 1 / -1; font-size: 12px; color: var(--muted); padding: 2px 6px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .popover button { display: flex; gap: 8px; align-items: center; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 13px; }
  .popover button:hover, .popover button:focus-visible { background: var(--panel-2); border-color: var(--border-strong); }
  .popover .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .popover kbd { margin-left: auto; }
  .toast { position: fixed; right: 22px; bottom: 22px; background: var(--raised); border: 1px solid var(--border-strong); border-radius: 10px; padding: 10px 14px; font-size: 14px;
    opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 40; }
  .toast.on { opacity: 1; transform: none; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    aside.rail { position: static; height: auto; }
    .progress { display: none; }
    .topbar, .list, .banners { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="rail">
    <div class="brand"><div class="logo">R</div><div><h1>Reinforcer</h1><p>Human review of training data</p></div></div>
    <section><h2>Datasets</h2><div id="datasets" class="datasets"></div><div id="missing" class="missing"></div></section>
    <section class="field">
      <h2>Find</h2>
      <div class="search"><input id="search" type="search" placeholder="Search text or file"><kbd>/</kbd></div>
      <select id="source"><option value="">All sources</option></select>
      <select id="collection"><option value="">All books, docs and repositories</option></select>
      <div class="toggles">
        <button id="flagged-only" class="toggle" type="button">Flagged</button>
        <button id="unreviewed-only" class="toggle" type="button">Not reviewed</button>
        <button id="sensitive-only" class="toggle" type="button">Personal data</button>
      </div>
    </section>
    <section><h2>This dataset</h2><div class="stats" id="stats"></div></section>
    <section>
      <h2>Keys</h2>
      <div class="keys">
        <span><kbd>j</kbd> <kbd>k</kbd></span><span>next / previous example</span>
        <span><kbd>a</kbd></span><span>mark good and go on</span>
        <span><kbd>f</kbd></span><span>flag whole example as slop</span>
        <span><kbd>1</kbd>…<kbd>8</kbd></span><span>category for selected text</span>
        <span><kbd>e</kbd></span><span>load the full answer</span>
        <span><kbd>n</kbd> <kbd>p</kbd></span><span>next / previous page</span>
        <span><kbd>/</kbd></span><span>search</span>
      </div>
    </section>
  </aside>
  <main>
    <div class="topbar">
      <div class="title"><h2 id="title">Loading…</h2><div id="file" class="file"></div></div>
      <div class="progress"><div class="bar"><div id="progress-fill" class="fill"></div></div><div id="progress-label" class="progress-text"></div></div>
      <div class="pager"><button id="prev" class="icon" title="Previous page (p)">←</button><span id="page-info"></span><button id="next" class="icon" title="Next page (n)">→</button></div>
    </div>
    <div class="banners"><div id="phrase-bar" class="banner phrase" hidden></div><div id="orphans" class="banner orphans" hidden></div></div>
    <div id="list" class="list"></div>
  </main>
</div>
<div id="popover" class="popover" hidden></div>
<div id="toast" class="toast"></div>
<script>
// Rendering: markdown, code highlighting and marks, unchanged from the earlier page.
const SENSITIVE = [
  ["email", /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g],
  ["API key", /\b(?:sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|xox[abprs]-[A-Za-z0-9-]{10,}|hf_[A-Za-z0-9]{30,})\b/g],
  ["private key", /-----BEGIN [A-Z ]*PRIVATE KEY-----/g],
  ["password", /\b(?:password|passwd|pwd)\s*[:=]\s*\S+/gi],
  ["bearer token", /\bBearer\s+[A-Za-z0-9._~+\/-]{20,}/g],
  ["phone number", /(?<![\w.])\+?\d{1,3}[\s.-]?\(?\d{3}\)?[\s.-]\d{3}[\s.-]\d{4}(?![\w.])/g],
];

// The categories of anti_ai_slop.md; the values match slop_flags::SlopCategory.
const SLOP_CATEGORIES = [
  ["flattery_filler_opener", "Flattery or filler opener"],
  ["wrap_up_repeat", "Wrap-up that repeats the answer"],
  ["fake_importance", "Fake importance"],
  ["dramatic_setup", "Dramatic setup before something ordinary"],
  ["empty_depth_words", "Empty depth words"],
  ["fake_balance_hedging", "Fake balance or hedging"],
  ["rhythm_trick", "Rhythm trick (triplet, fragments, em-dash reveal)"],
  ["other", "Other"],
];
const CATEGORY_LABELS = new Map(SLOP_CATEGORIES);


// Ranges to highlight in one piece of text: personal-data matches and the slop
// spans marked on this field. Overlapping ranges are merged; slop wins the style.
// Ranges to highlight in one piece of text: personal-data matches, phrases
// suggested as slop (by Stage 0 or because a reviewer marked the same phrase
// elsewhere), and the slop spans marked on this field. Overlapping ranges are
// merged; a marked span wins over a suggestion, a suggestion over personal data.
const RANK = { sensitive: 0, suggest: 1, slop: 2 };

function occurrences(text, phrase) {
  const found = [];
  const haystack = text.toLowerCase();
  const needle = phrase.toLowerCase();
  if (!needle) return found;
  let start = haystack.indexOf(needle);
  while (start >= 0) {
    found.push(start);
    start = haystack.indexOf(needle, start + needle.length);
  }
  return found;
}

function highlightRanges(text, slopSpans, suggestions = []) {
  const ranges = [];
  for (const [label, pattern] of SENSITIVE) {
    for (const match of text.matchAll(pattern)) {
      ranges.push({ start: match.index, end: match.index + match[0].length, label, kind: "sensitive" });
    }
  }
  for (const suggestion of suggestions) {
    for (const start of occurrences(text, suggestion.text)) {
      ranges.push({
        start, end: start + suggestion.text.length, kind: "suggest",
        category: suggestion.category,
        label: `Suggested: ${CATEGORY_LABELS.get(suggestion.category) || suggestion.category} (${suggestion.from}). Click to mark.`,
      });
    }
  }
  for (const span of slopSpans) {
    const start = text.indexOf(span.text);
    if (start >= 0) {
      ranges.push({ start, end: start + span.text.length, label: CATEGORY_LABELS.get(span.category), kind: "slop", category: span.category });
    }
  }
  ranges.sort((first, second) => first.start - second.start);
  const merged = [];
  for (const range of ranges) {
    const last = merged[merged.length - 1];
    if (last && range.start < last.end) {
      last.end = Math.max(last.end, range.end);
      if (RANK[range.kind] > RANK[last.kind]) Object.assign(last, { kind: range.kind, label: range.label, category: range.category });
      continue;
    }
    merged.push({ ...range });
  }
  return merged;
}

function markFor(range, text) {
  const mark = element("mark", range.kind === "sensitive" ? "" : range.kind, text);
  mark.title = range.label;
  if (range.kind === "suggest") mark.dataset.category = range.category;
  return mark;
}

// `marks` is { spans, suggestions }: the slop spans marked on this field and
// the phrases to suggest in it.
function appendWithMarks(parent, text, marks) {
  let position = 0;
  for (const range of highlightRanges(text, marks.spans, marks.suggestions)) {
    parent.append(document.createTextNode(text.slice(position, range.start)));
    parent.append(markFor(range, text.slice(range.start, range.end)));
    position = range.end;
  }
  parent.append(document.createTextNode(text.slice(position)));
}

// The answer text is markdown, so it is rendered rather than shown raw: a
// reader should not have to read around backticks and pipe characters. Every
// node is built with createElement and textContent, so markup in the data is
// displayed, never executed.
const INLINE = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(\*[^*\n]+\*|(?<!\w)_[^_\n]+_(?!\w))|(\[[^\]\n]+\]\([^)\n]+\))/g;

function inlineRuns(text) {
  const runs = [];
  let position = 0;
  for (const match of text.matchAll(INLINE)) {
    if (match.index > position) runs.push({ kind: "text", text: text.slice(position, match.index) });
    const token = match[0];
    if (token.startsWith("`")) {
      runs.push({ kind: "code", text: token.slice(1, -1) });
    } else if (token.startsWith("**")) {
      runs.push({ kind: "bold", text: token.slice(2, -2) });
    } else if (token.startsWith("*") || token.startsWith("_")) {
      runs.push({ kind: "italic", text: token.slice(1, -1) });
    } else {
      const link = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(token);
      runs.push({ kind: "link", text: link[1], href: link[2] });
    }
    position = match.index + token.length;
  }
  if (position < text.length) runs.push({ kind: "text", text: text.slice(position) });
  return runs;
}

function appendInline(parent, text, marks) {
  for (const run of inlineRuns(text)) {
    switch (run.kind) {
      case "code":
        parent.append(element("code", "", run.text));
        break;
      case "bold": {
        const strong = element("strong");
        appendInline(strong, run.text, marks);
        parent.append(strong);
        break;
      }
      case "italic": {
        const emphasis = element("em");
        appendInline(emphasis, run.text, marks);
        parent.append(emphasis);
        break;
      }
      case "link": {
        const anchor = element("a", "", run.text);
        anchor.href = run.href;
        anchor.target = "_blank";
        anchor.rel = "noreferrer";
        parent.append(anchor);
        break;
      }
      default:
        appendWithMarks(parent, run.text, marks);
    }
  }
}

function tableCells(row) {
  return row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
}

function isDivider(row) {
  const cells = tableCells(row);
  return cells.length > 0 && cells.every((cell) => /^:?-{2,}:?$/.test(cell));
}

function renderTable(parent, rows, marks) {
  const table = element("table");
  const body = element("tbody");
  let headerDone = false;
  for (const row of rows) {
    if (isDivider(row)) continue;
    const cells = tableCells(row);
    const line = element("tr");
    for (const cell of cells) {
      const node = element(headerDone ? "td" : "th");
      appendInline(node, cell, marks);
      line.append(node);
    }
    if (headerDone) {
      body.append(line);
    } else {
      const head = element("thead");
      head.append(line);
      table.append(head);
      table.append(body);
      headerDone = true;
    }
  }
  parent.append(table);
}

// Cuts prose into paragraphs, headings, lists and tables.
function splitBlocks(text) {
  const lines = text.split("\n");
  const blocks = [];
  let paragraph = [];
  let index = 0;
  const flush = () => {
    if (paragraph.length > 0) {
      blocks.push({ type: "paragraph", lines: paragraph });
      paragraph = [];
    }
  };
  while (index < lines.length) {
    const line = lines[index];
    if (line.trim() === "") {
      flush();
      index += 1;
      continue;
    }
    if (line.trim().startsWith("|")) {
      flush();
      const rows = [];
      while (index < lines.length && lines[index].trim().startsWith("|")) {
        rows.push(lines[index]);
        index += 1;
      }
      blocks.push({ type: "table", rows });
      continue;
    }
    const heading = /^#{1,6}\s+(.*)$/.exec(line);
    if (heading) {
      flush();
      blocks.push({ type: "heading", text: heading[1] });
      index += 1;
      continue;
    }
    const marker = /^\s*(?:[-*+]|\d+[.)])\s+(.*)$/.exec(line);
    if (marker) {
      flush();
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const items = [];
      while (index < lines.length) {
        const next = /^\s*(?:[-*+]|\d+[.)])\s+(.*)$/.exec(lines[index]);
        if (!next) break;
        items.push(next[1]);
        index += 1;
      }
      blocks.push({ type: "list", ordered, items });
      continue;
    }
    paragraph.push(line);
    index += 1;
  }
  flush();
  return blocks;
}

function renderBlocks(parent, text, marks) {
  for (const block of splitBlocks(text)) {
    if (block.type === "table") {
      renderTable(parent, block.rows, marks);
      continue;
    }
    if (block.type === "list") {
      const list = element(block.ordered ? "ol" : "ul");
      for (const item of block.items) {
        const entry = element("li");
        appendInline(entry, item, marks);
        list.append(entry);
      }
      parent.append(list);
      continue;
    }
    if (block.type === "heading") {
      const heading = element("h3");
      appendInline(heading, block.text, marks);
      parent.append(heading);
      continue;
    }
    const paragraph = element("p");
    appendInline(paragraph, block.lines.join("\n"), marks);
    parent.append(paragraph);
  }
}

// Cuts text into prose and fenced code. A fence's info string ("```rust")
// becomes the segment's language. An unclosed fence, which a shortened answer
// can leave, runs to the end of the text. The Claude export also wraps code in
// <antArtifact language="..."> tags instead of fences; those count as fences.
function fenceOf(line, inCode) {
  const fence = /^\s*(```+|~~~+)\s*([\w+#.-]*)/.exec(line);
  if (fence) return { lang: fence[2] };
  const artifact = /<antArtifact\b[^>]*>/.exec(line);
  if (!inCode && artifact) {
    const type = /type="([^"]*)"/.exec(artifact[0]);
    const language = /language="([^"]*)"/.exec(artifact[0]);
    const isCode = language || (type && type[1] === "application/vnd.ant.code");
    if (isCode) return { lang: language ? language[1] : "", rest: line.slice(artifact.index + artifact[0].length) };
  }
  if (inCode && /<\/antArtifact>/.test(line)) return { lang: "", rest: line.replace(/<\/antArtifact>.*/, "") };
  return null;
}

function splitFences(text) {
  const segments = [];
  let current = { code: false, lang: "", lines: [] };
  for (const line of text.split("\n")) {
    const fence = fenceOf(line, current.code);
    if (fence) {
      if (current.code && fence.rest && fence.rest.trim()) current.lines.push(fence.rest);
      segments.push(current);
      current = current.code
        ? { code: false, lang: "", lines: [] }
        : { code: true, lang: fence.lang.toLowerCase(), lines: fence.rest && fence.rest.trim() ? [fence.rest] : [] };
      continue;
    }
    current.lines.push(line);
  }
  segments.push(current);
  return segments.filter((segment) => segment.lines.join("").trim() !== "");
}

// A small highlighter for the languages in the training set. It is a lexer,
// not a parser: it colours comments, strings, numbers, keywords, types,
// macros, attributes and lifetimes, which is what a reviewer scans for.
const KEYWORDS = {
  rust: "as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while",
  python: "and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return self True try while with yield",
  go: "break case chan const continue default defer else fallthrough for func go goto if import interface map nil package range return select struct switch type var true false",
  c: "auto bool break case char class const constexpr continue default delete do double else enum explicit extern false float for if inline int long namespace new nullptr private protected public return short signed sizeof static struct switch template this true typedef typename union unsigned using virtual void volatile while __global__ __device__ __host__ __shared__",
  shell: "if then else elif fi for in do done while case esac function return export local set echo cd",
  data: "true false null",
};
const LANG_ALIASES = {
  rs: "rust", rust: "rust", py: "python", python: "python", go: "go", golang: "go",
  c: "c", h: "c", cpp: "c", "c++": "c", cc: "c", hpp: "c", cu: "c", cuda: "c",
  sh: "shell", bash: "shell", shell: "shell", console: "shell", zsh: "shell",
  toml: "data", json: "data", yaml: "data", yml: "data", ini: "data",
};
const KEYWORD_SETS = Object.fromEntries(
  Object.entries(KEYWORDS).map(([name, words]) => [name, new Set(words.split(" "))]));
const NEVER = String.raw`(?!)`;

// The language to colour a block as. An unlabelled fence takes the origin's
// file extension, and failing that is treated as Rust, the common case here.
function languageOf(lang, origin) {
  if (LANG_ALIASES[lang]) return LANG_ALIASES[lang];
  if (lang) return "";
  const extension = /\.(\w+)$/.exec(origin || "");
  if (extension && LANG_ALIASES[extension[1]]) return LANG_ALIASES[extension[1]];
  return "rust";
}

const TOKEN_KINDS = ["comment", "string", "attr", "lifetime", "number", "macro", "word"];

// One regex per language, with a named group per token kind; the first group
// that matched names the token.
function lexer(language) {
  const hashComments = ["python", "shell", "data"].includes(language);
  const strings = {
    python: String.raw`"""[\s\S]*?"""|'''[\s\S]*?'''|[rbf]?"(?:\\.|[^"\\\n])*"|[rbf]?'(?:\\.|[^'\\\n])*'`,
    rust: String.raw`b?r(?<hashes>#*)"[\s\S]*?"\k<hashes>|b?"(?:\\.|[^"\\])*"|b?'(?:\\.|[^'\\\n])'`,
  };
  const patterns = {
    comment: hashComments ? String.raw`#.*` : String.raw`\/\/.*|\/\*[\s\S]*?\*\/`,
    string: strings[language] || String.raw`"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|` + "`[^`]*`",
    attr: language === "rust" ? String.raw`#!?\[[^\]\n]*\]` : language === "python" ? String.raw`@\w+` : NEVER,
    lifetime: language === "rust" ? String.raw`'[a-z_]\w*\b(?!')` : NEVER,
    number: String.raw`\b(?:0x[\da-fA-F_]+|\d[\d_]*(?:\.\d[\d_]*)?(?:e[+-]?\d+)?)(?:[iu](?:8|16|32|64|128|size)|f32|f64)?\b`,
    macro: language === "rust" ? String.raw`\b[a-z_]\w*!` : NEVER,
    word: String.raw`\b[A-Za-z_]\w*\b`,
  };
  return new RegExp(TOKEN_KINDS.map((kind) => `(?<${kind}>${patterns[kind]})`).join("|"), "g");
}

// Coloured ranges over `text`: [{start, end, kind}], gaps left uncoloured.
function tokenize(text, language) {
  if (!language) return [];
  const keywords = KEYWORD_SETS[language];
  const tokens = [];
  for (const match of text.matchAll(lexer(language))) {
    const word = match[0];
    const kind = TOKEN_KINDS.find((name) => match.groups[name] !== undefined);
    const next = text[match.index + word.length];
    const style = kind !== "word" ? kind
      : keywords.has(word) ? "keyword"
      : /^[A-Z]/.test(word) ? "type"
      : next === "(" ? "call"
      : "";
    if (style) tokens.push({ start: match.index, end: match.index + word.length, kind: style });
  }
  return tokens;
}

// Splits `text` at every token and mark boundary, so a slop mark can cross
// highlighted tokens without breaking either.
function styledRuns(text, tokens, marks) {
  const cuts = new Set([0, text.length]);
  for (const range of [...tokens, ...marks]) { cuts.add(range.start); cuts.add(range.end); }
  const points = [...cuts].sort((first, second) => first - second);
  return points.slice(0, -1).map((start, position) => {
    const end = points[position + 1];
    const token = tokens.find((candidate) => candidate.start <= start && end <= candidate.end);
    const mark = marks.find((candidate) => candidate.start <= start && end <= candidate.end);
    return { text: text.slice(start, end), kind: token ? token.kind : "", mark };
  }).filter((run) => run.text !== "");
}

function codeBar(body, lang, language) {
  const bar = element("figcaption", "code-bar");
  const lineCount = body.split("\n").length;
  const copy = element("button", "code-copy", "Copy");
  copy.addEventListener("click", async () => {
    await navigator.clipboard.writeText(body).catch(() => {});
    toast("Code copied");
  });
  bar.append(
    element("span", "code-lang", lang || (language ? `${language}?` : "text")),
    element("span", "code-lines", `${lineCount} line${lineCount === 1 ? "" : "s"}`),
    copy,
  );
  return bar;
}

// One fenced block: a bar with the language, line count and a copy button,
// then the code with line numbers. Line numbers are CSS counters, so they are
// not part of a text selection and a flagged span stays clean.
function renderCode(parent, body, lang, origin, slopSpans, suggestions, violations) {
  const language = languageOf(lang, origin);
  const block = element("figure", body.split("\n").length < 3 ? "code-block short" : "code-block");
  const pre = element("pre");
  const code = element("code");
  const runs = styledRuns(body, tokenize(body, language), highlightRanges(body, slopSpans, suggestions));
  const sourceLines = body.split("\n");
  const tagLine = (node, number) => {
    const text = (sourceLines[number] || "").trim();
    const broken = violations.filter((violation) => text !== "" && violation.line === text);
    if (broken.length === 0) return;
    node.classList.add("violation");
    const tag = element("span", "rule-tag", broken.map((violation) => violation.rule).join(" · "));
    tag.title = broken.map((violation) => `${violation.rule}: ${violation.detail}`).join("\n");
    node.prepend(tag);
  };
  let lineNumber = 0;
  let line = element("span", "line");
  for (const run of runs) {
    run.text.split("\n").forEach((piece, position) => {
      if (position > 0) {
        line.append("\n");
        tagLine(line, lineNumber);
        code.append(line);
        lineNumber += 1;
        line = element("span", "line");
      }
      if (piece === "") return;
      let node = run.kind ? element("span", `tok-${run.kind}`, piece) : document.createTextNode(piece);
      if (run.mark) {
        const mark = markFor(run.mark);
        mark.append(node);
        node = mark;
      }
      line.append(node);
    });
  }
  tagLine(line, lineNumber);
  code.append(line);
  pre.append(code);
  block.append(codeBar(body, lang, language), pre);
  parent.append(block);
}

function renderText(parent, text, slopSpans, origin, suggestions = [], violations = []) {
  for (const segment of splitFences(text)) {
    const body = segment.lines.join("\n").replace(/\n+$/, "");
    if (segment.code) {
      renderCode(parent, body, segment.lang, origin, slopSpans, suggestions, violations);
      continue;
    }
    const prose = element("div", "prose");
    renderBlocks(prose, body, { spans: slopSpans, suggestions });
    parent.append(prose);
  }
}

// The phrases to suggest in one field: what Stage 0 found in the answer, and
// every phrase a reviewer has marked anywhere. Phrases already marked on this
// example are left to the slop marks.
const OWN_SOURCES = new Set(["readability", "clever_vs_readable"]);

function suggestionsFor(example, field) {
  if (field !== "response" || OWN_SOURCES.has(example.source)) return [];
  const marked = new Set(spansOf(example, field).map((span) => span.text.toLowerCase()));
  const fromStage0 = ((example.suggestions || {}).slop || [])
    .map((hit) => ({ text: hit.text, category: hit.category, from: "Stage 0 phrase list" }));
  const learned = learnedPhrases
    .map((phrase) => ({ text: phrase.text, category: phrase.category, from: `you marked it in ${phrase.examples}` }));
  return [...fromStage0, ...learned].filter((suggestion) => !marked.has(suggestion.text.toLowerCase()));
}

function violationsOf(example) {
  return (example.suggestions || {}).violations || [];
}

// ---------------------------------------------------------------------------
// State. Everything below belongs to the dataset picked in the rail; switching
// datasets resets it.
const PAGE_SIZE = 20;
const DATASET_TITLES = {
  train: ["Training set", "Books, docs, chat export and your own pairs"],
  teacher: ["Teacher set", "Conversations the teacher wrote, checked by toolchains"],
  conversations: ["Distilled conversations", "Questions from the teacher, answers from the books"],
};
let datasets = [];
let dataset = "";
let slopFlags = new Map();
let pageCache = new Map();
let reviewed = new Set();
let shown = [];
let page = 0;
let filteredTotal = 0;
let total = 0;
let flaggedCount = 0;
let learnedPhrases = [];
let phraseSearch = null;
let focusIndex = -1;
let orphans = [];
let pendingOrphan = null;
let selection = null;
const toggles = { flagged: false, unreviewed: false, sensitive: false };

const $ = (id) => document.getElementById(id);

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function toast(message) {
  const node = $("toast");
  node.textContent = message;
  node.classList.add("on");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => node.classList.remove("on"), 1600);
}

function storageGet(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || "null") ?? fallback; } catch { return fallback; }
}

function storageSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private window: keep it in memory */ }
}

function rememberReviewed() {
  storageSet(`reviewed:${dataset}`, [...reviewed].slice(-20000));
}

// Every API call names the dataset it is about.
function api(path, params = new URLSearchParams()) {
  params.set("dataset", dataset);
  return `${path}?${params}`;
}

async function fetchJson(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`${url}: ${response.statusText}`);
  return response.json();
}

async function postJson(path, body) {
  const response = await fetch(api(path), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function categoryColor(category) {
  return `var(--c-${category}, var(--slop))`;
}

// A mark for one highlighted range, coloured by its slop category.
function markFor(range, text) {
  const mark = element("mark", range.kind === "sensitive" ? "" : range.kind, text);
  mark.title = range.label || "";
  if (range.category) {
    mark.dataset.category = range.category;
    mark.style.setProperty("--cat", categoryColor(range.category));
  }
  return mark;
}

function spansOf(example, field) {
  const flag = slopFlags.get(example.id);
  if (!flag) return [];
  return flag.spans.filter((span) => span.field === field);
}

async function loadPhrases() {
  const data = await fetchJson(api("/api/phrases")).catch(() => ({ phrases: [] }));
  learnedPhrases = data.phrases || [];
}

// ---------------------------------------------------------------------------
// Datasets and filters.
function datasetTitle(name) {
  return (DATASET_TITLES[name] || [name.replace(/[-_]/g, " ")])[0];
}

function renderDatasets(missing) {
  const list = $("datasets");
  list.replaceChildren();
  for (const info of datasets) {
    const button = element("button", `dataset${info.name === dataset ? " active" : ""}`);
    button.type = "button";
    const sub = element("span", "sub");
    sub.append(document.createTextNode(`${(DATASET_TITLES[info.name] || ["", info.file])[1]} · `), element("b", "", `${info.flagged.toLocaleString()} flagged`));
    button.append(element("span", "name", datasetTitle(info.name)), element("span", "count", info.records.toLocaleString()), sub);
    button.addEventListener("click", () => switchDataset(info.name));
    list.append(button);
  }
  $("missing").textContent = missing.length ? `Not built yet: ${missing.join(", ")}` : "";
}

async function switchDataset(name) {
  if (name === dataset) return;
  dataset = name;
  storageSet("dataset", name);
  history.replaceState(null, "", `#${name}`);
  await loadDataset();
}

function filterParams() {
  const params = new URLSearchParams();
  const query = $("search").value.trim();
  if (query) params.set("q", query);
  if ($("source").value) params.set("source", $("source").value);
  if ($("collection").value) params.set("collection", $("collection").value);
  if (toggles.flagged) params.set("flagged", "1");
  return params;
}

function pageUrl(index) {
  const params = filterParams();
  params.set("start", String(index * PAGE_SIZE));
  params.set("limit", String(PAGE_SIZE));
  return api("/api/page", params);
}

async function fetchPage(index) {
  const url = pageUrl(index);
  if (pageCache.has(url)) return pageCache.get(url);
  const data = await fetchJson(url);
  if (pageCache.size > 40) pageCache.delete(pageCache.keys().next().value);
  pageCache.set(url, data);
  return data;
}

function rememberFlags(items) {
  for (const item of items) {
    if (item.flag) slopFlags.set(item.id, { note: item.flag.note || "", spans: item.flag.spans || [] });
  }
}

function normalize(example) {
  example.hits = highlightRanges(`${example.instruction || ""}\n${example.response || ""}`, []);
  return example;
}

async function showPage(index) {
  page = Math.max(0, index);
  const data = await fetchPage(page);
  filteredTotal = data.total;
  const pages = Math.max(1, Math.ceil(filteredTotal / PAGE_SIZE));
  if (page >= pages && page > 0) return showPage(pages - 1);
  let items = data.items.map(normalize);
  rememberFlags(items);
  if (toggles.sensitive) items = items.filter((example) => example.hits.length > 0);
  if (toggles.unreviewed) items = items.filter((example) => !reviewed.has(example.id) && !slopFlags.has(example.id));
  shown = items;
  render();
  fetchPage(page + 1).catch(() => {});
}

async function applyFilters() {
  pageCache.clear();
  focusIndex = -1;
  await showPage(0);
  renderPhraseBar();
}

function render() {
  const pages = Math.max(1, Math.ceil(filteredTotal / PAGE_SIZE));
  $("page-info").textContent = `${filteredTotal.toLocaleString()} · page ${page + 1} of ${pages.toLocaleString()}`;
  $("prev").disabled = page === 0;
  $("next").disabled = page >= pages - 1;
  const list = $("list");
  list.replaceChildren();
  if (shown.length === 0) list.append(element("p", "empty", "Nothing here matches. Change the filters or the search."));
  for (const example of shown) list.append(card(example));
  summarize();
}

function summarize() {
  const spanCount = [...slopFlags.values()].reduce((sum, flag) => sum + flag.spans.length, 0);
  const stats = $("stats");
  stats.replaceChildren();
  const stat = (value, label) => {
    const node = element("div", "stat");
    node.append(element("b", "", value.toLocaleString()), element("span", "", label));
    return node;
  };
  stats.append(stat(total, "records"), stat(flaggedCount, "flagged"), stat(reviewed.size, "marked good"), stat(spanCount, "marked phrases here"));
  const done = Math.min(total, reviewed.size + flaggedCount);
  const percent = total ? (100 * done) / total : 0;
  $("progress-fill").style.width = `${percent.toFixed(2)}%`;
  $("progress-label").textContent = `${done.toLocaleString()} of ${total.toLocaleString()} reviewed (${percent.toFixed(1)}%)`;
}

// ---------------------------------------------------------------------------
// One example.
function card(example) {
  const article = element("article");
  article.dataset.id = example.id;
  article.classList.toggle("flagged", slopFlags.has(example.id));
  article.classList.toggle("good", !slopFlags.has(example.id) && reviewed.has(example.id));
  article.append(cardHead(example));
  if (example.source_text) article.append(grounding(example));
  if (Array.isArray(example.notes) && example.notes.length > 0) article.append(notesOf(example));
  if (Array.isArray(example.messages)) {
    article.append(...conversationParts(example));
  } else {
    const isPassage = (example.instruction || "").trim() === "";
    if (!isPassage) article.append(part(example, "instruction", "Instruction"));
    article.append(part(example, "response", isPassage ? "Passage (training text, no question)" : "Response"));
  }
  article.append(curationPanel(example));
  return article;
}

function cardHead(example) {
  const head = element("div", "card-head");
  const isGood = reviewed.has(example.id) && !slopFlags.has(example.id);
  head.append(
    element("span", `dot${reviewed.has(example.id) || slopFlags.has(example.id) ? " on" : ""}`),
    element("span", "", `#${example.position + 1}`),
    element("span", "badge", example.source_title || example.source),
  );
  if (example.collection_title) head.append(element("span", "collection", example.collection_title));
  const origin = element("span", "origin", example.origin);
  origin.title = example.entry ? `${example.origin} (entry ${example.entry})` : example.origin;
  head.append(origin);
  if (example.licence) head.append(element("span", "chip", example.licence));
  head.append(element("span", "spacer"));
  const verdict = element("div", "verdict");
  const good = element("button", `good${isGood ? " on" : ""}`);
  good.type = "button";
  good.title = "Nothing to flag: mark as reviewed and good (a)";
  good.append("✓ Good", element("kbd", "", "a"));
  good.addEventListener("click", () => markGood(example));
  const slop = element("button", `slop${slopFlags.has(example.id) ? " on" : ""}`);
  slop.type = "button";
  slop.title = slopFlags.has(example.id) ? "Remove the flag" : "Flag the whole example as slop (f)";
  slop.append(slopFlags.has(example.id) ? "⚑ Flagged" : "⚑ Slop", element("kbd", "", "f"));
  slop.addEventListener("click", () => toggleSlop(example));
  verdict.append(good, slop);
  head.append(verdict);
  if (example.hits.length > 0) {
    head.append(element("div", "hits", `Possible ${[...new Set(example.hits.map((hit) => hit.label))].join(", ")}`));
  }
  return head;
}

function grounding(example) {
  const details = element("details", "grounding");
  const summary = element("summary");
  summary.append(`Written from ${example.origin}`);
  if (example.licence) summary.append(element("span", "chip", example.licence));
  details.append(summary);
  const body = element("div", "body");
  const isCode = /\.(rs|go|py|java|js|ts|c|h|cc|cpp|hpp)$/.test(example.origin);
  renderText(body, isCode ? "```\n" + example.source_text + "\n```" : example.source_text, [], example.origin);
  details.append(body);
  return details;
}

function notesOf(example) {
  const box = element("div", "notes");
  for (const note of example.notes) box.append(element("div", "", `Kept as a note: ${note}`));
  return box;
}

function part(example, field, label) {
  const section = element("section", "part");
  section.dataset.field = field;
  const head = element("div", "label");
  head.append(element("span", "", label));
  if (field === "response" && example.response_chars) head.append(element("span", "size", `${example.response_chars.toLocaleString()} chars`));
  section.append(head);
  const trimmed = field === "response" && example.shortened;
  const body = element("div", trimmed ? "shortened" : "");
  renderText(body, example[field] || "", spansOf(example, field), example.origin,
    suggestionsFor(example, field), field === "response" ? violationsOf(example) : []);
  section.append(body);
  if (trimmed) {
    const more = element("button", "more", `Load the full answer (${example.response_chars.toLocaleString()} chars)`);
    more.addEventListener("click", () => expand(example, section));
    section.append(more);
  }
  return section;
}

async function expand(example, section) {
  const params = new URLSearchParams({ position: String(example.position) });
  Object.assign(example, await fetchJson(api("/api/record", params)));
  normalize(example);
  section.replaceWith(part(example, "response", (example.instruction || "").trim() === "" ? "Passage (training text, no question)" : "Response"));
  toast("Full answer loaded");
}

// A conversation: each user turn is the instruction side of a flag, each
// assistant turn the response side.
function conversationParts(example) {
  const parts = [];
  const assistantName = dataset === "conversations" ? "Book" : "Teacher";
  for (const message of example.messages.filter((entry) => entry.role === "user" || entry.role === "assistant")) {
    const field = message.role === "user" ? "instruction" : "response";
    const turn = element("section", `turn ${message.role} part`);
    turn.dataset.field = field;
    const avatar = element("div", "avatar", message.role === "user" ? "U" : assistantName[0]);
    avatar.title = message.role === "user" ? "User" : assistantName;
    const body = element("div", message.role === "user" ? "bubble" : "");
    renderText(body, message.content, spansOf(example, field), example.origin, suggestionsFor({ ...example, response: message.content }, field));
    turn.append(avatar, body);
    parts.push(turn);
  }
  if (Array.isArray(example.rejected) && example.rejected.length > 0) {
    const section = element("section", "part rejected");
    const head = element("div", "label");
    head.append(element("span", "", `Questions thrown away (${example.rejected.length})`));
    const list = element("ul", "spans");
    for (const entry of example.rejected) {
      const item = element("li");
      item.append(element("span", "category", entry.reason), element("span", "quote", `“${entry.question}”`));
      list.append(item);
    }
    section.append(head, list);
    parts.push(section);
  }
  return parts;
}

// Under each example: the marked phrases, and the note of a flag.
function curationPanel(example) {
  const panel = element("div", "curation");
  const flag = slopFlags.get(example.id);
  if (!flag) {
    if (!reviewed.has(example.id)) panel.append(element("div", "hint", "Select any text above to mark it with a slop category, or use Good / Slop."));
    return panel;
  }
  const list = element("ul", "spans");
  flag.spans.forEach((span, position) => {
    const item = element("li");
    const swatch = element("span", "swatch");
    swatch.style.background = categoryColor(span.category);
    const everywhere = element("button", "", "Find everywhere");
    everywhere.title = "List every example whose answer contains this phrase, and mark it in all of them";
    everywhere.addEventListener("click", () => findEverywhere(span));
    const remove = element("button", "", "Remove");
    remove.addEventListener("click", () => saveFlag(example, { note: flag.note, spans: flag.spans.filter((_, index) => index !== position) }));
    item.append(swatch, element("span", "category", CATEGORY_LABELS.get(span.category) || span.category), element("span", "quote", `“${span.text}”`), everywhere, remove);
    list.append(item);
  });
  const row = element("div", "note-row");
  const note = element("input");
  note.placeholder = "Why is this slop? (optional)";
  note.value = flag.note;
  note.addEventListener("keydown", (event) => { if (event.key === "Enter") saveFlag(example, { note: note.value, spans: flag.spans }); });
  const save = element("button", "", "Save note");
  save.addEventListener("click", () => saveFlag(example, { note: note.value, spans: flag.spans }));
  row.append(note, save);
  panel.append(list, row);
  return panel;
}

function replaceCard(example) {
  const old = document.querySelector(`#list article[data-id="${CSS.escape(example.id)}"]`);
  if (!old) return;
  const fresh = card(example);
  fresh.classList.toggle("focused", old.classList.contains("focused"));
  old.replaceWith(fresh);
}

async function saveFlag(example, flag) {
  const wasFlagged = slopFlags.has(example.id);
  let note = flag ? flag.note.trim() : "";
  if (flag && pendingOrphan) note = note ? `${pendingOrphan.note} | ${note}` : pendingOrphan.note;
  const body = flag ? { id: example.id, note, spans: flag.spans, flagged: true } : { id: example.id, flagged: false };
  try {
    await postJson("/api/flag", body);
  } catch (error) {
    toast(`Not saved: ${error.message}`);
    return;
  }
  if (flag) {
    slopFlags.set(example.id, { note, spans: flag.spans });
    reviewed.delete(example.id);
    if (!wasFlagged) flaggedCount += 1;
  } else {
    slopFlags.delete(example.id);
    if (wasFlagged) flaggedCount = Math.max(0, flaggedCount - 1);
  }
  rememberReviewed();
  if (flag && pendingOrphan) {
    const orphan = pendingOrphan;
    pendingOrphan = null;
    await postJson("/api/flag", { id: orphan.id, flagged: false }).catch(() => {});
    orphans = orphans.filter((entry) => entry.id !== orphan.id);
    flaggedCount = Math.max(0, flaggedCount - 1);
    renderOrphans();
  }
  pageCache.clear();
  await loadPhrases();
  replaceCard(example);
  updateDatasetCount();
  summarize();
}

function updateDatasetCount() {
  const info = datasets.find((entry) => entry.name === dataset);
  if (info) info.flagged = flaggedCount;
  renderDatasets(missingDatasets);
}

async function toggleSlop(example) {
  if (slopFlags.has(example.id)) {
    await saveFlag(example, null);
    toast("Flag removed");
  } else {
    await saveFlag(example, { note: "", spans: [] });
    toast("Flagged as slop");
  }
}

async function markGood(example) {
  if (slopFlags.has(example.id)) await saveFlag(example, null);
  reviewed.add(example.id);
  rememberReviewed();
  replaceCard(example);
  summarize();
  toast("Marked good");
}

// ---------------------------------------------------------------------------
// Marking text: select it, then pick a category in the pop-up (or press 1-8).
function selectionTarget() {
  const current = window.getSelection();
  const text = current.toString().trim();
  if (!text || current.rangeCount === 0) return null;
  const range = current.getRangeAt(0);
  const container = range.commonAncestorContainer;
  const start = container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement;
  const section = start.closest("[data-field]");
  const article = start.closest("article");
  if (!section || !article) return null;
  const example = shown.find((candidate) => candidate.id === article.dataset.id);
  if (!example) return null;
  return { example, field: section.dataset.field, text, rect: range.getBoundingClientRect() };
}

function showPopover(target) {
  selection = target;
  const box = $("popover");
  box.replaceChildren(element("div", "quote", `Mark “${target.text}” as…`));
  SLOP_CATEGORIES.forEach(([value, label], position) => {
    const button = element("button");
    button.type = "button";
    const swatch = element("span", "swatch");
    swatch.style.background = categoryColor(value);
    button.append(swatch, label, element("kbd", "", String(position + 1)));
    button.addEventListener("mousedown", (event) => event.preventDefault());
    button.addEventListener("click", () => markSelection(value));
    box.append(button);
  });
  box.hidden = false;
  const width = box.offsetWidth;
  const left = Math.min(window.innerWidth - width - 12, Math.max(12, target.rect.left + target.rect.width / 2 - width / 2));
  const below = target.rect.bottom + 8 + box.offsetHeight < window.innerHeight;
  box.style.left = `${left}px`;
  box.style.top = `${below ? target.rect.bottom + 8 : Math.max(12, target.rect.top - box.offsetHeight - 8)}px`;
}

function hidePopover() {
  $("popover").hidden = true;
  selection = null;
}

async function markSelection(category) {
  if (!selection) return;
  const { example, field, text } = selection;
  hidePopover();
  window.getSelection().removeAllRanges();
  const flag = slopFlags.get(example.id) || { note: "", spans: [] };
  await saveFlag(example, { note: flag.note, spans: [...flag.spans, { field, text, category }] });
  toast(`Marked as ${CATEGORY_LABELS.get(category)}`);
}

document.addEventListener("mouseup", (event) => {
  if (event.target instanceof Element && event.target.closest("#popover")) return;
  setTimeout(() => {
    const target = selectionTarget();
    if (target) showPopover(target); else hidePopover();
  }, 0);
});

document.addEventListener("click", (event) => {
  const mark = event.target instanceof Element && event.target.closest("mark.suggest");
  if (!mark) return;
  const article = mark.closest("article");
  const section = mark.closest("[data-field]");
  const example = article && shown.find((candidate) => candidate.id === article.dataset.id);
  if (!example || !section) return;
  const flag = slopFlags.get(example.id) || { note: "", spans: [] };
  saveFlag(example, { note: flag.note, spans: [...flag.spans, { field: section.dataset.field, text: mark.textContent, category: mark.dataset.category }] });
});

// ---------------------------------------------------------------------------
// A phrase everywhere, and flags whose example is gone.
async function findEverywhere(span) {
  phraseSearch = { text: span.text, category: span.category };
  $("search").value = span.text;
  $("source").value = "";
  $("collection").value = "";
  toggles.flagged = false;
  syncToggles();
  await applyFilters();
  window.scrollTo({ top: 0 });
}

function renderPhraseBar() {
  const bar = $("phrase-bar");
  bar.replaceChildren();
  bar.hidden = !phraseSearch || $("search").value !== phraseSearch.text;
  if (bar.hidden) return;
  const label = CATEGORY_LABELS.get(phraseSearch.category) || phraseSearch.category;
  bar.append(element("span", "", `“${phraseSearch.text}” appears in ${filteredTotal.toLocaleString()} examples.`));
  const all = element("button", "toggle on", `Mark it in all ${filteredTotal.toLocaleString()} as ${label}`);
  all.addEventListener("click", async () => {
    all.disabled = true;
    try {
      const result = await postJson("/api/flag-matches", phraseSearch);
      toast(`Marked in ${result.added} more examples (${result.matched} contain it)`);
      flaggedCount = (await fetchJson(api("/api/meta"))).flagged;
      updateDatasetCount();
      await loadPhrases();
      await applyFilters();
    } catch (error) {
      toast(`Not saved: ${error.message}`);
      all.disabled = false;
    }
  });
  const done = element("button", "toggle", "Done");
  done.addEventListener("click", async () => {
    phraseSearch = null;
    $("search").value = "";
    await applyFilters();
  });
  bar.append(all, done);
}

function renderOrphans() {
  const banner = $("orphans");
  banner.replaceChildren();
  banner.hidden = orphans.length === 0;
  if (orphans.length === 0) return;
  banner.append(element("strong", "", `${orphans.length} flag(s) point at an example this build no longer has. Re-point or clear them.`));
  for (const orphan of orphans) {
    const item = element("div", "item");
    const use = element("button", "toggle", "Use for next flag");
    use.addEventListener("click", () => { pendingOrphan = orphan; toast("The next example you flag gets this note"); });
    const clear = element("button", "toggle", "Clear");
    clear.addEventListener("click", async () => {
      await postJson("/api/flag", { id: orphan.id, flagged: false }).catch(() => {});
      orphans = orphans.filter((entry) => entry.id !== orphan.id);
      flaggedCount = Math.max(0, flaggedCount - 1);
      renderOrphans();
      summarize();
    });
    item.append(element("span", "", orphan.note || "(no note)"), element("span", "id mono", orphan.id), use, clear);
    banner.append(item);
  }
}

// ---------------------------------------------------------------------------
// Focus and keys.
function setFocus(index) {
  const articles = [...document.querySelectorAll("#list article")];
  if (articles.length === 0) return;
  focusIndex = Math.max(0, Math.min(articles.length - 1, index));
  articles.forEach((article, position) => article.classList.toggle("focused", position === focusIndex));
  articles[focusIndex].scrollIntoView({ block: "start", behavior: "smooth" });
}

async function go(delta) {
  await showPage(page + delta);
  focusIndex = -1;
  window.scrollTo({ top: 0 });
}

function syncToggles() {
  $("flagged-only").classList.toggle("on", toggles.flagged);
  $("unreviewed-only").classList.toggle("on", toggles.unreviewed);
  $("sensitive-only").classList.toggle("on", toggles.sensitive);
}

let searchTimer;
$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilters, 250);
});
$("search").addEventListener("keydown", (event) => { if (event.key === "Escape") $("search").blur(); });
$("source").addEventListener("change", () => { $("collection").value = ""; applyFilters(); });
$("collection").addEventListener("change", () => { $("source").value = ""; applyFilters(); });
for (const [id, key] of [["flagged-only", "flagged"], ["unreviewed-only", "unreviewed"], ["sensitive-only", "sensitive"]]) {
  $(id).addEventListener("click", () => { toggles[key] = !toggles[key]; syncToggles(); applyFilters(); });
}
$("prev").addEventListener("click", () => go(-1));
$("next").addEventListener("click", () => go(1));

document.addEventListener("keydown", (event) => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(event.target.tagName)) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (!$("popover").hidden) {
    const number = Number(event.key);
    if (number >= 1 && number <= SLOP_CATEGORIES.length) { event.preventDefault(); markSelection(SLOP_CATEGORIES[number - 1][0]); return; }
    if (event.key === "Escape") { hidePopover(); return; }
  }
  const focused = () => shown[focusIndex];
  const actions = {
    j: () => setFocus(focusIndex + 1),
    k: () => setFocus(focusIndex - 1),
    ArrowDown: () => setFocus(focusIndex + 1),
    ArrowUp: () => setFocus(focusIndex - 1),
    a: async () => { const example = focused(); if (example) { await markGood(example); setFocus(focusIndex + 1); } },
    f: () => { const example = focused(); if (example) toggleSlop(example); },
    e: () => {
      const example = focused();
      if (!example || !example.shortened) return;
      const section = document.querySelector(`#list article[data-id="${CSS.escape(example.id)}"] section[data-field="response"]`);
      if (section) expand(example, section);
    },
    n: () => go(1),
    p: () => go(-1),
    "/": () => $("search").focus(),
  };
  const action = actions[event.key];
  if (action) { event.preventDefault(); action(); }
});

// ---------------------------------------------------------------------------
// Loading.
let missingDatasets = [];

async function loadDataset() {
  slopFlags = new Map();
  pageCache = new Map();
  reviewed = new Set(storageGet(`reviewed:${dataset}`, []));
  phraseSearch = null;
  pendingOrphan = null;
  $("search").value = "";
  renderDatasets(missingDatasets);
  const meta = await fetchJson(api("/api/meta"));
  total = meta.total;
  flaggedCount = meta.flagged;
  $("title").textContent = datasetTitle(dataset);
  $("file").textContent = meta.file;
  const source = $("source");
  source.replaceChildren(new Option("All sources", ""));
  for (const entry of meta.sources) source.append(new Option(`${entry.title} (${entry.count.toLocaleString()})`, entry.name));
  const collection = $("collection");
  collection.replaceChildren(new Option("All books, docs and repositories", ""));
  const titles = new Map(meta.sources.map((entry) => [entry.name, entry.title]));
  for (const sourceName of [...new Set(meta.collections.map((entry) => entry.source))]) {
    const group = element("optgroup");
    group.label = titles.get(sourceName) || sourceName;
    for (const entry of meta.collections.filter((candidate) => candidate.source === sourceName)) {
      group.append(new Option(`${entry.title} (${entry.count.toLocaleString()})`, entry.name));
    }
    collection.append(group);
  }
  await loadPhrases();
  orphans = (await fetchJson(api("/api/orphans"))).orphans || [];
  renderOrphans();
  await applyFilters();
}

async function load() {
  const listed = await fetchJson("/api/datasets");
  datasets = listed.datasets;
  missingDatasets = listed.missing || [];
  const wanted = location.hash.slice(1) || storageGet("dataset", "");
  dataset = datasets.some((info) => info.name === wanted) ? wanted : datasets[0].name;
  await loadDataset();
}

load().catch((error) => { $("title").textContent = `Could not load: ${error.message}`; });
</script>
