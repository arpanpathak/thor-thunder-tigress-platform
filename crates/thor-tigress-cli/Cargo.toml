[package]
name = "thor-tigress-cli"
version = "0.1.0"
edition = "2024"
description = "The thor command: chooses an engine and a model, checks that it fits, and serves it."

[lints]
workspace = true

[dependencies]
inquire = "0.9.5"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
anyhow = "1"
tempfile = "3"

[lib]
name = "thor_tigress_cli"
path = "src/lib.rs"

[[bin]]
name = "thor-tigress"
path = "src/main.rs"
