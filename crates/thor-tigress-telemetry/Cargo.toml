[package]
name = "thor-tigress-telemetry"
version = "0.1.0"
edition = "2024"
description = "Ships the agent's request log and the engines' health to OpenObserve."

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
ureq = { version = "3.4.2", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "thor-tigress-telemetry"
path = "src/main.rs"
