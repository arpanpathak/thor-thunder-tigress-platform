[package]
name = "thor-hammer-trainer"
version = "0.1.0"
edition = "2024"
description = "Builds the instruction/response training set."
default-run = "thor-hammer-trainer"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
regex = "1"
serde_json = "1.0.151"
thor-spark-safety-eval = { path = "../thor-spark-safety-eval" }

[[bin]]
name = "thor-hammer-trainer"
path = "src/main.rs"

[[bin]]
name = "teacher"
path = "src/bin/teacher.rs"
