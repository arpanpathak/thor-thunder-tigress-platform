[package]
name = "thor-hammer-trainer"
version = "0.1.0"
edition = "2024"
description = "Builds the instruction/response training set."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
regex = "1"
serde_json = "1.0.151"

[[bin]]
name = "thor-hammer-trainer"
path = "src/main.rs"

[[bin]]
name = "review"
path = "src/bin/review.rs"
