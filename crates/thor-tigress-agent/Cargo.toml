[package]
name = "thor-tigress-agent"
version = "0.1.0"
edition = "2024"
description = "Front server for the Thor chat: serves the page, checks the access key, and lets the model search the web through SearXNG."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thor-tigress-keyring = { path = "../thor-tigress-keyring" }
zeroize = "1.9.1"

[[bin]]
name = "thor-tigress-agent"
path = "src/main.rs"
