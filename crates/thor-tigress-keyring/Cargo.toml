[package]
name = "thor-tigress-keyring"
version = "0.1.0"
edition = "2024"
description = "Encrypted registry of the people allowed to use the Thor Tigress Cub, and the keys they were given."

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zeroize = "1.9.1"

[lib]
name = "thor_tigress_keyring"
path = "src/lib.rs"

[[bin]]
name = "thor-tigress-keyring"
path = "src/main.rs"
