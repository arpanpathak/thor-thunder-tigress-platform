[workspace]
resolver = "3"
members = [
    "crates/thor-hammer-trainer",
    "crates/thor-lasso-distiller",
    "crates/thor-spark-safety-eval",
    "crates/thor-tigress-agent",
    "crates/thor-tigress-keyring",
    "crates/thor-tigress-reinforcer-frontend",
]

[workspace.lints.clippy]
too_many_lines = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
