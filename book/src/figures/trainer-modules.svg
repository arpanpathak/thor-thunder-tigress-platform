<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; font-family: "JetBrains Mono", Menlo, monospace; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .box { fill: #F4F7FA; stroke: #B0BEC5; stroke-width: 1.5; }
    .main { fill: #E8EEF6; stroke: #00838F; stroke-width: 2; }
    .reader { fill: #F4F7FA; stroke: #3B6FD4; stroke-width: 2; }
    .types { fill: #F4F7FA; stroke: #4E8A16; stroke-width: 2; }
    .out { fill: #F7F9FB; stroke: #D9542B; stroke-width: 2; }
    .call { stroke: #1E88A8; stroke-width: 1.8; fill: none; }
    .produce { stroke: #4E8A16; stroke-width: 1.8; fill: none; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" orient="auto">
      <path d="M0,0.8 L11,5 L0,9.2 L2.6,5 Z" fill="#1E88A8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" orient="auto">
      <path d="M0,0.8 L11,5 L0,9.2 L2.6,5 Z" fill="#4E8A16"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">thor-hammer-trainer modules</text>

  <!-- main -->
  <rect x="330" y="60" width="300" height="70" rx="10" class="main"/>
  <text x="480" y="88" class="name" text-anchor="middle">main.rs</text>
  <text x="480" y="110" class="note" text-anchor="middle">build_training_set: read, filter, write</text>

  <!-- readers -->
  <rect x="30" y="190" width="200" height="74" rx="10" class="reader"/>
  <text x="130" y="219" class="name" text-anchor="middle">readability.rs</text>
  <text x="130" y="241" class="note" text-anchor="middle">### Instruction / Response</text>

  <rect x="260" y="190" width="200" height="74" rx="10" class="reader"/>
  <text x="360" y="219" class="name" text-anchor="middle">chat.rs</text>
  <text x="360" y="241" class="note" text-anchor="middle">serde types, pairing</text>

  <rect x="490" y="190" width="200" height="74" rx="10" class="reader"/>
  <text x="590" y="219" class="name" text-anchor="middle">book.rs</text>
  <text x="590" y="241" class="note" text-anchor="middle">sections at # ## ###</text>

  <rect x="720" y="190" width="200" height="74" rx="10" class="reader"/>
  <text x="820" y="219" class="name" text-anchor="middle">code.rs</text>
  <text x="820" y="241" class="note" text-anchor="middle">header comment = request</text>

  <path class="call" d="M380,132 C380,170 130,150 130,186" marker-end="url(#arrow)"/>
  <path class="call" d="M440,132 C440,160 360,160 360,186" marker-end="url(#arrow)"/>
  <path class="call" d="M520,132 C520,160 590,160 590,186" marker-end="url(#arrow)"/>
  <path class="call" d="M580,132 C580,170 820,150 820,186" marker-end="url(#arrow)"/>

  <!-- shared types -->
  <rect x="250" y="320" width="460" height="74" rx="10" class="types"/>
  <text x="480" y="349" class="name" text-anchor="middle">example.rs</text>
  <text x="480" y="371" class="note" text-anchor="middle">Example { instruction, response, source, origin } and SkipReason</text>

  <path class="produce" d="M130,266 C130,300 220,340 248,350" marker-end="url(#arrow-green)"/>
  <path class="produce" d="M360,266 L400,318" marker-end="url(#arrow-green)"/>
  <path class="produce" d="M590,266 L560,318" marker-end="url(#arrow-green)"/>
  <path class="produce" d="M820,266 C820,300 740,340 712,350" marker-end="url(#arrow-green)"/>

  <!-- outputs -->
  <rect x="120" y="420" width="220" height="56" rx="10" class="out"/>
  <text x="230" y="444" class="name" text-anchor="middle">train.jsonl</text>
  <text x="230" y="463" class="note" text-anchor="middle">serde_json, one per line</text>

  <rect x="370" y="420" width="220" height="56" rx="10" class="out"/>
  <text x="480" y="444" class="name" text-anchor="middle">report.rs</text>
  <text x="480" y="463" class="note" text-anchor="middle">stats.md: counts and skips</text>

  <rect x="620" y="420" width="220" height="56" rx="10" class="box"/>
  <text x="730" y="444" class="name" text-anchor="middle">error.rs</text>
  <text x="730" y="463" class="note" text-anchor="middle">DataError: Io, Json</text>

  <path class="call" d="M400,396 L260,418" marker-end="url(#arrow)"/>
  <path class="call" d="M480,396 L480,418" marker-end="url(#arrow)"/>

  <text x="30" y="150" class="note">calls</text>
  <line x1="66" y1="146" x2="100" y2="146" class="call" marker-end="url(#arrow)"/>
  <text x="30" y="300" class="note">produces</text>
  <line x1="90" y1="296" x2="120" y2="296" class="produce" marker-end="url(#arrow-green)"/>
</svg>
