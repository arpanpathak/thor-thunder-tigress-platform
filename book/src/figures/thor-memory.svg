<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .label { fill: #1D2733; font-size: 13px; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
  </style>
  <rect width="900" height="330" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">128 GB of unified memory, shared by the CPU and the GPU</text>

  <!-- Scale: 780 px for 128 GB, so 6.094 px per GB, starting at x = 60 -->
  <rect x="60" y="62" width="780" height="34" rx="6" fill="#F4F7FA" stroke="#B0BEC5"/>
  <rect x="60" y="62" width="700.8" height="34" rx="6" fill="#E8EEF6" stroke="#3B6FD4" stroke-width="1.5"/>
  <text x="70" y="84" class="label">about 115 GB usable for a training job</text>
  <text x="772" y="84" class="note">OS</text>
  <text x="60" y="114" class="note mono">0</text>
  <text x="840" y="114" class="note mono" text-anchor="end">128 GB</text>

  <!-- Reported budgets -->
  <text x="60" y="150" class="note">Reported peak memory per training method (from the project notes, not measured here):</text>

  <rect x="60" y="164" width="170.6" height="28" rx="5" fill="#4E8A16" fill-opacity="0.18" stroke="#4E8A16"/>
  <text x="240" y="183" class="label">QLoRA, 27B model: about 28 GB</text>

  <rect x="60" y="202" width="255.9" height="28" rx="5" fill="#B7791F" fill-opacity="0.15" stroke="#B7791F"/>
  <text x="326" y="221" class="label">Full fine-tune, 4B model: about 42 GB</text>

  <rect x="60" y="240" width="304.7" height="28" rx="5" fill="#1E88A8" fill-opacity="0.15" stroke="#1E88A8"/>
  <text x="375" y="259" class="label">LoRA, 9B model: about 50 GB</text>

  <text x="60" y="300" class="note">Bandwidth: 273 GB/s. Each training step reads all weights,</text>
  <text x="60" y="318" class="note">so step time is bound by memory bandwidth, not compute.</text>
</svg>
