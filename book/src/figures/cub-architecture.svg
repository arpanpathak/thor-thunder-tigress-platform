  <text x="388.0" y="138.0" class="name" text-anchor="start" xml:space="preserve">voltforge.tech</text>
  <text x="388.0" y="156.0" class="sub" text-anchor="start" xml:space="preserve">forwarding page</text>
  <rect x="680" y="110" width="230" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M692,110.7 H686 V173.3 H692 A11.3,11.3 0 0 1 680.7,162 V122 A11.3,11.3 0 0 1 692,110.7 Z" fill="#7A4FD0"/>
  <rect x="696" y="126.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(702.0,132.0) scale(0.8333)"><path d="M24 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm-9 9a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm0-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm6-6a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM3 24a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm18 .5a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM6 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm9-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm-3 2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM6 3a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM3 5.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z" fill="#242424" fill-rule="evenodd"/></g>
  <text x="738.0" y="138.0" class="name" text-anchor="start" xml:space="preserve">Tailscale Funnel</text>
  <text x="738.0" y="156.0" class="sub" text-anchor="start" xml:space="preserve">HTTPS to the Thor</text>
  <path class="wire" d="M200,142 L330,142" marker-end="url(#head)"/>
  <path class="wire" d="M530,142 L680,142" marker-end="url(#head)"/>
  <text x="265.0" y="132.0" class="note" text-anchor="middle" xml:space="preserve">1. short address</text>
  <text x="605.0" y="132.0" class="note" text-anchor="middle" xml:space="preserve">2. the .ts.net name</text>
  <rect x="24" y="256" width="992" height="250" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="42" y="245" width="350.5" height="22" rx="11" fill="#1B2430"/>
  <text x="217.3" y="260.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">JETSON AGX THOR · EVERYTHING ON 127.0.0.1</text>
  <rect x="60" y="300" width="280" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,300.7 H66 V395.3 H72 A11.3,11.3 0 0 1 60.7,384 V312 A11.3,11.3 0 0 1 72,300.7 Z" fill="#1F8A70"/>
  <rect x="76" y="332.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(82.0,338.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="118.0" y="326.0" class="name" text-anchor="start" xml:space="preserve">thor-tigress-agent</text>
  <text x="118.0" y="344.0" class="sub" text-anchor="start" xml:space="preserve">:8080 · key, APIs</text>
  <text x="118.0" y="362.0" class="sub" text-anchor="start" xml:space="preserve">model picker</text>
  <text x="118.0" y="380.0" class="sub" text-anchor="start" xml:space="preserve">SearXNG :8888 when Web is on</text>
  <rect x="480" y="280" width="260" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M492,280.7 H486 V359.3 H492 A11.3,11.3 0 0 1 480.7,348 V292 A11.3,11.3 0 0 1 492,280.7 Z" fill="#1F8A70"/>
  <rect x="496" y="304.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(502.0,310.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="538.0" y="307.0" class="name" text-anchor="start" xml:space="preserve">llama.cpp</text>
  <text x="538.0" y="325.0" class="sub" text-anchor="start" xml:space="preserve">:8079 · GGUF</text>
  <text x="538.0" y="343.0" class="sub" text-anchor="start" xml:space="preserve">Nano · Lightning · Qwen 27B</text>
  <rect x="480" y="384" width="260" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M492,384.7 H486 V463.3 H492 A11.3,11.3 0 0 1 480.7,452 V396 A11.3,11.3 0 0 1 492,384.7 Z" fill="#5E9400"/>
  <rect x="496" y="408.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(502.0,414.0) scale(0.8333)"><path d="M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z" fill="#76B900" fill-rule="evenodd"/></g>
  <text x="538.0" y="411.0" class="name" text-anchor="start" xml:space="preserve">Edge-LLM</text>
  <text x="538.0" y="429.0" class="sub" text-anchor="start" xml:space="preserve">:8081 · NVFP4</text>
  <text x="538.0" y="447.0" class="sub" text-anchor="start" xml:space="preserve">Qwen3.6 35B A3B</text>
  <path class="wire" d="M795,174 L795,205 Q795,214 786,214 L209,214 Q200,214 200,223 L200,300" marker-end="url(#head)"/>
  <rect x="437.7" y="205.0" width="119.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="497.5" y="217.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">3. every request</text>
  <path class="wire" d="M340,336 L401,336 Q410,336 410.0,328.0 L410.0,328.0 Q410,320 419,320 L480,320" marker-end="url(#head)"/>
  <path class="wire" d="M340,360 L401,360 Q410,360 410,369 L410,415 Q410,424 419,424 L480,424" marker-end="url(#head)"/>
  <text x="772.0" y="366.0" class="note" text-anchor="start" xml:space="preserve">The picker&#x27;s model id</text>
  <text x="772.0" y="383.0" class="note" text-anchor="start" xml:space="preserve">chooses the engine.</text>
  <text x="60.0" y="430.0" class="note" text-anchor="start" xml:space="preserve">thor-tigress-serve loads and unloads on either engine,</text>
  <text x="60.0" y="447.0" class="note" text-anchor="start" xml:space="preserve">and checks the free memory first.</text>
</svg>
