<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="A browser or agent opens voltforge.tech, whose forwarding page sends it to the .ts.net address. Every request then goes through Tailscale Funnel to thor-tigress-agent on the Thor at :8080, which holds the key, the model picker and the APIs, and calls SearXNG at :8888 for web search. The picker's model id decides which engine runs the reply: the llama.cpp router at :8079 for the GGUF models, or TensorRT Edge-LLM at :8081 for Qwen3.6 35B A3B in NVFP4.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">How a request reaches a model</text>

  <text x="110" y="68" class="label" text-anchor="middle">1. short address</text>
  <text x="455" y="68" class="label" text-anchor="middle">2. the .ts.net name</text>

  <rect x="30" y="78" width="150" height="76" rx="10" class="outside"/>
  <text x="105" y="110" class="name" text-anchor="middle">Browser</text>
  <text x="105" y="132" class="note" text-anchor="middle">or agent</text>

  <rect x="250" y="78" width="170" height="76" rx="10" class="outside"/>
  <text x="335" y="110" class="name" text-anchor="middle">voltforge.tech</text>
  <text x="335" y="132" class="note" text-anchor="middle">forwarding page</text>

  <rect x="490" y="78" width="170" height="76" rx="10" class="outside"/>
  <text x="575" y="110" class="name" text-anchor="middle">Tailscale Funnel</text>
  <text x="575" y="132" class="note" text-anchor="middle">HTTPS to the Thor</text>

  <path class="flow" d="M180,116 L248,116" marker-end="url(#arrow)"/>
  <path class="flow" d="M420,116 L488,116" marker-end="url(#arrow)"/>
  <text x="612" y="176" class="label">3. every request</text>
  <path class="flow" d="M575,154 L575,188" marker-end="url(#arrow)"/>

  <rect x="200" y="190" width="730" height="210" rx="14" class="zone"/>
  <text x="214" y="212" class="zonelabel">Jetson AGX Thor: everything on 127.0.0.1</text>

  <rect x="220" y="240" width="200" height="110" rx="10" class="box built"/>
  <text x="320" y="268" class="name" text-anchor="middle">thor-tigress-agent</text>
  <text x="320" y="288" class="note" text-anchor="middle">:8080 · key, APIs</text>
  <text x="320" y="306" class="note" text-anchor="middle">model picker</text>
  <text x="320" y="324" class="note" text-anchor="middle">SearXNG :8888 when Web is on</text>

  <rect x="490" y="215" width="200" height="84" rx="10" class="box built"/>
  <text x="590" y="243" class="name" text-anchor="middle">llama.cpp</text>
  <text x="590" y="263" class="note" text-anchor="middle">:8079 · GGUF</text>
  <text x="590" y="281" class="note" text-anchor="middle">Nano · Lightning · Qwen 27B</text>

  <rect x="490" y="315" width="200" height="72" rx="10" class="box built"/>
  <text x="590" y="341" class="name" text-anchor="middle">Edge-LLM</text>
  <text x="590" y="361" class="note" text-anchor="middle">:8081 · NVFP4</text>
  <text x="590" y="379" class="note" text-anchor="middle">Qwen3.6 35B A3B</text>

  <path class="flow" d="M420,270 L486,270" marker-end="url(#arrow)"/>
  <path class="flow" d="M420,330 L486,330" marker-end="url(#arrow)"/>
  <text x="320" y="378" class="note" text-anchor="middle">the picker's model id chooses the engine</text>

  <text x="30" y="424" class="note">thor-tigress-serve loads and unloads on either engine, and checks the free memory first. Chapter "Model serving" has the list.</text>
</svg>
