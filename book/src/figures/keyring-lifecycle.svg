<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="A request makes a requested record; approve mints a key and makes it active; revoke takes the key away and keeps the record. revoke-all stops every active key at once with one command. The agent re-reads the file when it changes, so no restart is needed.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
    <marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D9542B"/>
    </marker>
  </defs>
  <rect width="960" height="320" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">The life of a key</text>

  <rect x="60" y="110" width="220" height="96" rx="10" class="box built"/>
  <text x="170" y="142" class="name" text-anchor="middle">requested</text>
  <text x="170" y="166" class="note" text-anchor="middle">waiting, no key yet</text>

  <rect x="370" y="110" width="220" height="96" rx="10" class="box built"/>
  <text x="480" y="142" class="name" text-anchor="middle">active</text>
  <text x="480" y="166" class="note" text-anchor="middle">the chat lets it in</text>

  <rect x="680" y="110" width="220" height="96" rx="10" class="box built"/>
  <text x="790" y="142" class="name" text-anchor="middle">revoked</text>
  <text x="790" y="166" class="note" text-anchor="middle">key erased,</text>
  <text x="790" y="184" class="note" text-anchor="middle">record kept</text>

  <text x="320" y="100" class="label" text-anchor="middle">approve EMAIL</text>
  <path class="flow" d="M280,158 L358,158" marker-end="url(#arrow)"/>
  <text x="630" y="100" class="label" text-anchor="middle">revoke EMAIL|KEY</text>
  <path class="flow" d="M590,158 L668,158" marker-end="url(#arrow)"/>

  <path class="deny" d="M480,206 L480,238" marker-end="url(#arrow-deny)"/>
  <text x="480" y="262" class="warn" text-anchor="middle">revoke-all: every active key at once</text>

  <text x="30" y="302" class="note">The agent re-reads the file when it changes: no restart.</text>
</svg>
