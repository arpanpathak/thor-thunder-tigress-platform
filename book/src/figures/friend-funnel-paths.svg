<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Three ways into the renamed Thor's Funnel and serve. Anyone on the internet reaches your chat at the root path. Her domain goes through a forwarding page to the friend-app path. Her own devices reach the same app privately on port 8443 with tailscale serve.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">Her app, her domain, one Funnel</text>

  <rect x="330" y="70" width="300" height="340" rx="14" class="zone"/>
  <text x="344" y="90" class="zonelabel mono">thor-tigress.cat-crocodile.ts.net</text>

  <rect x="30" y="120" width="270" height="70" rx="10" class="outside"/>
  <text x="165" y="148" class="name" text-anchor="middle">anyone on the internet</text>
  <text x="165" y="170" class="note" text-anchor="middle">https://…ts.net/</text>

  <rect x="360" y="120" width="240" height="70" rx="10" class="box built"/>
  <text x="480" y="148" class="name" text-anchor="middle">Funnel :443 · /</text>
  <text x="480" y="170" class="note" text-anchor="middle">your chat</text>

  <rect x="680" y="120" width="250" height="70" rx="10" class="outside"/>
  <text x="805" y="148" class="name mono" text-anchor="middle">thor-tigress-agent</text>
  <text x="805" y="170" class="note" text-anchor="middle">127.0.0.1:8080</text>

  <rect x="30" y="220" width="120" height="70" rx="10" class="outside"/>
  <text x="90" y="248" class="name" text-anchor="middle">her domain</text>
  <text x="90" y="270" class="note" text-anchor="middle">her hostname</text>

  <rect x="180" y="220" width="150" height="70" rx="10" class="outside"/>
  <text x="255" y="248" class="name" text-anchor="middle">forwarding page</text>
  <text x="255" y="270" class="note" text-anchor="middle">HTTPS, 302</text>

  <rect x="360" y="220" width="240" height="70" rx="10" class="box built"/>
  <text x="480" y="248" class="name" text-anchor="middle">Funnel :443 · /friend-app</text>
  <text x="480" y="270" class="note" text-anchor="middle">her app, public</text>

  <rect x="680" y="220" width="250" height="70" rx="10" class="outside"/>
  <text x="805" y="248" class="name" text-anchor="middle">her app</text>
  <text x="805" y="270" class="note" text-anchor="middle">127.0.0.1:9100</text>

  <rect x="30" y="320" width="270" height="70" rx="10" class="outside"/>
  <text x="165" y="348" class="name" text-anchor="middle">her devices, on the tailnet</text>
  <text x="165" y="370" class="note" text-anchor="middle">no public hop</text>

  <rect x="360" y="320" width="240" height="70" rx="10" class="box built"/>
  <text x="480" y="348" class="name mono" text-anchor="middle">serve :8443</text>
  <text x="480" y="370" class="note" text-anchor="middle">tailnet only</text>

  <rect x="680" y="320" width="250" height="70" rx="10" class="outside"/>
  <text x="805" y="348" class="name" text-anchor="middle">the same app</text>
  <text x="805" y="370" class="note" text-anchor="middle">stays private</text>

  <path class="flow" d="M302,155 L358,155" marker-end="url(#arrow)"/>
  <path class="flow" d="M602,155 L678,155" marker-end="url(#arrow)"/>
  <path class="flow" d="M152,255 L178,255" marker-end="url(#arrow)"/>
  <path class="flow" d="M332,255 L358,255" marker-end="url(#arrow)"/>
  <path class="flow" d="M602,255 L678,255" marker-end="url(#arrow)"/>
  <path class="flow" d="M302,355 L358,355" marker-end="url(#arrow)"/>
  <path class="flow" d="M602,355 L678,355" marker-end="url(#arrow)"/>

  <text x="30" y="440" class="note">One name, one certificate. The path or the port picks which app answers.</text>
</svg>
