<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Three ways into the renamed Thor's Funnel and serve. Anyone on the internet reaches your chat at the root path. Their domain goes through a forwarding page to the friend-app path. Their own devices reach the same app privately on port 8443 with tailscale serve.">
