<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Every earlier token has a key and a value. The query of the token being written is compared with every key before it, and the matching values decide the next token. The keys and values kept are the KV cache, so memory grows with the conversation. This model is a hybrid: only 6 of its 52 layers use attention this way.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">What KV means: a key and a value per token</text>

  <rect x="30" y="64" width="290" height="48" rx="8" class="outside"/>
  <text x="175" y="94" class="note" text-anchor="middle">Query: what it wants now</text>
  <rect x="335" y="64" width="290" height="48" rx="8" class="outside"/>
  <text x="480" y="94" class="note" text-anchor="middle">Key: what each token offers</text>
  <rect x="640" y="64" width="290" height="48" rx="8" class="outside"/>
  <text x="785" y="94" class="note" text-anchor="middle">Value: what each token gives</text>

  <text x="30" y="140" class="label">every earlier token</text>
  <rect x="30" y="150" width="86" height="36" rx="6" class="box built"/><text x="73" y="173" class="note mono" text-anchor="middle">t1</text>
  <rect x="136" y="150" width="86" height="36" rx="6" class="box built"/><text x="179" y="173" class="note mono" text-anchor="middle">t2</text>
  <rect x="242" y="150" width="86" height="36" rx="6" class="box built"/><text x="285" y="173" class="note mono" text-anchor="middle">t3</text>
  <rect x="348" y="150" width="86" height="36" rx="6" class="box built"/><text x="391" y="173" class="note mono" text-anchor="middle">t4</text>
  <rect x="454" y="150" width="86" height="36" rx="6" class="box built"/><text x="497" y="173" class="note mono" text-anchor="middle">t5</text>
  <rect x="560" y="150" width="86" height="36" rx="6" class="box built"/><text x="603" y="173" class="note mono" text-anchor="middle">t6</text>

  <rect x="30" y="200" width="86" height="34" rx="6" class="outside"/><text x="73" y="222" class="note" text-anchor="middle">K V</text>
  <rect x="136" y="200" width="86" height="34" rx="6" class="outside"/><text x="179" y="222" class="note" text-anchor="middle">K V</text>
  <rect x="242" y="200" width="86" height="34" rx="6" class="outside"/><text x="285" y="222" class="note" text-anchor="middle">K V</text>
  <rect x="348" y="200" width="86" height="34" rx="6" class="outside"/><text x="391" y="222" class="note" text-anchor="middle">K V</text>
  <rect x="454" y="200" width="86" height="34" rx="6" class="outside"/><text x="497" y="222" class="note" text-anchor="middle">K V</text>
  <rect x="560" y="200" width="86" height="34" rx="6" class="outside"/><text x="603" y="222" class="note" text-anchor="middle">K V</text>

  <rect x="700" y="150" width="230" height="84" rx="10" class="box built"/>
  <text x="815" y="180" class="name" text-anchor="middle">the token being written</text>
  <text x="815" y="202" class="note" text-anchor="middle">its query reads every</text>
  <text x="815" y="220" class="note" text-anchor="middle">key before it</text>

  <rect x="700" y="270" width="230" height="84" rx="10" class="box built"/>
  <text x="815" y="300" class="name" text-anchor="middle">the next token</text>
  <text x="815" y="322" class="note" text-anchor="middle">the matching values</text>
  <text x="815" y="340" class="note" text-anchor="middle">decide the word</text>

  <path class="flow" d="M698,192 L650,192" marker-end="url(#arrow)"/>

  <rect x="30" y="276" width="640" height="84" rx="10" class="outside"/>
  <text x="350" y="306" class="name" text-anchor="middle">The KV cache</text>
  <text x="350" y="328" class="note" text-anchor="middle">those keys and values, kept so they are not recomputed</text>
  <text x="350" y="346" class="note" text-anchor="middle">memory grows with the conversation, one entry per token</text>

  <text x="30" y="392" class="warn">This model is a hybrid: only 6 of its 52 layers use attention this way.</text>
  <text x="30" y="416" class="note">The rest keep a fixed state, which is why a million tokens fit on the Thor.</text>
</svg>
