<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="For every earlier token the model keeps a key and a value. The query of the token being written is compared with every key before it, and the matching values are mixed into the next token. The KV cache is those keys and values, and it grows with the conversation.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .accent { fill: #E8F4FF; stroke: #1E88A8; stroke-width: 2; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
    <marker id="arrow-both" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
      <path d="M10,0 L0,5 L10,10 Z" fill="#1E88A8"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#FFFFFF"/>
  <text x="30" y="34" class="title">What KV means: a key and a value per token</text>

  <rect x="30" y="54" width="290" height="42" rx="8" class="accent"/>
  <text x="44" y="72" class="name">Query</text>
  <text x="44" y="90" class="note">what the model is looking for now</text>
  <rect x="335" y="54" width="290" height="42" rx="8" class="outside"/>
  <text x="349" y="72" class="name">Key</text>
  <text x="349" y="90" class="note">what each earlier token offers</text>
  <rect x="640" y="54" width="290" height="42" rx="8" class="outside"/>
  <text x="654" y="72" class="name">Value</text>
  <text x="654" y="90" class="note">what each earlier token contributes</text>

  <text x="30" y="132" class="note" text-anchor="start">every earlier token</text>
  <rect x="30" y="142" width="96" height="38" rx="6" class="box built"/><text x="78" y="166" class="mono note" text-anchor="middle">t1</text>
  <rect x="140" y="142" width="96" height="38" rx="6" class="box built"/><text x="188" y="166" class="mono note" text-anchor="middle">t2</text>
  <rect x="250" y="142" width="96" height="38" rx="6" class="box built"/><text x="298" y="166" class="mono note" text-anchor="middle">t3</text>
  <rect x="360" y="142" width="96" height="38" rx="6" class="box built"/><text x="408" y="166" class="mono note" text-anchor="middle">t4</text>
  <rect x="470" y="142" width="96" height="38" rx="6" class="box built"/><text x="518" y="166" class="mono note" text-anchor="middle">t5</text>
  <rect x="580" y="142" width="96" height="38" rx="6" class="box built"/><text x="628" y="166" class="mono note" text-anchor="middle">t6</text>

  <rect x="30" y="190" width="96" height="34" rx="6" class="outside"/><text x="78" y="212" class="note" text-anchor="middle">K V</text>
  <rect x="140" y="190" width="96" height="34" rx="6" class="outside"/><text x="188" y="212" class="note" text-anchor="middle">K V</text>
  <rect x="250" y="190" width="96" height="34" rx="6" class="outside"/><text x="298" y="212" class="note" text-anchor="middle">K V</text>
  <rect x="360" y="190" width="96" height="34" rx="6" class="outside"/><text x="408" y="212" class="note" text-anchor="middle">K V</text>
  <rect x="470" y="190" width="96" height="34" rx="6" class="outside"/><text x="518" y="212" class="note" text-anchor="middle">K V</text>
  <rect x="580" y="190" width="96" height="34" rx="6" class="outside"/><text x="628" y="212" class="note" text-anchor="middle">K V</text>
  <text x="78" y="244" class="label" text-anchor="middle">kept</text>
  <text x="628" y="244" class="label" text-anchor="middle">kept</text>

  <path class="flow" d="M676,159 L132,159" marker-start="url(#arrow-both)" marker-end="url(#arrow-both)"/>
  <text x="404" y="130" class="num" text-anchor="middle">the query is compared with every key before it</text>

  <rect x="716" y="54" width="214" height="70" rx="8" class="accent"/>
  <text x="730" y="78" class="name">the token being written</text>
  <text x="730" y="98" class="note">its query asks: which keys</text>
  <text x="730" y="116" class="note">matter for what comes next?</text>

  <rect x="716" y="190" width="214" height="70" rx="8" class="box built"/>
  <text x="730" y="214" class="name">the next token</text>
  <text x="730" y="234" class="note">the matching values, mixed,</text>
  <text x="730" y="252" class="note">decide the word that follows</text>
  <path class="flow" d="M823,124 L823,188" marker-end="url(#arrow)"/>

  <rect x="30" y="276" width="900" height="56" rx="8" class="outside"/>
  <text x="46" y="300" class="name">The KV cache</text>
  <text x="46" y="322" class="note">those keys and values, kept so they are not recomputed. Memory and reading time both grow with the conversation: 6 KiB per token for this model, 6 GiB at a million.</text>

  <line x1="30" y1="348" x2="930" y2="348" stroke="#D5DCE4" stroke-width="1"/>
  <text x="30" y="372" class="note" text-anchor="start">The sliding-window trick: the browser sends only the last N messages instead of everything, so the window lasts longer at the cost of forgetting the start.</text>
  <text x="30" y="396" class="warn" text-anchor="start">This model is a hybrid: only 6 of its 52 layers use attention this way. The rest keep one fixed-size state, which is why a million tokens fit on the Thor.</text>
  <text x="30" y="420" class="note" text-anchor="start">Measured costs and the memory arithmetic: chapter "Memory, context and slots".</text>
</svg>
