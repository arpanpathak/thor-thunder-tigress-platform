  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">One breakout cable: one plug at the Thor, four at the switch</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The QSFP28 socket carries four lanes. The cable brings each lane out on a plug of its own.</text>
