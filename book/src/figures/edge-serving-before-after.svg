<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 664" width="1040" height="664" role="img" aria-label="Before: thor-tigress-agent sent a request naming an Edge-LLM model to that engine and every other name to the llama-server router on port 8079, which loaded Nemotron 3 Nano from disk when a request named it. After: the agent asks which server has the model. Qwen3.6 35B on 8081 answers for its own name and for a name nobody has, Nemotron 3.5 Lightning on 8082 for its own name, and the llama-server router on 8079 for the ids and aliases of the models it has loaded. The router runs with autoload off, so it loads a model at startup or on the load command and never because a request named one.">
