<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 432" width="1040" height="432" role="img" aria-label="6 planned uses of the agentic canvas: roleplay with characters who remember the scene; a therapist with a calm listener and nothing written down on the server; immigration with forms and covering letters checked against the rules; creative story writing with story bibles, drafts and revisions side by side; music generation with a timeline the model can add notes to and play back; and vector graphics with drawing commands it can run and then look at.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1040" height="432" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The agentic canvas</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A sandbox playground where a model works on a canvas, with tools it may reach for. All 6 uses below are planned.</text>
  <rect x="40" y="104" width="300" height="116" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M52,104.7 H46 V219.3 H52 A11.3,11.3 0 0 1 40.7,208 V116 A11.3,11.3 0 0 1 52,104.7 Z" fill="#B7791F"/>
  <text x="60.0" y="140.0" class="name" text-anchor="start" xml:space="preserve">roleplay</text>
  <text x="60.0" y="158.0" class="sub" text-anchor="start" xml:space="preserve">characters who remember</text>
  <text x="60.0" y="176.0" class="sub" text-anchor="start" xml:space="preserve">the scene, with the scene</text>
  <text x="60.0" y="194.0" class="sub" text-anchor="start" xml:space="preserve">kept on the canvas</text>
  <rect x="370" y="104" width="300" height="116" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M382,104.7 H376 V219.3 H382 A11.3,11.3 0 0 1 370.7,208 V116 A11.3,11.3 0 0 1 382,104.7 Z" fill="#B7791F"/>
  <text x="390.0" y="140.0" class="name" text-anchor="start" xml:space="preserve">a therapist</text>
  <text x="390.0" y="158.0" class="sub" text-anchor="start" xml:space="preserve">a calm listener, with</text>
  <text x="390.0" y="176.0" class="sub" text-anchor="start" xml:space="preserve">nothing written down</text>
  <text x="390.0" y="194.0" class="sub" text-anchor="start" xml:space="preserve">on the server</text>
  <rect x="700" y="104" width="300" height="116" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M712,104.7 H706 V219.3 H712 A11.3,11.3 0 0 1 700.7,208 V116 A11.3,11.3 0 0 1 712,104.7 Z" fill="#B7791F"/>
  <text x="720.0" y="140.0" class="name" text-anchor="start" xml:space="preserve">immigration</text>
  <text x="720.0" y="158.0" class="sub" text-anchor="start" xml:space="preserve">forms and covering letters</text>
  <text x="720.0" y="176.0" class="sub" text-anchor="start" xml:space="preserve">drafted with you, checked</text>
  <text x="720.0" y="194.0" class="sub" text-anchor="start" xml:space="preserve">against the rules</text>
  <rect x="40" y="244" width="300" height="116" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M52,244.7 H46 V359.3 H52 A11.3,11.3 0 0 1 40.7,348 V256 A11.3,11.3 0 0 1 52,244.7 Z" fill="#B7791F"/>
  <text x="60.0" y="280.0" class="name" text-anchor="start" xml:space="preserve">creative story writing</text>
  <text x="60.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">story bibles, drafts and</text>
  <text x="60.0" y="316.0" class="sub" text-anchor="start" xml:space="preserve">revisions standing side</text>
  <text x="60.0" y="334.0" class="sub" text-anchor="start" xml:space="preserve">by side</text>
  <rect x="370" y="244" width="300" height="116" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M382,244.7 H376 V359.3 H382 A11.3,11.3 0 0 1 370.7,348 V256 A11.3,11.3 0 0 1 382,244.7 Z" fill="#B7791F"/>
  <text x="390.0" y="280.0" class="name" text-anchor="start" xml:space="preserve">music generation</text>
  <text x="390.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">a timeline the model can</text>
  <text x="390.0" y="316.0" class="sub" text-anchor="start" xml:space="preserve">add notes to, and play</text>
  <text x="390.0" y="334.0" class="sub" text-anchor="start" xml:space="preserve">back</text>
  <rect x="700" y="244" width="300" height="116" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M712,244.7 H706 V359.3 H712 A11.3,11.3 0 0 1 700.7,348 V256 A11.3,11.3 0 0 1 712,244.7 Z" fill="#B7791F"/>
  <text x="720.0" y="280.0" class="name" text-anchor="start" xml:space="preserve">vector graphics</text>
  <text x="720.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">drawing commands it can</text>
  <text x="720.0" y="316.0" class="sub" text-anchor="start" xml:space="preserve">run, and then look at</text>
  <text x="720.0" y="334.0" class="sub" text-anchor="start" xml:space="preserve">what it drew</text>
  <text x="40.0" y="410.0" class="note" text-anchor="start" xml:space="preserve">Amber and dashed means planned, in this book and on the page.</text>
</svg>
