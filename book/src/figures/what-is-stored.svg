<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-label="3 columns. Your browser holds the conversations, the settings and your key, cleared with site data. The board&#x27;s memory holds the reply being written and a small prompt cache, gone on restart. The board&#x27;s disk holds the sealed keyring: 1 record per person with a name, an email, a status and a key, and the service key the servers use between themselves. No message text is written down.">
