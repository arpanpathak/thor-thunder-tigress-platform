<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Three columns. Your browser holds the conversations, the settings and your key, cleared with site data. The Thor's memory holds the reply being written and a small prompt cache, gone on restart. The Thor's disk holds the sealed keyring: one record per person with a name, an email, a status and a key, and the service key the servers use between themselves. No message text is written down.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <rect width="960" height="400" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">What is stored, and where</text>
  <line x1="30" y1="56" x2="930" y2="56" stroke="#D5DCE4" stroke-width="1"/>

  <text x="170" y="88" class="name" text-anchor="middle">Your browser</text>
  <rect x="30" y="104" width="280" height="74" rx="10" class="outside"/>
  <text x="170" y="132" class="name" text-anchor="middle">conversations</text>
  <text x="170" y="154" class="note" text-anchor="middle">every message and thought</text>
  <rect x="30" y="190" width="280" height="74" rx="10" class="outside"/>
  <text x="170" y="218" class="name" text-anchor="middle">settings</text>
  <text x="170" y="240" class="note" text-anchor="middle">theme, model, system prompt</text>
  <rect x="30" y="276" width="280" height="74" rx="10" class="outside"/>
  <text x="170" y="304" class="name" text-anchor="middle">your key</text>
  <text x="170" y="326" class="note" text-anchor="middle">kept in local storage</text>

  <text x="480" y="88" class="name" text-anchor="middle">The Thor's memory</text>
  <rect x="340" y="104" width="280" height="74" rx="10" class="box built"/>
  <text x="480" y="132" class="name" text-anchor="middle">in memory only</text>
  <text x="480" y="154" class="note" text-anchor="middle">the reply being written</text>
  <rect x="340" y="190" width="280" height="74" rx="10" class="box built"/>
  <text x="480" y="218" class="name" text-anchor="middle">the prompt cache</text>
  <text x="480" y="240" class="note" text-anchor="middle">so a slot reads it once</text>
  <rect x="340" y="276" width="280" height="74" rx="10" class="box built"/>
  <text x="480" y="304" class="name" text-anchor="middle">gone on restart</text>
  <text x="480" y="326" class="note" text-anchor="middle">read to answer, not saved</text>

  <text x="790" y="88" class="name" text-anchor="middle">The Thor's disk</text>
  <rect x="650" y="104" width="280" height="74" rx="10" class="box built"/>
  <text x="790" y="132" class="name" text-anchor="middle">the sealed keyring</text>
  <text x="790" y="154" class="note mono" text-anchor="middle">~/.config/thor-chat/keyring</text>
  <rect x="650" y="190" width="280" height="74" rx="10" class="box built"/>
  <text x="790" y="218" class="name" text-anchor="middle">one record per person</text>
  <text x="790" y="240" class="note" text-anchor="middle">name, email, status, key</text>
  <rect x="650" y="276" width="280" height="74" rx="10" class="box built"/>
  <text x="790" y="304" class="name" text-anchor="middle">the service key</text>
  <text x="790" y="326" class="note" text-anchor="middle">the servers' own key</text>

  <text x="480" y="384" class="num" text-anchor="middle">Every message sends the whole history; none of it is written down on the Thor.</text>
</svg>
