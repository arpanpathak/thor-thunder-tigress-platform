<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 566" width="1084" height="566" role="img" aria-label="The browser asks thor-tigress-agent with Web on. The agent sends messages and tools to llama-server; Nemotron or Qwen calls web_search, which asks SearXNG and the search engines for recent results with dates, or calls fetch_page_content_recursive, which checks that every hop is a public https address and reads a page and its own links. After at most eight tool rounds the model has to answer.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1084" height="566" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Tool calling in the chat: search and read</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The model asks, the agent does. Nothing the model writes reaches the internet unchecked.</text>
  <rect x="40" y="150" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,150.7 H46 V213.3 H52 A11.3,11.3 0 0 1 40.7,202 V162 A11.3,11.3 0 0 1 52,150.7 Z" fill="#2F6FDB"/>
  <rect x="56" y="166.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(62.0,172.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 5v9h16V9zm1.5-3a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm3 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm3 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="98.0" y="178.0" class="name" text-anchor="start" xml:space="preserve">Browser</text>
  <text x="98.0" y="196.0" class="sub" text-anchor="start" xml:space="preserve">Web switch on</text>
  <rect x="240" y="104" width="590" height="440" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="258" y="93" width="146.0" height="22" rx="11" fill="#1B2430"/>
  <text x="331.0" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">JETSON AGX THOR</text>
  <rect x="270" y="142" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M282,142.7 H276 V221.3 H282 A11.3,11.3 0 0 1 270.7,210 V154 A11.3,11.3 0 0 1 282,142.7 Z" fill="#1F8A70"/>
  <rect x="286" y="166.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(292.0,172.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="328.0" y="169.0" class="name" text-anchor="start" xml:space="preserve">thor-tigress-agent</text>
  <text x="328.0" y="187.0" class="sub" text-anchor="start" xml:space="preserve">up to eight rounds;</text>
  <text x="328.0" y="205.0" class="sub" text-anchor="start" xml:space="preserve">the first requires a tool</text>
  <rect x="580" y="142" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M592,142.7 H586 V221.3 H592 A11.3,11.3 0 0 1 580.7,210 V154 A11.3,11.3 0 0 1 592,142.7 Z" fill="#5E9400"/>
  <text x="600.0" y="169.0" class="name" text-anchor="start" xml:space="preserve">llama-server</text>
  <text x="600.0" y="187.0" class="sub" text-anchor="start" xml:space="preserve">Nemotron or Qwen:</text>
  <text x="600.0" y="205.0" class="sub" text-anchor="start" xml:space="preserve">a tool call or an answer</text>
  <path class="wire" d="M210,182 L270,182" marker-end="url(#head)"/>
  <path class="wire" d="M510,170 L580,170" marker-end="url(#head)"/>
  <path class="wire" d="M580,196 L510,196" marker-end="url(#head)"/>
  <text x="580.0" y="246.0" class="note" text-anchor="start" xml:space="preserve">→ messages and tools</text>
  <text x="580.0" y="263.0" class="note" text-anchor="start" xml:space="preserve">← a tool call, or the answer</text>
  <rect x="270" y="300" width="270" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M282,300.7 H276 V379.3 H282 A11.3,11.3 0 0 1 270.7,368 V312 A11.3,11.3 0 0 1 282,300.7 Z" fill="#1F8A70"/>
  <rect x="286" y="324.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(292.0,330.0) scale(0.8333)"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.7 4.8-1.8 1.8-4.8-4.7A7.5 7.5 0 1 1 10.5 3zm0 2.5a5 5 0 1 0 0 10 5 5 0 0 0 0-10z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="328.0" y="327.0" class="name" text-anchor="start" xml:space="preserve">web_search</text>
  <text x="328.0" y="345.0" class="sub" text-anchor="start" xml:space="preserve">SearXNG :8888</text>
  <text x="328.0" y="363.0" class="sub" text-anchor="start" xml:space="preserve">6 results, with dates</text>
  <rect x="270" y="420" width="270" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M282,420.7 H276 V499.3 H282 A11.3,11.3 0 0 1 270.7,488 V432 A11.3,11.3 0 0 1 282,420.7 Z" fill="#1F8A70"/>
  <text x="290.0" y="456.0" class="name" text-anchor="start" xml:space="preserve">fetch_page_content_recursive</text>
  <text x="290.0" y="474.0" class="sub" text-anchor="start" xml:space="preserve">a page and its own links</text>
  <rect x="580" y="420" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M592,420.7 H586 V499.3 H592 A11.3,11.3 0 0 1 580.7,488 V432 A11.3,11.3 0 0 1 592,420.7 Z" fill="#CF4526"/>
  <text x="600.0" y="447.0" class="name" text-anchor="start" xml:space="preserve">Address checks</text>
  <text x="600.0" y="465.0" class="sub" text-anchor="start" xml:space="preserve">public https only</text>
  <text x="600.0" y="483.0" class="sub" text-anchor="start" xml:space="preserve">every hop, one lookup</text>
  <path class="wire" d="M390,222 L390,300" marker-end="url(#head)"/>
  <path class="wire" d="M300,222 L300,257 Q300,266 291,266 L263,266 Q254,266 254,275 L254,451 Q254,460 262.0,460.0 L270,460" marker-end="url(#head)"/>
  <path class="wire" d="M540,340 L870,340" marker-end="url(#head)"/>
  <path class="wire" d="M540,460 L580,460" marker-end="url(#head)"/>
  <path class="wire" d="M800,460 L870,460" marker-end="url(#head)"/>
  <rect x="870" y="300" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M882,300.7 H876 V379.3 H882 A11.3,11.3 0 0 1 870.7,368 V312 A11.3,11.3 0 0 1 882,300.7 Z" fill="#7A4FD0"/>
  <text x="890.0" y="327.0" class="name" text-anchor="start" xml:space="preserve">Search engines</text>
  <text x="890.0" y="345.0" class="sub" text-anchor="start" xml:space="preserve">DuckDuckGo, Google</text>
  <text x="890.0" y="363.0" class="sub" text-anchor="start" xml:space="preserve">(Brave suspended)</text>
  <rect x="870" y="420" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M882,420.7 H876 V499.3 H882 A11.3,11.3 0 0 1 870.7,488 V432 A11.3,11.3 0 0 1 882,420.7 Z" fill="#7A4FD0"/>
  <text x="890.0" y="447.0" class="name" text-anchor="start" xml:space="preserve">The internet</text>
  <text x="890.0" y="465.0" class="sub" text-anchor="start" xml:space="preserve">the cited page,</text>
  <text x="890.0" y="483.0" class="sub" text-anchor="start" xml:space="preserve">then its links</text>
</svg>
