  <text x="438.0" y="277.0" class="name" text-anchor="start" xml:space="preserve">Pick the best blocks</text>
  <text x="438.0" y="295.0" class="sub" text-anchor="start" xml:space="preserve">the top 512 blocks,</text>
  <text x="438.0" y="313.0" class="sub" text-anchor="start" xml:space="preserve">2,048 tokens in all</text>
