  <text x="98.0" y="277.0" class="name" text-anchor="start" xml:space="preserve">Indexer</text>
  <text x="98.0" y="295.0" class="sub" text-anchor="start" xml:space="preserve">4 query heads, 1 shared key head,</text>
  <text x="98.0" y="313.0" class="sub" text-anchor="start" xml:space="preserve">128 wide: scores every block</text>
