  <rect x="250.0" y="362" width="14" height="14" rx="4" fill="#C9D1DB"/>
  <text x="271.0" y="373.5" class="note" text-anchor="start" xml:space="preserve">a block attention skips</text>
  <text x="40.0" y="410.0" class="note" text-anchor="start" style="fill:#7A4FD0" xml:space="preserve">The cost of one QSA layer grows with the 2,048 chosen tokens, not with the length of the prompt.</text>
  <text x="40.0" y="427.0" class="note" text-anchor="start" style="fill:#7A4FD0" xml:space="preserve">Only 12 of the 48 layers use attention; the other 36 are Gated DeltaNet layers with a fixed-size state.</text>
</svg>
