  <text x="778.0" y="277.0" class="name" text-anchor="start" xml:space="preserve">Attention</text>
  <text x="778.0" y="295.0" class="sub" text-anchor="start" xml:space="preserve">24 query heads, 2 key-value</text>
  <text x="778.0" y="313.0" class="sub" text-anchor="start" xml:space="preserve">heads, over the picked blocks</text>
