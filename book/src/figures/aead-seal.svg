<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-label="The records and the magic line go into XChaCha20-Poly1305 with one key and a fresh nonce, and come out as ciphertext with a 16-byte tag that catches any change. Opening needs the same key, nonce and magic line; a wrong passphrase and a changed file fail the same way, on purpose.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
  </defs>
  <rect width="960" height="350" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">Encrypt and authenticate in one step</text>

  <rect x="30" y="80" width="210" height="96" rx="10" class="outside"/>
  <text x="135" y="112" class="name" text-anchor="middle">the records</text>
  <text x="135" y="136" class="note" text-anchor="middle">plus the magic line</text>
  <text x="135" y="154" class="note" text-anchor="middle">as associated data</text>

  <rect x="345" y="80" width="240" height="96" rx="10" class="box built"/>
  <text x="465" y="112" class="name" text-anchor="middle">XChaCha20-Poly1305</text>
  <text x="465" y="136" class="note" text-anchor="middle">one key, one nonce</text>
  <text x="465" y="154" class="note" text-anchor="middle">a fresh nonce per write</text>

  <rect x="680" y="80" width="250" height="96" rx="10" class="box built"/>
  <text x="805" y="112" class="name" text-anchor="middle">ciphertext + tag</text>
  <text x="805" y="136" class="note" text-anchor="middle">unreadable, and</text>
  <text x="805" y="154" class="note" text-anchor="middle">any change is caught</text>

  <path class="flow" d="M240,128 L333,128" marker-end="url(#arrow)"/>
  <path class="flow" d="M585,128 L668,128" marker-end="url(#arrow)"/>

  <line x1="30" y1="196" x2="930" y2="196" stroke="#D5DCE4" stroke-width="1"/>

  <rect x="30" y="216" width="420" height="96" rx="10" class="box built"/>
  <text x="240" y="248" class="name" text-anchor="middle">Opening again</text>
  <text x="240" y="272" class="note" text-anchor="middle">same key, same nonce, same magic line</text>
  <text x="240" y="292" class="note" text-anchor="middle">or nothing comes back at all</text>

  <rect x="480" y="216" width="450" height="96" rx="10" class="outside"/>
  <text x="705" y="248" class="name" text-anchor="middle">One message for two mistakes</text>
  <text x="705" y="272" class="note" text-anchor="middle">a wrong passphrase and a changed file</text>
  <text x="705" y="292" class="note" text-anchor="middle">fail the same way, on purpose</text>

  <text x="30" y="336" class="warn">A nonce is not secret, but it must never repeat under one key.</text>
</svg>
