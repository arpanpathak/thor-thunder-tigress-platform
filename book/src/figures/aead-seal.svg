<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 392" width="1040" height="392" role="img" aria-label="Sealing puts the records and the magic line into XChaCha20-Poly1305 with a 32-byte key and a fresh 24-byte nonce, producing ciphertext and a 16-byte tag. Opening needs the same key, nonce and magic line; another key, a changed byte or another magic line fails the tag and nothing is returned.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1040" height="392" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Encrypt and authenticate in one step</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">One operation hides the records and proves nobody changed them.</text>
  <rect x="40" y="104" width="260" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,104.7 H46 V199.3 H52 A11.3,11.3 0 0 1 40.7,188 V116 A11.3,11.3 0 0 1 52,104.7 Z" fill="#B7791F"/>
  <rect x="56" y="136.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(62.0,142.0) scale(0.8333)"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V8h4.5zM8 11v1.6h8V11zm0 3.2v1.6h8v-1.6zm0 3.2V19h5v-1.6z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="98.0" y="139.0" class="name" text-anchor="start" xml:space="preserve">the records</text>
  <text x="98.0" y="157.0" class="sub" text-anchor="start" xml:space="preserve">plus the magic line</text>
  <text x="98.0" y="175.0" class="sub" text-anchor="start" xml:space="preserve">as associated data</text>
  <rect x="380" y="104" width="280" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M392,104.7 H386 V199.3 H392 A11.3,11.3 0 0 1 380.7,188 V116 A11.3,11.3 0 0 1 392,104.7 Z" fill="#1F8A70"/>
  <rect x="396" y="136.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(402.0,142.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="438.0" y="139.0" class="name" text-anchor="start" xml:space="preserve">XChaCha20-Poly1305</text>
  <text x="438.0" y="157.0" class="sub" text-anchor="start" xml:space="preserve">one key, one nonce</text>
  <text x="438.0" y="175.0" class="sub" text-anchor="start" xml:space="preserve">a fresh nonce per write</text>
  <rect x="740" y="104" width="260" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M752,104.7 H746 V199.3 H752 A11.3,11.3 0 0 1 740.7,188 V116 A11.3,11.3 0 0 1 752,104.7 Z" fill="#7A4FD0"/>
  <rect x="756" y="136.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(762.0,142.0) scale(0.8333)"><path d="M14.5 2a7.5 7.5 0 0 0-7.2 9.6L2 16.9V22h5.1v-2.5h2.5V17h2.4l1-1a7.5 7.5 0 1 0 1.5-14zm2.2 4.3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#7A4FD0" fill-rule="evenodd"/></g>
  <text x="798.0" y="139.0" class="name" text-anchor="start" xml:space="preserve">ciphertext + tag</text>
  <text x="798.0" y="157.0" class="sub" text-anchor="start" xml:space="preserve">unreadable, and</text>
  <text x="798.0" y="175.0" class="sub" text-anchor="start" xml:space="preserve">any change is caught</text>
  <path class="wire" d="M300,152 L380,152" marker-end="url(#head)"/>
  <path class="wire" d="M660,152 L740,152" marker-end="url(#head)"/>
  <rect x="40" y="250" width="470" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,250.7 H46 V333.3 H52 A11.3,11.3 0 0 1 40.7,322 V262 A11.3,11.3 0 0 1 52,250.7 Z" fill="#7F8EA0"/>
  <text x="60.0" y="279.0" class="name" text-anchor="start" xml:space="preserve">Opening again</text>
  <text x="60.0" y="297.0" class="sub" text-anchor="start" xml:space="preserve">same key, same nonce, same magic line</text>
  <text x="60.0" y="315.0" class="sub" text-anchor="start" xml:space="preserve">or nothing comes back at all</text>
  <rect x="530" y="250" width="470" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M542,250.7 H536 V333.3 H542 A11.3,11.3 0 0 1 530.7,322 V262 A11.3,11.3 0 0 1 542,250.7 Z" fill="#CF4526"/>
  <text x="550.0" y="279.0" class="name" text-anchor="start" xml:space="preserve">One message for two mistakes</text>
  <text x="550.0" y="297.0" class="sub" text-anchor="start" xml:space="preserve">a wrong passphrase and a changed file</text>
  <text x="550.0" y="315.0" class="sub" text-anchor="start" xml:space="preserve">fail the same way, on purpose</text>
  <text x="40.0" y="370.0" class="note" text-anchor="start" xml:space="preserve">A nonce is not secret, but it must never repeat under one key.</text>
</svg>
