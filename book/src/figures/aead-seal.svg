<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Sealing: the records and the magic line go into XChaCha20-Poly1305 with a 32-byte key and a fresh 24-byte nonce, and come out as ciphertext with a 16-byte tag. Opening: only the same key, nonce and additional data return the records; a changed byte or another key fails the tag and is refused.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
    <marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D9542B"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#FFFFFF"/>
  <text x="30" y="34" class="title">Encrypt and authenticate in one step: XChaCha20-Poly1305</text>

  <rect x="26" y="54" width="908" height="164" rx="10" class="zone"/>
  <text x="40" y="76" class="zonelabel">sealing (a write)</text>
  <rect x="40" y="88" width="230" height="52" rx="8" class="outside"/>
  <text x="54" y="110" class="name">the records</text>
  <text x="54" y="130" class="note">plaintext JSON, name to key</text>
  <rect x="40" y="152" width="230" height="52" rx="8" class="outside"/>
  <text x="54" y="174" class="name">additional data</text>
  <text x="54" y="194" class="note">the magic line, not encrypted</text>
  <path class="flow" d="M270,114 L328,140" marker-end="url(#arrow)"/>
  <path class="flow" d="M270,178 L328,158" marker-end="url(#arrow)"/>
  <rect x="330" y="92" width="200" height="108" rx="10" class="box built"/>
  <text x="430" y="118" class="name" text-anchor="middle">XChaCha20-Poly1305</text>
  <text x="430" y="140" class="note" text-anchor="middle">key: 32 bytes,</text>
  <text x="430" y="158" class="note" text-anchor="middle">the Argon2id output</text>
  <text x="430" y="180" class="note" text-anchor="middle">nonce: 24 bytes, drawn fresh</text>
  <text x="430" y="196" class="note" text-anchor="middle">for every single write</text>
  <path class="flow" d="M530,146 L588,146" marker-end="url(#arrow)"/>
  <rect x="590" y="92" width="310" height="108" rx="8" class="box built"/>
  <text x="745" y="120" class="name" text-anchor="middle">ciphertext, then a tag</text>
  <text x="745" y="142" class="note" text-anchor="middle">the records cannot be read, and</text>
  <text x="745" y="160" class="note" text-anchor="middle">any change is caught by the tag</text>
  <text x="745" y="184" class="label" text-anchor="middle">ciphertext + 16-byte tag go in the file</text>

  <rect x="26" y="232" width="908" height="150" rx="10" class="zone"/>
  <text x="40" y="254" class="zonelabel">opening (a read)</text>
  <rect x="40" y="266" width="200" height="60" rx="8" class="box built"/>
  <text x="140" y="290" class="name" text-anchor="middle">ciphertext + tag</text>
  <text x="140" y="310" class="note" text-anchor="middle">from the file</text>
  <rect x="280" y="266" width="200" height="60" rx="8" class="box built"/>
  <text x="380" y="290" class="name" text-anchor="middle">same key + nonce</text>
  <text x="380" y="310" class="note" text-anchor="middle">from the passphrase and the file</text>
  <path class="flow" d="M240,296 L278,296" marker-end="url(#arrow)"/>
  <path class="flow" d="M480,296 L528,296" marker-end="url(#arrow)"/>
  <rect x="530" y="266" width="180" height="60" rx="8" class="box built"/>
  <text x="620" y="290" class="name" text-anchor="middle">the records</text>
  <text x="620" y="310" class="note" text-anchor="middle">tag matched</text>

  <rect x="740" y="266" width="180" height="60" rx="8" class="outside"/>
  <text x="830" y="288" class="note" text-anchor="middle">another key, a changed byte,</text>
  <text x="830" y="306" class="note" text-anchor="middle">or another magic line</text>
  <path class="deny" d="M740,296 L712,296" marker-end="url(#arrow-deny)"/>
  <text x="626" y="352" class="warn" text-anchor="middle">tag does not match: nothing is returned</text>
  <text x="30" y="404" class="note" text-anchor="start">A wrong passphrase and a changed file fail the same way, on purpose: the tool says "wrong passphrase, or the file was changed" and cannot tell them apart.</text>
  <text x="30" y="426" class="note" text-anchor="start">A nonce is not a secret, but it must never repeat under one key. Every write draws a fresh random one, so no two writes share it.</text>
</svg>
