<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 436" width="1040" height="436" role="img" aria-label="After the model head picks token t, the MTP layer drafts three more tokens. One pass of the full model checks all four positions at once and keeps drafts up to the first wrong one. On the Thor vLLM reported draft 1 kept 53 percent of the time, draft 2 26 percent and draft 3 15 percent, so a pass returns 2.0 to 2.4 tokens on average instead of one.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1040" height="436" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Multi-token prediction: three guesses, one check</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A small extra layer drafts ahead; the full model accepts what it agrees with.</text>
  <rect x="40" y="140" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,140.7 H46 V209.3 H52 A11.3,11.3 0 0 1 40.7,198 V152 A11.3,11.3 0 0 1 52,140.7 Z" fill="#2E8B3D"/>
  <rect x="56" y="159.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(62.0,165.0) scale(0.8333)"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V8h4.5zM8 11v1.6h8V11zm0 3.2v1.6h8v-1.6zm0 3.2V19h5v-1.6z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="98.0" y="171.0" class="name" text-anchor="start" xml:space="preserve">token t</text>
  <text x="98.0" y="189.0" class="sub" text-anchor="start" xml:space="preserve">model head</text>
  <rect x="280" y="140" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M292,140.7 H286 V209.3 H292 A11.3,11.3 0 0 1 280.7,198 V152 A11.3,11.3 0 0 1 292,140.7 Z" fill="#2E8B3D"/>
  <rect x="296" y="159.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(302.0,165.0) scale(0.8333)"><path d="M3 21l1.5-5.5L15.2 4.8l4 4L8.5 19.5zM16.6 3.4l1.3-1.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4l-1.3 1.3z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="338.0" y="171.0" class="name" text-anchor="start" xml:space="preserve">draft 1</text>
  <text x="338.0" y="189.0" class="sub" text-anchor="start" xml:space="preserve">53% kept</text>
  <path class="wire" d="M240,175 L280,175" marker-end="url(#head)"/>
  <rect x="520" y="140" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M532,140.7 H526 V209.3 H532 A11.3,11.3 0 0 1 520.7,198 V152 A11.3,11.3 0 0 1 532,140.7 Z" fill="#B7791F"/>
  <rect x="536" y="159.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(542.0,165.0) scale(0.8333)"><path d="M3 21l1.5-5.5L15.2 4.8l4 4L8.5 19.5zM16.6 3.4l1.3-1.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4l-1.3 1.3z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="578.0" y="171.0" class="name" text-anchor="start" xml:space="preserve">draft 2</text>
  <text x="578.0" y="189.0" class="sub" text-anchor="start" xml:space="preserve">26% kept</text>
  <path class="wire" d="M480,175 L520,175" marker-end="url(#head)"/>
  <rect x="760" y="140" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M772,140.7 H766 V209.3 H772 A11.3,11.3 0 0 1 760.7,198 V152 A11.3,11.3 0 0 1 772,140.7 Z" fill="#CF4526"/>
  <rect x="776" y="159.0" width="32" height="32" rx="8" fill="#FCEBE6"/>
  <g transform="translate(782.0,165.0) scale(0.8333)"><path d="M3 21l1.5-5.5L15.2 4.8l4 4L8.5 19.5zM16.6 3.4l1.3-1.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4l-1.3 1.3z" fill="#CF4526" fill-rule="evenodd"/></g>
  <text x="818.0" y="171.0" class="name" text-anchor="start" xml:space="preserve">draft 3</text>
  <text x="818.0" y="189.0" class="sub" text-anchor="start" xml:space="preserve">15% kept</text>
  <path class="wire" d="M720,175 L760,175" marker-end="url(#head)"/>
  <rect x="40" y="270" width="440" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,270.7 H46 V349.3 H52 A11.3,11.3 0 0 1 40.7,338 V282 A11.3,11.3 0 0 1 52,270.7 Z" fill="#5E9400"/>
  <rect x="56" y="294.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(62.0,300.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#5E9400" fill-rule="evenodd"/></g>
  <text x="98.0" y="297.0" class="name" text-anchor="start" xml:space="preserve">One pass of the full model</text>
  <text x="98.0" y="315.0" class="sub" text-anchor="start" xml:space="preserve">checks all four positions at once and keeps</text>
  <text x="98.0" y="333.0" class="sub" text-anchor="start" xml:space="preserve">drafts up to the first wrong one</text>
  <rect x="560" y="270" width="440" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M572,270.7 H566 V349.3 H572 A11.3,11.3 0 0 1 560.7,338 V282 A11.3,11.3 0 0 1 572,270.7 Z" fill="#1F8A70"/>
  <rect x="576" y="294.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(582.0,300.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="618.0" y="297.0" class="name" text-anchor="start" xml:space="preserve">What a pass returns</text>
  <text x="618.0" y="315.0" class="sub" text-anchor="start" xml:space="preserve">2.0 to 2.4 tokens on average,</text>
  <text x="618.0" y="333.0" class="sub" text-anchor="start" xml:space="preserve">instead of 1</text>
  <path class="wire" d="M480,310 L560,310" marker-end="url(#head)"/>
  <path class="wire" d="M140,210 L140,270" marker-end="url(#head)"/>
  <text x="40.0" y="392.0" class="note" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">The rates are what vLLM&#x27;s own counters reported on the Thor for prose. A draft can only be kept</text>
  <text x="40.0" y="409.0" class="note" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">when every draft before it was, so the third position is kept least often.</text>
</svg>
