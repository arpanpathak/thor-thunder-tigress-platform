<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Memory per token of context: Nemotron 3 Nano 6 KiB, Llama 3 8B 128 KiB, Llama 3 70B 320 KiB. For one million tokens: 6 GiB, 128 GiB, 320 GiB.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1000" height="420" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Why a 1M-token context fits on the Thor</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The bars are to scale. Nemotron&#x27;s is the short one.</text>
  <text x="60.0" y="104.0" class="note" text-anchor="start" xml:space="preserve">Memory per token of context (16-bit keys and values)</text>
  <text x="940.0" y="104.0" class="note" text-anchor="end" xml:space="preserve">for 1,048,576 tokens</text>
  <text x="60.0" y="144.0" class="name" text-anchor="start" xml:space="preserve">Nemotron 3 Nano 30B-A3B</text>
  <text x="60.0" y="162.0" class="note" text-anchor="start" xml:space="preserve">6 attention layers × 2 KV heads × 128</text>
  <rect x="360" y="130" width="7.9" height="34" rx="5" fill="#5E9400" filter="url(#lift)"/>
  <text x="379.9" y="152.0" class="name" text-anchor="start" style="fill:#5E9400" xml:space="preserve">6 KiB</text>
  <text x="940.0" y="152.0" class="name" text-anchor="end" xml:space="preserve">6 GiB</text>
  <text x="60.0" y="222.0" class="name" text-anchor="start" xml:space="preserve">Llama 3 8B</text>
  <text x="60.0" y="240.0" class="note" text-anchor="start" xml:space="preserve">32 layers × 8 KV heads × 128</text>
  <rect x="360" y="208" width="168.0" height="34" rx="5" fill="#2F6FDB" filter="url(#lift)"/>
  <text x="540.0" y="230.0" class="name" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">128 KiB</text>
  <text x="940.0" y="230.0" class="name" text-anchor="end" xml:space="preserve">128 GiB</text>
  <text x="60.0" y="300.0" class="name" text-anchor="start" xml:space="preserve">Llama 3 70B</text>
  <text x="60.0" y="318.0" class="note" text-anchor="start" xml:space="preserve">80 layers × 8 KV heads × 128</text>
  <rect x="360" y="286" width="420.0" height="34" rx="5" fill="#2F6FDB" filter="url(#lift)"/>
  <text x="792.0" y="308.0" class="name" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">320 KiB</text>
  <text x="940.0" y="308.0" class="name" text-anchor="end" xml:space="preserve">320 GiB</text>
  <text x="60.0" y="384.0" class="note" text-anchor="start" xml:space="preserve">The Thor has about 115 GB usable. A 1M-token conversation fits only because most of Nemotron&#x27;s layers</text>
  <text x="60.0" y="401.0" class="note" text-anchor="start" xml:space="preserve">keep a fixed-size state instead of a cache that grows with every token.</text>
</svg>
