<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 552" width="1100" height="552" role="img" aria-label="Clients send requests with a model name to thor-tigress-agent on port 8080, which passes them to the llama-server router on 8079. The router sends each request to the model process with that name or alias. Nemotron 3 Nano is loaded; Nemotron 3.5 Lightning and other GGUF files under ~/models/gguf stay on disk until loaded with thor-tigress-serve, which writes the router&#x27;s model list in ~/.config/thor-chat.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1100" height="552" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">How a request reaches a model</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The router picks the model process by the name in the request.</text>
  <rect x="40" y="110" width="190" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,110.7 H46 V181.3 H52 A11.3,11.3 0 0 1 40.7,170 V122 A11.3,11.3 0 0 1 52,110.7 Z" fill="#2F6FDB"/>
  <rect x="56" y="130.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(62.0,136.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 5v9h16V9zm1.5-3a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm3 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm3 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="98.0" y="142.0" class="name" text-anchor="start" xml:space="preserve">Web chat</text>
  <text x="98.0" y="160.0" class="sub" text-anchor="start" xml:space="preserve">picker sends model</text>
  <rect x="40" y="230" width="190" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,230.7 H46 V301.3 H52 A11.3,11.3 0 0 1 40.7,290 V242 A11.3,11.3 0 0 1 52,230.7 Z" fill="#2F6FDB"/>
  <text x="60.0" y="253.0" class="name" text-anchor="start" xml:space="preserve">Claude Code,</text>
  <text x="60.0" y="271.0" class="sub" text-anchor="start" xml:space="preserve">OpenCode</text>
  <text x="60.0" y="289.0" class="sub" text-anchor="start" xml:space="preserve">model: &quot;nemotron&quot;</text>
  <rect x="40" y="350" width="190" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,350.7 H46 V421.3 H52 A11.3,11.3 0 0 1 40.7,410 V362 A11.3,11.3 0 0 1 52,350.7 Z" fill="#2F6FDB"/>
  <rect x="56" y="370.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(62.0,376.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="98.0" y="382.0" class="name" text-anchor="start" xml:space="preserve">curl, SDKs</text>
  <text x="98.0" y="400.0" class="sub" text-anchor="start" xml:space="preserve">any id or alias</text>
  <rect x="290" y="214" width="230" height="104" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M302,214.7 H296 V317.3 H302 A11.3,11.3 0 0 1 290.7,306 V226 A11.3,11.3 0 0 1 302,214.7 Z" fill="#1F8A70"/>
  <rect x="306" y="250.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(312.0,256.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="348.0" y="244.0" class="name" text-anchor="start" xml:space="preserve">thor-tigress-agent</text>
  <text x="348.0" y="262.0" class="sub" text-anchor="start" xml:space="preserve">:8080</text>
  <text x="348.0" y="280.0" class="sub" text-anchor="start" xml:space="preserve">key check, web search</text>
  <text x="348.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">passes model through</text>
  <rect x="580" y="204" width="220" height="124" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M592,204.7 H586 V327.3 H592 A11.3,11.3 0 0 1 580.7,316 V216 A11.3,11.3 0 0 1 592,204.7 Z" fill="#1F8A70"/>
  <text x="600.0" y="235.0" class="name" text-anchor="start" xml:space="preserve">llama-server router</text>
  <text x="600.0" y="253.0" class="sub" text-anchor="start" xml:space="preserve">:8079</text>
  <text x="600.0" y="271.0" class="sub" text-anchor="start" xml:space="preserve">routes by model or alias</text>
  <text x="600.0" y="289.0" class="sub" text-anchor="start" xml:space="preserve">--models-max 2</text>
  <text x="600.0" y="307.0" class="sub" text-anchor="start" xml:space="preserve">unknown name: 400</text>
  <rect x="850" y="100" width="226" height="88" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M862,100.7 H856 V187.3 H862 A11.3,11.3 0 0 1 850.7,176 V112 A11.3,11.3 0 0 1 862,100.7 Z" fill="#5E9400"/>
  <text x="870.0" y="131.0" class="name" text-anchor="start" xml:space="preserve">Nemotron 3 Nano</text>
  <text x="870.0" y="149.0" class="sub" text-anchor="start" xml:space="preserve">loaded · 4 × 1M</text>
  <text x="870.0" y="167.0" class="sub" text-anchor="start" xml:space="preserve">nemotron, nemotron-think</text>
  <rect x="850" y="222" width="226" height="88" rx="12" fill="#F1F4F7" stroke="#7F8EA0" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M862,222.7 H856 V309.3 H862 A11.3,11.3 0 0 1 850.7,298 V234 A11.3,11.3 0 0 1 862,222.7 Z" fill="#7F8EA0"/>
  <text x="870.0" y="253.0" class="name" text-anchor="start" xml:space="preserve">Nemotron 3.5 Lightning</text>
  <text x="870.0" y="271.0" class="sub" text-anchor="start" xml:space="preserve">on disk · not loaded</text>
  <text x="870.0" y="289.0" class="sub" text-anchor="start" xml:space="preserve">thor-tigress-serve load 2</text>
  <rect x="850" y="344" width="226" height="88" rx="12" fill="#F1F4F7" stroke="#7F8EA0" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M862,344.7 H856 V431.3 H862 A11.3,11.3 0 0 1 850.7,420 V356 A11.3,11.3 0 0 1 862,344.7 Z" fill="#7F8EA0"/>
  <text x="870.0" y="375.0" class="name" text-anchor="start" xml:space="preserve">a model you load</text>
  <text x="870.0" y="393.0" class="sub" text-anchor="start" xml:space="preserve">from ~/models/gguf</text>
  <text x="870.0" y="411.0" class="sub" text-anchor="start" xml:space="preserve">thor-tigress-serve load</text>
  <path class="wire" d="M230,146 L251,146 Q260,146 260,155 L260,245 Q260,254 269,254 L290,254" marker-end="url(#head)"/>
  <path class="wire" d="M230,266 L290,266" marker-end="url(#head)"/>
  <path class="wire" d="M230,386 L251,386 Q260,386 260,377 L260,287 Q260,278 269,278 L290,278" marker-end="url(#head)"/>
  <path class="wire" d="M520,266 L580,266" marker-end="url(#head)"/>
  <path class="wire" d="M800,254 L816,254 Q825,254 825,245 L825,153 Q825,144 834,144 L850,144" marker-end="url(#head)"/>
  <path class="wire idle" d="M800,266 L850,266" marker-end="url(#head-idle)"/>
  <path class="wire idle" d="M800,278 L816,278 Q825,278 825,287 L825,379 Q825,388 834,388 L850,388" marker-end="url(#head-idle)"/>
  <path d="M580,401 A110.0,9 0 0 1 800,401 V475 A110.0,9 0 0 1 580,475 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="690.0" cy="401" rx="110.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="690.0" y="432.0" class="name" text-anchor="middle" xml:space="preserve">~/.config/thor-chat/</text>
  <text x="690.0" y="450.0" class="sub" text-anchor="middle" xml:space="preserve">env → models.ini</text>
  <text x="690.0" y="468.0" class="sub" text-anchor="middle" xml:space="preserve">+ models.local.ini</text>
  <path class="wire idle" d="M690,392 L690,328" marker-end="url(#head-idle)"/>
  <text x="566.0" y="444.0" class="note" text-anchor="end" xml:space="preserve">written by thor-tigress-serve</text>
  <text x="40.0" y="516.0" class="note" text-anchor="start" xml:space="preserve">Each loaded model is its own llama-server process on a private port.</text>
  <text x="40.0" y="533.0" class="note" text-anchor="start" xml:space="preserve">thor-tigress-serve refuses a third; the router alone would evict one.</text>
</svg>
