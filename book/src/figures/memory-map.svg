<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="A 128 GB bar: about 32 GB model weights, 24 GiB reserved for the context of four slots of one million tokens, the rest of the 73 GB in use by buffers, the OS and other programs, and about 49 GB available. Below, the arithmetic: 6 KiB per token, 6 GiB per slot, 24 GiB reserved.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1000" height="420" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Where the Thor&#x27;s memory goes while serving</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The context is paid for at startup, whether or not anyone uses it.</text>
  <text x="60.0" y="104.0" class="mono dim" text-anchor="start" xml:space="preserve">0</text>
  <text x="940.0" y="104.0" class="mono dim" text-anchor="end" xml:space="preserve">128 GB, shared by CPU and GPU</text>
  <clipPath id="clip-60-116"><rect x="60" y="116" width="880" height="56" rx="6"/></clipPath>
  <g clip-path="url(#clip-60-116)" filter="url(#lift)">
  <rect x="60.0" y="116" width="220.0" height="56" fill="#5E9400"/>
  <text x="170.0" y="148.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">weights · 32 GB</text>
  <rect x="280.0" y="116" width="165.0" height="56" fill="#2F6FDB"/>
  <rect x="445.0" y="116" width="116.9" height="56" fill="#8A99AB"/>
  <text x="503.4" y="148.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">OS, buffers</text>
  <rect x="561.9" y="116" width="378.1" height="56" fill="#A9BACB"/>
  <text x="750.9" y="148.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">free and file cache · about 49 GB available</text>
  </g>
  <rect x="60" y="116" width="880" height="56" rx="6" fill="none" stroke="#D5DBE3" stroke-width="1.2"/>
  <line x1="321.2" y1="116" x2="321.2" y2="172" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="362.5" y1="116" x2="362.5" y2="172" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="403.8" y1="116" x2="403.8" y2="172" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="362.5" y="192.0" class="note" text-anchor="middle" xml:space="preserve">context · 24 GiB · slots 0 to 3</text>
  <path d="M60,214 V222 H445 V214" fill="none" stroke="#5D6B7A" stroke-width="1.3"/>
  <text x="252.5" y="242.0" class="note" text-anchor="middle" xml:space="preserve">llama-server: 57.8 GB measured</text>
  <rect x="60" y="290" width="280" height="104" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M72,290.7 H66 V393.3 H72 A11.3,11.3 0 0 1 60.7,382 V302 A11.3,11.3 0 0 1 72,290.7 Z" fill="#7A4FD0"/>
  <text x="80.0" y="320.0" class="name" text-anchor="start" xml:space="preserve">Per token of context</text>
  <text x="80.0" y="338.0" class="sub" text-anchor="start" xml:space="preserve">6 KiB: only 6 of 52 layers</text>
  <text x="80.0" y="356.0" class="sub" text-anchor="start" xml:space="preserve">are attention layers, each</text>
  <text x="80.0" y="374.0" class="sub" text-anchor="start" xml:space="preserve">with 2 key/value heads of 128</text>
  <rect x="360" y="290" width="280" height="104" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M372,290.7 H366 V393.3 H372 A11.3,11.3 0 0 1 360.7,382 V302 A11.3,11.3 0 0 1 372,290.7 Z" fill="#7A4FD0"/>
  <text x="380.0" y="320.0" class="name" text-anchor="start" xml:space="preserve">Per slot</text>
  <text x="380.0" y="338.0" class="sub" text-anchor="start" xml:space="preserve">1,048,576 tokens × 6 KiB</text>
  <text x="380.0" y="356.0" class="sub" text-anchor="start" xml:space="preserve">= 6 GiB, plus a small</text>
  <text x="380.0" y="374.0" class="sub" text-anchor="start" xml:space="preserve">fixed state for the other layers</text>
  <rect x="660" y="290" width="280" height="104" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M672,290.7 H666 V393.3 H672 A11.3,11.3 0 0 1 660.7,382 V302 A11.3,11.3 0 0 1 672,290.7 Z" fill="#7A4FD0"/>
  <text x="680.0" y="320.0" class="name" text-anchor="start" xml:space="preserve">Reserved at start</text>
  <text x="680.0" y="338.0" class="sub" text-anchor="start" xml:space="preserve">for all 4 slots, used or not:</text>
  <text x="680.0" y="356.0" class="sub" text-anchor="start" xml:space="preserve">4 × 6 GiB = 24 GiB;</text>
  <text x="680.0" y="374.0" class="sub" text-anchor="start" xml:space="preserve">today&#x27;s longest chat: 41,674 tokens</text>
</svg>
