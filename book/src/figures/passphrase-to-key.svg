<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="A passphrase and a random salt go into Argon2id, which uses 19 MiB of memory over two passes and produces a 32-byte key that opens the file and is wiped from memory afterwards. A plain hash is fast, so a GPU tries billions of guesses a second; Argon2id makes each guess hold memory and take time.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
  </defs>
  <rect width="960" height="320" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">A passphrase becomes a key</text>

  <rect x="30" y="90" width="250" height="100" rx="10" class="outside"/>
  <text x="155" y="122" class="name" text-anchor="middle">passphrase + salt</text>
  <text x="155" y="146" class="note" text-anchor="middle">the salt is 16 random</text>
  <text x="155" y="164" class="note" text-anchor="middle">bytes, stored in the file</text>

  <rect x="355" y="90" width="250" height="100" rx="10" class="box built"/>
  <text x="480" y="122" class="name" text-anchor="middle">Argon2id</text>
  <text x="480" y="146" class="note" text-anchor="middle">19 MiB of memory, 2 passes</text>
  <text x="480" y="164" class="note" text-anchor="middle">slow on purpose</text>

  <rect x="680" y="90" width="250" height="100" rx="10" class="box built"/>
  <text x="805" y="122" class="name" text-anchor="middle">a 32-byte key</text>
  <text x="805" y="146" class="note" text-anchor="middle">opens the file, then</text>
  <text x="805" y="164" class="note" text-anchor="middle">wiped from memory</text>

  <path class="flow" d="M280,140 L343,140" marker-end="url(#arrow)"/>
  <path class="flow" d="M605,140 L668,140" marker-end="url(#arrow)"/>

  <line x1="30" y1="220" x2="930" y2="220" stroke="#D5DCE4" stroke-width="1"/>
  <text x="30" y="248" class="note">A plain hash is fast: a GPU tries billions of guesses a second.</text>
  <text x="30" y="274" class="warn">Argon2id makes each guess hold 19 MiB and take a moment, so guessing slows.</text>
  <text x="30" y="300" class="note">Same passphrase and salt give the same key, every time.</text>
</svg>
