<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" role="img" aria-label="Argon2id turns a passphrase, a random salt and fixed parameters (19 MiB, 2 passes, 1 lane) into a 32-byte key. A plain hash lets a GPU try billions of guesses a second; Argon2id makes each guess hold 19 MiB and take a moment.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1040" height="330" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A passphrase becomes a key</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The slow step in the middle is the protection.</text>
  <rect x="40" y="110" width="270" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,110.7 H46 V201.3 H52 A11.3,11.3 0 0 1 40.7,190 V122 A11.3,11.3 0 0 1 52,110.7 Z" fill="#B7791F"/>
  <rect x="56" y="140.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(62.0,146.0) scale(0.8333)"><path d="M14.5 2a7.5 7.5 0 0 0-7.2 9.6L2 16.9V22h5.1v-2.5h2.5V17h2.4l1-1a7.5 7.5 0 1 0 1.5-14zm2.2 4.3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="98.0" y="143.0" class="name" text-anchor="start" xml:space="preserve">passphrase + salt</text>
  <text x="98.0" y="161.0" class="sub" text-anchor="start" xml:space="preserve">the salt is 16 random</text>
  <text x="98.0" y="179.0" class="sub" text-anchor="start" xml:space="preserve">bytes, stored in the file</text>
  <rect x="385" y="110" width="270" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M397,110.7 H391 V201.3 H397 A11.3,11.3 0 0 1 385.7,190 V122 A11.3,11.3 0 0 1 397,110.7 Z" fill="#1F8A70"/>
  <rect x="401" y="140.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(407.0,146.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="443.0" y="143.0" class="name" text-anchor="start" xml:space="preserve">Argon2id</text>
  <text x="443.0" y="161.0" class="sub" text-anchor="start" xml:space="preserve">19 MiB of memory, 2 passes</text>
  <text x="443.0" y="179.0" class="sub" text-anchor="start" xml:space="preserve">slow on purpose</text>
  <rect x="730" y="110" width="270" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M742,110.7 H736 V201.3 H742 A11.3,11.3 0 0 1 730.7,190 V122 A11.3,11.3 0 0 1 742,110.7 Z" fill="#2E8B3D"/>
  <rect x="746" y="140.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(752.0,146.0) scale(0.8333)"><path d="M14.5 2a7.5 7.5 0 0 0-7.2 9.6L2 16.9V22h5.1v-2.5h2.5V17h2.4l1-1a7.5 7.5 0 1 0 1.5-14zm2.2 4.3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="788.0" y="143.0" class="name" text-anchor="start" xml:space="preserve">a 32-byte key</text>
  <text x="788.0" y="161.0" class="sub" text-anchor="start" xml:space="preserve">opens the file, then</text>
  <text x="788.0" y="179.0" class="sub" text-anchor="start" xml:space="preserve">wiped from memory</text>
  <path class="wire" d="M310,156 L385,156" marker-end="url(#head)"/>
  <path class="wire" d="M655,156 L730,156" marker-end="url(#head)"/>
  <text x="40.0" y="250.0" class="note" text-anchor="start" xml:space="preserve">A plain hash is fast: a GPU tries billions of guesses a second.</text>
  <text x="40.0" y="272.0" class="note" text-anchor="start" xml:space="preserve">Argon2id makes each guess hold 19 MiB and take a moment, so guessing slows.</text>
  <text x="40.0" y="294.0" class="note" text-anchor="start" xml:space="preserve">The same passphrase and salt give the same key, every time.</text>
</svg>
