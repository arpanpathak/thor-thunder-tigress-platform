<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" width="1000" height="466" role="img" aria-label="Answers that called web_search, of three tries each. Nemotron searched for the Rust, Raspberry Pi, CUDA, Formula 1 and RTX questions and once for the median task, 15 of 18. Qwen searched only for the CUDA question, 3 of 18.">
