<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="One key file on the Thor, made by serve.sh key. Browsers and agents send it as Authorization: Bearer or x-api-key over HTTPS through Tailscale Funnel. thor-tigress-agent compares it and answers 401 when it is wrong; otherwise it forwards with its own key to llama-server, which checks again.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; }
    .deny { stroke: #D9542B; stroke-width: 1.8; fill: none; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" orient="auto">
      <path d="M0,0.8 L11,5 L0,9.2 L2.6,5 Z" fill="#1E88A8"/>
    </marker>
    <marker id="arrow-deny" viewBox="0 0 12 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" orient="auto">
      <path d="M0,0.8 L11,5 L0,9.2 L2.6,5 Z" fill="#D9542B"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">How the access key is checked</text>
  <rect x="560" y="56" width="372" height="330" rx="14" class="zone"/>
  <text x="574" y="76" class="zonelabel">Jetson AGX Thor</text>
  <rect x="590" y="84" width="316" height="64" rx="10" class="box built"/>
  <text x="748.0" y="112" class="name mono" text-anchor="middle">~/.config/thor-chat/api-key</text>
  <text x="748.0" y="132" class="note" text-anchor="middle">mode 600; made by ./serve.sh key</text>
  <rect x="580" y="200" width="170" height="90" rx="10" class="box built"/>
  <text x="665.0" y="232" class="name mono" text-anchor="middle">thor-tigress-agent</text>
  <text x="665.0" y="252" class="note" text-anchor="middle">compares the</text>
  <text x="665.0" y="269" class="note" text-anchor="middle">Authorization header</text>
  <rect x="778" y="200" width="138" height="90" rx="10" class="box built"/>
  <text x="847.0" y="232" class="name mono" text-anchor="middle">llama-server</text>
  <text x="847.0" y="252" class="note" text-anchor="middle">--api-key-file;</text>
  <text x="847.0" y="269" class="note" text-anchor="middle">checks it again</text>
  <path class="flow" d="M664,150 L664,198" marker-end="url(#arrow)"/>
  <text x="672" y="178" class="label" text-anchor="start">reads at start</text>
  <path class="flow" d="M838,150 L838,198" marker-end="url(#arrow)"/>
  <text x="846" y="178" class="label" text-anchor="start">reads at start</text>
  <path class="flow" d="M752,245 L776,245" marker-end="url(#arrow)"/>
  <text x="755" y="312" class="label" text-anchor="middle">forwards with its own Bearer key</text>
  <rect x="30" y="84" width="210" height="76" rx="10" class="outside"/>
  <text x="135.0" y="109" class="name" text-anchor="middle">Browser</text>
  <text x="135.0" y="129" class="note" text-anchor="middle">key in local storage,</text>
  <text x="135.0" y="146" class="note" text-anchor="middle">pasted on the invite screen</text>
  <rect x="30" y="196" width="210" height="76" rx="10" class="outside"/>
  <text x="135.0" y="230" class="name" text-anchor="middle">Agents</text>
  <text x="135.0" y="250" class="note" text-anchor="middle">key file, or env variable</text>
  <rect x="300" y="140" width="200" height="80" rx="10" class="outside"/>
  <text x="400.0" y="167" class="name" text-anchor="middle">Tailscale Funnel</text>
  <text x="400.0" y="187" class="note" text-anchor="middle">HTTPS: the header is</text>
  <text x="400.0" y="204" class="note" text-anchor="middle">encrypted in transit</text>
  <path class="flow" d="M242,122 C272,122 270,166 298,166" marker-end="url(#arrow)"/>
  <path class="flow" d="M242,234 C272,234 270,194 298,194" marker-end="url(#arrow)"/>
  <text x="400" y="244" class="label" text-anchor="middle">Authorization: Bearer key</text>
  <text x="400" y="261" class="label" text-anchor="middle">or x-api-key: key</text>
  <path class="flow" d="M502,200 C540,200 540,245 578,245" marker-end="url(#arrow)"/>
  <path class="deny" d="M580,272 C520,340 300,340 140,276" marker-end="url(#arrow-deny)"/>
  <text x="360" y="352" class="warn" text-anchor="middle">wrong or missing key on /v1/…: 401</text>
</svg>
