<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="One key file on the Thor, made by serve.sh key. Browsers and agents send it as Authorization: Bearer or x-api-key over HTTPS through Tailscale Funnel. thor-tigress-agent compares it and answers 401 when it is wrong; otherwise it forwards with its own key to llama-server, which checks again.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
    <marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D9542B"/>
    </marker>
  </defs>
  <rect width="960" height="410" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">How the access key is checked</text>
  <rect x="30" y="80" width="210" height="76" rx="10" class="outside"/>
  <text x="135" y="106" class="name" text-anchor="middle">Browser</text>
  <text x="135" y="125" class="note" text-anchor="middle">key in local storage,</text>
  <text x="135" y="142" class="note" text-anchor="middle">pasted on the invite screen</text>
  <rect x="30" y="196" width="210" height="76" rx="10" class="outside"/>
  <text x="135" y="230" class="name" text-anchor="middle">Agents</text>
  <text x="135" y="250" class="note" text-anchor="middle">key file, or env variable</text>
  <rect x="300" y="136" width="200" height="80" rx="10" class="outside"/>
  <text x="400" y="164" class="name" text-anchor="middle">Tailscale Funnel</text>
  <text x="400" y="183" class="note" text-anchor="middle">HTTPS: the header is</text>
  <text x="400" y="200" class="note" text-anchor="middle">encrypted in transit</text>
  <path class="flow" d="M240,118 L260.0,118.0 Q270,118 270.0,128.0 L270.0,150.0 Q270,160 280.0,160.0 L298,160" marker-end="url(#arrow)"/>
  <path class="flow" d="M240,234 L260.0,234.0 Q270,234 270.0,224.0 L270.0,202.0 Q270,192 280.0,192.0 L298,192" marker-end="url(#arrow)"/>
  <text x="400" y="236" class="label" text-anchor="middle">Authorization: Bearer key</text>
  <text x="400" y="253" class="label" text-anchor="middle">or x-api-key: key</text>
  <rect x="560" y="56" width="372" height="300" rx="14" class="zone"/>
  <text x="574" y="76" class="zonelabel">Jetson AGX Thor</text>
  <rect x="588" y="82" width="318" height="60" rx="10" class="box built"/>
  <text x="747" y="108" class="name mono" text-anchor="middle">~/.config/thor-chat/api-key</text>
  <text x="747" y="128" class="note" text-anchor="middle">mode 600; made by ./serve.sh key</text>
  <rect x="588" y="196" width="170" height="80" rx="10" class="box built"/>
  <text x="673" y="224" class="name mono" text-anchor="middle">thor-tigress-agent</text>
  <text x="673" y="243" class="note" text-anchor="middle">compares the</text>
  <text x="673" y="260" class="note" text-anchor="middle">Authorization header</text>
  <rect x="786" y="196" width="120" height="80" rx="10" class="box built"/>
  <text x="846" y="224" class="name mono" text-anchor="middle">llama-server</text>
  <text x="846" y="243" class="note" text-anchor="middle">--api-key-file;</text>
  <text x="846" y="260" class="note" text-anchor="middle">checks again</text>
  <path class="flow" d="M673,142 L673,194" marker-end="url(#arrow)"/>
  <path class="flow" d="M846,142 L846,194" marker-end="url(#arrow)"/>
  <text x="681" y="172" class="label" text-anchor="start">read at start</text>
  <text x="854" y="172" class="label" text-anchor="start">read at start</text>
  <path class="flow" d="M500,176 L530.0,176.0 Q540,176 540.0,186.0 L540.0,226.0 Q540,236 550.0,236.0 L586,236" marker-end="url(#arrow)"/>
  <path class="flow" d="M758,236 L784,236" marker-end="url(#arrow)"/>
  <text x="747" y="300" class="label" text-anchor="middle">forwards with its own Bearer key</text>
  <path class="deny" d="M673,276 L673.0,370.0 Q673,380 663.0,380.0 L145.0,380.0 Q135,380 135.0,370.0 L135,274" marker-end="url(#arrow-deny)"/>
  <text x="404" y="372" class="warn" text-anchor="middle">wrong or missing key on /v1/…: 401</text>
</svg>
