<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 480" width="1044" height="480" role="img" aria-label="Your friend&#x27;s laptop and your machines reach the Thor over the tailnet. The Thor holds two logins, friend and arpanpathak, and one GPU the two of them share.">
  <style>
