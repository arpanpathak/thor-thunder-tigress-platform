  <text x="358.0" y="347.0" class="sub" text-anchor="start" xml:space="preserve">answers only for its own</text>
  <text x="358.0" y="365.0" class="sub" text-anchor="start" xml:space="preserve">.ts.net name</text>
  <rect x="650" y="300" width="270" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
