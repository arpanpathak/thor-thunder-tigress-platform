  <text x="708.0" y="133.0" class="name" text-anchor="start" xml:space="preserve">GitHub Pages</text>
  <text x="708.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">the forwarding page</text>
  <text x="708.0" y="169.0" class="sub" text-anchor="start" xml:space="preserve">Let&#x27;s Encrypt certificate</text>
