<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 462" width="960" height="462" role="img" aria-label="Three steps. One, the browser asks Namecheap&#x27;s nameservers, whose A records give GitHub&#x27;s addresses. Two, it connects to GitHub Pages, which holds a Let&#x27;s Encrypt certificate for voltforge.tech and returns the forwarding page. Three, the page sends the browser to the .ts.net name, where Tailscale Funnel answers and passes the request to thor-tigress-agent on the Thor at 127.0.0.1:8080.">
