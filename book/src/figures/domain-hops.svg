  <rect x="160.0" y="296" width="66.8" height="18" rx="9" fill="#EAF1FD"/>
  <text x="193.4" y="308.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3 · jump</text>
  <text x="40.0" y="420.0" class="note" text-anchor="start" xml:space="preserve">A domain cannot point at Funnel directly: Funnel holds a certificate only for its own name.</text>
  <text x="40.0" y="437.0" class="note" text-anchor="start" xml:space="preserve">So GitHub Pages answers for voltforge.tech, with its own certificate, and sends the browser on.</text>
</svg>
