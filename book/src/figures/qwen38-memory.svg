<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-label="Of the Thor&#x27;s 122.8 GiB, Qwen3.8 Flash Next&#x27;s weights, n-gram table and runtime take 104.6 GiB, the KV cache 7.3, activations and CUDA graphs 2.3, and Linux, the agent and other processes 6.6, leaving about 2 GiB free. The KV cache is small because only 12 layers keep one: 262,144 tokens times 12 layers times 2 heads times 256 times 2 for key and value times 2 bytes is about 6 GiB. Nemotron 3 Nano at Q8_0 needs about 40 GiB, so it cannot be loaded at the same time.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1040" height="420" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Where the Thor&#x27;s memory goes</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">One model, the full 262,144-token context, and about 2 GiB to spare.</text>
  <clipPath id="clip-40-130"><rect x="40" y="130" width="960" height="46" rx="6"/></clipPath>
  <g clip-path="url(#clip-40-130)" filter="url(#lift)">
  <rect x="40.0" y="130" width="817.7" height="46" fill="#5E9400"/>
  <text x="448.9" y="157.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">weights and runtime · 104.6 GiB</text>
  <rect x="857.7" y="130" width="57.1" height="46" fill="#B7791F"/>
  <text x="886.3" y="157.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">KV</text>
  <rect x="914.8" y="130" width="18.0" height="46" fill="#7A4FD0"/>
  <rect x="932.8" y="130" width="51.6" height="46" fill="#7F8EA0"/>
  <rect x="984.4" y="130" width="15.6" height="46" fill="#E3E7EC"/>
  </g>
  <rect x="40" y="130" width="960" height="46" rx="6" fill="none" stroke="#D5DBE3" stroke-width="1.2"/>
  <rect x="40" y="204" width="14" height="14" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="61.0" y="215.5" class="note" text-anchor="start" xml:space="preserve">weights, n-gram table, runtime: 104.6</text>
  <rect x="327.20000000000005" y="204" width="14" height="14" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="348.2" y="215.5" class="note" text-anchor="start" xml:space="preserve">KV cache: 7.3</text>
  <rect x="456.00000000000006" y="204" width="14" height="14" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="477.0" y="215.5" class="note" text-anchor="start" xml:space="preserve">activations, graphs: 2.3</text>
  <rect x="657.4000000000001" y="204" width="14" height="14" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="678.4" y="215.5" class="note" text-anchor="start" xml:space="preserve">Linux, agent, others: 6.6</text>
  <text x="40.0" y="244.0" class="note" text-anchor="start" xml:space="preserve">Left free: about 2 GiB of 122.8. All numbers in GiB, from vLLM&#x27;s startup log and free -g.</text>
  <rect x="40" y="290" width="470" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,290.7 H46 V385.3 H52 A11.3,11.3 0 0 1 40.7,374 V302 A11.3,11.3 0 0 1 52,290.7 Z" fill="#B7791F"/>
  <rect x="56" y="322.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(62.0,328.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="98.0" y="316.0" class="name" text-anchor="start" xml:space="preserve">Why the KV cache is small</text>
  <text x="98.0" y="334.0" class="sub" text-anchor="start" xml:space="preserve">262,144 tokens × 12 layers × 2 heads × 256</text>
  <text x="98.0" y="352.0" class="sub" text-anchor="start" xml:space="preserve">× 2 (key, value) × 2 bytes ≈ 6 GiB,</text>
  <text x="98.0" y="370.0" class="sub" text-anchor="start" xml:space="preserve">and 36 layers keep a fixed-size state</text>
  <rect x="530" y="290" width="470" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M542,290.7 H536 V385.3 H542 A11.3,11.3 0 0 1 530.7,374 V302 A11.3,11.3 0 0 1 542,290.7 Z" fill="#CF4526"/>
  <rect x="546" y="322.0" width="32" height="32" rx="8" fill="#FCEBE6"/>
  <g transform="translate(552.0,328.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#CF4526" fill-rule="evenodd"/></g>
  <text x="588.0" y="316.0" class="name" text-anchor="start" xml:space="preserve">Why nothing else fits</text>
  <text x="588.0" y="334.0" class="sub" text-anchor="start" xml:space="preserve">Nemotron 3 Nano Q8_0 needs ~40 GiB.</text>
  <text x="588.0" y="352.0" class="sub" text-anchor="start" xml:space="preserve">A large cargo build can reach the</text>
  <text x="588.0" y="370.0" class="sub" text-anchor="start" xml:space="preserve">OOM killer, which picks the biggest process</text>
</svg>
