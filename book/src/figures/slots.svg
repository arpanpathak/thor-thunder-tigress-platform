  <text x="540.0" y="251.0" class="sub" text-anchor="start" xml:space="preserve">up to 1,048,576 tokens</text>
  <text x="540.0" y="269.0" class="sub" text-anchor="start" xml:space="preserve">borrowed for one reply</text>
  <path class="wire" d="M450,267 L476,267 Q485,267 485,258 L485,255 Q485,246 494,246 L520,246" marker-end="url(#head)"/>
