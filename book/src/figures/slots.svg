  <rect x="40" y="306" width="150" height="46" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,306.7 H46 V351.3 H52 A11.3,11.3 0 0 1 40.7,340 V318 A11.3,11.3 0 0 1 52,306.7 Z" fill="#2F6FDB"/>
  <text x="60.0" y="334.0" class="name" text-anchor="start" xml:space="preserve">Browser</text>
  <path class="wire" d="M190,329 L211,329 Q220,329 220,320 L220,276 Q220,267 229,267 L280,267" marker-end="url(#head)"/>
  <rect x="40" y="368" width="150" height="46" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,368.7 H46 V413.3 H52 A11.3,11.3 0 0 1 40.7,402 V380 A11.3,11.3 0 0 1 52,368.7 Z" fill="#2F6FDB"/>
  <text x="60.0" y="396.0" class="name" text-anchor="start" xml:space="preserve">Agent</text>
  <path class="wire" d="M190,391 L211,391 Q220,391 220,382 L220,276 Q220,267 229,267 L280,267" marker-end="url(#head)"/>
  <text x="40.0" y="446.0" class="note" text-anchor="start" xml:space="preserve">any number of people,</text>
  <text x="40.0" y="463.0" class="note" text-anchor="start" xml:space="preserve">one key</text>
  <rect x="280" y="217" width="170" height="100" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M292,217.7 H286 V316.3 H292 A11.3,11.3 0 0 1 280.7,305 V229 A11.3,11.3 0 0 1 292,217.7 Z" fill="#7F8EA0"/>
  <text x="300.0" y="245.0" class="name" text-anchor="start" xml:space="preserve">Queue</text>
  <text x="300.0" y="263.0" class="sub" text-anchor="start" xml:space="preserve">requests wait here</text>
  <text x="300.0" y="281.0" class="sub" text-anchor="start" xml:space="preserve">when all 4 slots</text>
  <text x="300.0" y="299.0" class="sub" text-anchor="start" xml:space="preserve">are busy</text>
  <path d="M830,189 A85.0,9 0 0 1 1000,189 V345 A85.0,9 0 0 1 830,345 Z" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="915.0" cy="189" rx="85.0" ry="9" fill="#FFFFFF" stroke="#5E9400" stroke-width="1.4"/>
  <text x="915.0" y="234.0" class="name" text-anchor="middle" xml:space="preserve">Model weights</text>
  <text x="915.0" y="252.0" class="sub" text-anchor="middle" xml:space="preserve">one copy, 32 GB,</text>
  <text x="915.0" y="270.0" class="sub" text-anchor="middle" xml:space="preserve">shared by all slots;</text>
  <text x="915.0" y="288.0" class="sub" text-anchor="middle" xml:space="preserve">every step reads</text>
  <text x="915.0" y="306.0" class="sub" text-anchor="middle" xml:space="preserve">the weights it uses</text>
  <text x="915.0" y="324.0" class="sub" text-anchor="middle" xml:space="preserve">once for all slots</text>
  <rect x="520" y="127" width="230" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M532,127.7 H526 V196.3 H532 A11.3,11.3 0 0 1 520.7,185 V139 A11.3,11.3 0 0 1 532,127.7 Z" fill="#1F8A70"/>
  <text x="540.0" y="149.0" class="name" text-anchor="start" xml:space="preserve">Slot 0</text>
  <text x="540.0" y="167.0" class="sub" text-anchor="start" xml:space="preserve">up to 1,048,576 tokens</text>
  <text x="540.0" y="185.0" class="sub" text-anchor="start" xml:space="preserve">borrowed for one reply</text>
  <path class="wire" d="M450,267 L476,267 Q485,267 485,258 L485,171 Q485,162 494,162 L520,162" marker-end="url(#head)"/>
