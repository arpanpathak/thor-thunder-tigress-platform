  <text x="540.0" y="335.0" class="sub" text-anchor="start" xml:space="preserve">up to 1,048,576 tokens</text>
  <text x="540.0" y="353.0" class="sub" text-anchor="start" xml:space="preserve">borrowed for one reply</text>
  <path class="wire" d="M450,267 L476,267 Q485,267 485,276 L485,321 Q485,330 494,330 L520,330" marker-end="url(#head)"/>
