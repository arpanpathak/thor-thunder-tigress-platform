  <text x="540.0" y="437.0" class="sub" text-anchor="start" xml:space="preserve">borrowed for one reply</text>
  <path class="wire" d="M450,267 L476,267 Q485,267 485,276 L485,405 Q485,414 494,414 L520,414" marker-end="url(#head)"/>
