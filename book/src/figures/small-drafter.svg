<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" width="1040" height="610" role="img" aria-label="A 1.1B-parameter drafter guesses the next four tokens, Bolt checks all four in one pass over its 9 billion active parameters, and keeps the guesses up to the first wrong one plus one token of its own. Measured on the Thor with thinking off: no drafter 27.2 tokens a second on prose and 27.3 on code; draft length 3 gave 35.5 and 47.6; 4 gave 47.4 and 52.3; 5 gave 41.7 and 53.2; 7 gave 36.3 and 42.7. The chat uses draft 4.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1040" height="610" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Guess four, check once</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A small drafter proposes tokens; Bolt verifies them together. The draft length was tuned by measuring.</text>
  <rect x="40" y="130" width="210" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,130.7 H46 V199.3 H52 A11.3,11.3 0 0 1 40.7,188 V142 A11.3,11.3 0 0 1 52,130.7 Z" fill="#2E8B3D"/>
  <rect x="56" y="149.0" width="32" height="32" rx="8" fill="#E7F5E9"/>
  <g transform="translate(62.0,155.0) scale(0.8333)"><path d="M3 21l1.5-5.5L15.2 4.8l4 4L8.5 19.5zM16.6 3.4l1.3-1.3a1 1 0 0 1 1.4 0l2.6 2.6a1 1 0 0 1 0 1.4l-1.3 1.3z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <text x="98.0" y="152.0" class="name" text-anchor="start" xml:space="preserve">Drafter</text>
  <text x="98.0" y="170.0" class="sub" text-anchor="start" xml:space="preserve">1.1B parameters,</text>
  <text x="98.0" y="188.0" class="sub" text-anchor="start" xml:space="preserve">guesses 4 tokens</text>
  <rect x="300" y="130" width="300" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M312,130.7 H306 V199.3 H312 A11.3,11.3 0 0 1 300.7,188 V142 A11.3,11.3 0 0 1 312,130.7 Z" fill="#5E9400"/>
  <rect x="316" y="149.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(322.0,155.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#5E9400" fill-rule="evenodd"/></g>
  <text x="358.0" y="152.0" class="name" text-anchor="start" xml:space="preserve">Bolt checks all 4 at once</text>
  <text x="358.0" y="170.0" class="sub" text-anchor="start" xml:space="preserve">one pass over its 9B</text>
  <text x="358.0" y="188.0" class="sub" text-anchor="start" xml:space="preserve">active parameters</text>
  <rect x="650" y="130" width="350" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M662,130.7 H656 V199.3 H662 A11.3,11.3 0 0 1 650.7,188 V142 A11.3,11.3 0 0 1 662,130.7 Z" fill="#1F8A70"/>
  <rect x="666" y="149.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(672.0,155.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="708.0" y="152.0" class="name" text-anchor="start" xml:space="preserve">Keeps the guesses it agrees with</text>
  <text x="708.0" y="170.0" class="sub" text-anchor="start" xml:space="preserve">up to the first wrong one,</text>
  <text x="708.0" y="188.0" class="sub" text-anchor="start" xml:space="preserve">plus one token of its own</text>
  <path class="wire" d="M250,165 L300,165" marker-end="url(#head)"/>
  <path class="wire" d="M600,165 L650,165" marker-end="url(#head)"/>
  <text x="40.0" y="250.0" class="name" text-anchor="start" xml:space="preserve">Measured on the Thor: thinking off, 800 tokens, one request</text>
  <text x="40.0" y="302.0" class="sub" text-anchor="start" xml:space="preserve">no drafter</text>
  <rect x="150" y="282" width="190.4" height="14" rx="4" fill="#2F6FDB"/>
  <text x="348.4" y="293.0" class="note" text-anchor="start" xml:space="preserve">27.2 tok/s, prose</text>
  <rect x="150" y="298" width="191.1" height="14" rx="4" fill="#5E9400"/>
  <text x="349.1" y="309.0" class="note" text-anchor="start" xml:space="preserve">27.3 tok/s, code</text>
  <text x="40.0" y="348.0" class="sub" text-anchor="start" xml:space="preserve">draft 3</text>
  <rect x="150" y="328" width="248.5" height="14" rx="4" fill="#2F6FDB"/>
  <text x="406.5" y="339.0" class="note" text-anchor="start" xml:space="preserve">35.5 tok/s, prose</text>
  <rect x="150" y="344" width="333.2" height="14" rx="4" fill="#5E9400"/>
  <text x="491.2" y="355.0" class="note" text-anchor="start" xml:space="preserve">47.6 tok/s, code</text>
  <text x="40.0" y="394.0" class="sub" text-anchor="start" xml:space="preserve">draft 4</text>
  <rect x="150" y="374" width="331.8" height="14" rx="4" fill="#2F6FDB"/>
  <text x="489.8" y="385.0" class="note" text-anchor="start" xml:space="preserve">47.4 tok/s, prose</text>
  <rect x="150" y="390" width="366.1" height="14" rx="4" fill="#5E9400"/>
  <text x="524.1" y="401.0" class="note" text-anchor="start" xml:space="preserve">52.3 tok/s, code</text>
  <text x="40.0" y="440.0" class="sub" text-anchor="start" xml:space="preserve">draft 5</text>
  <rect x="150" y="420" width="291.9" height="14" rx="4" fill="#2F6FDB"/>
  <text x="449.9" y="431.0" class="note" text-anchor="start" xml:space="preserve">41.7 tok/s, prose</text>
  <rect x="150" y="436" width="372.4" height="14" rx="4" fill="#5E9400"/>
  <text x="530.4" y="447.0" class="note" text-anchor="start" xml:space="preserve">53.2 tok/s, code</text>
  <text x="40.0" y="486.0" class="sub" text-anchor="start" xml:space="preserve">draft 7</text>
  <rect x="150" y="466" width="254.1" height="14" rx="4" fill="#2F6FDB"/>
  <text x="412.1" y="477.0" class="note" text-anchor="start" xml:space="preserve">36.3 tok/s, prose</text>
  <rect x="150" y="482" width="298.9" height="14" rx="4" fill="#5E9400"/>
  <text x="456.9" y="493.0" class="note" text-anchor="start" xml:space="preserve">42.7 tok/s, code</text>
  <rect x="40.0" y="520" width="14" height="14" rx="4" fill="#2F6FDB"/>
  <text x="61.0" y="531.5" class="note" text-anchor="start" xml:space="preserve">explain a HashMap</text>
  <rect x="197.2" y="520" width="14" height="14" rx="4" fill="#5E9400"/>
  <text x="218.2" y="531.5" class="note" text-anchor="start" xml:space="preserve">write a CSV parser with tests</text>
  <text x="40.0" y="566.0" class="note" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">At draft 7, llama.cpp&#x27;s counters showed 28 to 47% of drafted tokens kept: most of a long draft is wasted work.</text>
  <text x="40.0" y="583.0" class="note" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">Code repeats itself more than prose, so more guesses land. The chat uses draft 4.</text>
</svg>
