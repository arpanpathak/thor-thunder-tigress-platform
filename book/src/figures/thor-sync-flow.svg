  <text x="106.0" y="277.0" class="name" text-anchor="start" xml:space="preserve">thor-sync</text>
  <text x="106.0" y="295.0" class="sub" text-anchor="start" xml:space="preserve">watches the folders</text>
  <text x="106.0" y="313.0" class="sub" text-anchor="start" xml:space="preserve">on its list</text>
