  <rect width="1064" height="478" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">What thor-sync copies, and where it lands</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">One direction only: from your machine to the Thor.</text>
  <rect x="24" y="108" width="480" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="42" y="97" width="122.4" height="22" rx="11" fill="#1B2430"/>
