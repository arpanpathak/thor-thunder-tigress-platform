  <text x="524.0" y="375.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">rsync over ssh thor · one way</text>
  <text x="48.0" y="438.0" class="note" text-anchor="start" xml:space="preserve">Skipped: what .gitignore skips, and the exclude list. The include list copies ignored paths anyway.</text>
