<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 532" width="1060" height="532" role="img" aria-label="fetch_page_content_recursive reads the cited page at depth 0, then up to three of its own links at depth 1, then their links at depth 2, but no further. It follows only links on the cited page&#x27;s own site, and a panel lists the limits: 6 pages in all, 2 hops deep, 12,000 characters a page, 24,000 in all, 10 seconds and 2 MB a page, https text pages only.">
  <style>
