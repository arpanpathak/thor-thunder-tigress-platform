<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="A timeline of 2026-10-10 from 11:00 to midnight. Nemotron 3 Nano was loaded 11:13 to 11:46, loaded again by a request at 13:45:54 until 21:23:54, llama-server was restarted at 21:24:01 with load-on-startup false, and a request loaded the model again at 21:38:09 until 22:51. llama-server was stopped at 00:03.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1000" height="400" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Nemotron 3 Nano in memory on 2026-10-10</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">From the llama-server journal. The two loads in red were started by a request, not by a person.</text>
  <line x1="80" y1="214" x2="930" y2="214" stroke="#5D6B7A" stroke-width="1.5"/>
  <line x1="80.0" y1="209" x2="80.0" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="80.0" y="236.0" class="note" text-anchor="middle" xml:space="preserve">11:00</text>
  <line x1="143.0" y1="209" x2="143.0" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="143.0" y="236.0" class="note" text-anchor="middle" xml:space="preserve">12:00</text>
  <line x1="205.9" y1="209" x2="205.9" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="205.9" y="236.0" class="note" text-anchor="middle" xml:space="preserve">13:00</text>
  <line x1="268.9" y1="209" x2="268.9" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="268.9" y="236.0" class="note" text-anchor="middle" xml:space="preserve">14:00</text>
  <line x1="331.9" y1="209" x2="331.9" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="331.9" y="236.0" class="note" text-anchor="middle" xml:space="preserve">15:00</text>
  <line x1="394.8" y1="209" x2="394.8" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="394.8" y="236.0" class="note" text-anchor="middle" xml:space="preserve">16:00</text>
  <line x1="457.8" y1="209" x2="457.8" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="457.8" y="236.0" class="note" text-anchor="middle" xml:space="preserve">17:00</text>
  <line x1="520.7" y1="209" x2="520.7" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="520.7" y="236.0" class="note" text-anchor="middle" xml:space="preserve">18:00</text>
  <line x1="583.7" y1="209" x2="583.7" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="583.7" y="236.0" class="note" text-anchor="middle" xml:space="preserve">19:00</text>
  <line x1="646.7" y1="209" x2="646.7" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="646.7" y="236.0" class="note" text-anchor="middle" xml:space="preserve">20:00</text>
  <line x1="709.6" y1="209" x2="709.6" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="709.6" y="236.0" class="note" text-anchor="middle" xml:space="preserve">21:00</text>
  <line x1="772.6" y1="209" x2="772.6" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="772.6" y="236.0" class="note" text-anchor="middle" xml:space="preserve">22:00</text>
  <line x1="835.6" y1="209" x2="835.6" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="835.6" y="236.0" class="note" text-anchor="middle" xml:space="preserve">23:00</text>
  <line x1="898.5" y1="209" x2="898.5" y2="219" stroke="#5D6B7A" stroke-width="1"/>
  <text x="898.5" y="236.0" class="note" text-anchor="middle" xml:space="preserve">00:00</text>
  <rect x="94.2" y="180" width="34.6" height="28" rx="6" fill="#CF4526" opacity="0.88" filter="url(#lift)"/>
  <rect x="254.1" y="180" width="480.6" height="28" rx="6" fill="#CF4526" opacity="0.88" filter="url(#lift)"/>
  <rect x="749.7" y="180" width="76.8" height="28" rx="6" fill="#CF4526" opacity="0.88" filter="url(#lift)"/>
  <line x1="94.2" y1="118" x2="94.2" y2="178" stroke="#7F8EA0" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="99.2" y="112.0" class="note" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">11:13 loaded</text>
  <line x1="254.1" y1="118" x2="254.1" y2="178" stroke="#CF4526" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="259.1" y="112.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">13:45:54 loaded by a request</text>
  <line x1="749.7" y1="118" x2="749.7" y2="178" stroke="#CF4526" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="744.7" y="112.0" class="note" text-anchor="end" style="fill:#CF4526" xml:space="preserve">21:38:09 loaded by a request</text>
  <line x1="901.7" y1="146" x2="901.7" y2="178" stroke="#7F8EA0" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="896.7" y="140.0" class="note" text-anchor="end" style="fill:#7F8EA0" xml:space="preserve">00:03 stopped</text>
  <line x1="128.8" y1="254" x2="128.8" y2="244" stroke="#7F8EA0" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="133.8" y="268.0" class="note" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">11:46 unloaded</text>
  <line x1="734.7" y1="254" x2="734.7" y2="244" stroke="#7F8EA0" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="729.7" y="268.0" class="note" text-anchor="end" style="fill:#7F8EA0" xml:space="preserve">21:23:54 unloaded</text>
  <line x1="826.4" y1="254" x2="826.4" y2="244" stroke="#7F8EA0" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="831.4" y="268.0" class="note" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">22:51 unloaded</text>
  <line x1="734.8" y1="282" x2="734.8" y2="244" stroke="#7F8EA0" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="729.8" y="296.0" class="note" text-anchor="end" style="fill:#7F8EA0" xml:space="preserve">21:24:01 restarted with load-on-startup = false</text>
  <rect x="80" y="324" width="14" height="14" rx="4" fill="#CF4526" opacity="0.88"/>
  <text x="102.0" y="335.5" class="note" text-anchor="start" xml:space="preserve">the model in memory</text>
  <text x="80.0" y="362.0" class="note" text-anchor="start" xml:space="preserve">The 21:24 restart set load-on-startup = false. Fourteen minutes later the model was back: the setting only</text>
  <text x="80.0" y="379.0" class="note" text-anchor="start" xml:space="preserve">governs startup, and with autoload on, router mode loads a preset model for any request that names it.</text>
</svg>
