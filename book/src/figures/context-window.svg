<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="The context window is one fixed budget per reply: the system prompt, the whole conversation so far, any pasted text, and the reply being written. Every message re-sends the whole history because the model keeps no memory between requests. Four slots run four replies at once, each with its own window.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .accent { fill: #E8F4FF; stroke: #1E88A8; stroke-width: 2; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
    <marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D9542B"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#FFFFFF"/>
  <text x="30" y="34" class="title">The context window is the desk the model works at</text>

  <rect x="40" y="60" width="560" height="300" rx="10" class="zone"/>
  <text x="54" y="82" class="zonelabel">one reply's window</text>
  <rect x="56" y="94" width="460" height="42" rx="8" class="built box"/>
  <text x="70" y="121" class="note">system prompt, if you set one</text>
  <rect x="56" y="146" width="460" height="42" rx="8" class="built box"/>
  <text x="70" y="173" class="note">the conversation so far: every message, whole</text>
  <rect x="56" y="198" width="460" height="42" rx="8" class="built box"/>
  <text x="70" y="225" class="note">anything pasted, counted in full</text>
  <rect x="56" y="250" width="460" height="42" rx="8" class="accent"/>
  <text x="70" y="277" class="note">the reply being written, token by token</text>
  <line x1="536" y1="94" x2="536" y2="292" stroke="#1E88A8" stroke-width="2"/>
  <text x="548" y="200" class="label" text-anchor="middle" transform="rotate(90 548 200)">1,048,576 tokens at most</text>

  <rect x="640" y="60" width="290" height="88" rx="8" class="outside"/>
  <text x="656" y="84" class="name">no memory between requests</text>
  <text x="656" y="106" class="note">Your browser re-sends the whole history</text>
  <text x="656" y="124" class="note">with every message; the model re-reads it.</text>
  <text x="656" y="142" class="note">Ask again later and it starts from nothing.</text>

  <rect x="640" y="164" width="290" height="88" rx="8" class="outside"/>
  <text x="656" y="188" class="name">four slots, four windows</text>
  <text x="656" y="210" class="note">Four replies run at once; each borrows a</text>
  <text x="656" y="228" class="note">slot and its own window, then gives it back.</text>
  <text x="656" y="246" class="note">They share one copy of the model weights.</text>

  <rect x="640" y="268" width="290" height="92" rx="8" class="outside"/>
  <text x="656" y="292" class="name">full is a wall, not a slowdown</text>
  <text x="656" y="314" class="note">A request longer than the window is refused;</text>
  <text x="656" y="332" class="note">start a new conversation, or the operator</text>
  <text x="656" y="350" class="note">changes CONTEXT (chapter Memory, context and slots).</text>

  <path class="flow" d="M640,360 L604,300" marker-end="url(#arrow)"/>
  <path class="flow" d="M640,104 L604,116" marker-end="url(#arrow)"/>
  <text x="40" y="392" class="num" text-anchor="start">A token is a piece of a word: about four characters of English, a little less for code.</text>
  <text x="40" y="416" class="warn" text-anchor="start">A one-megabyte log pasted in counts against the same window; the model reads it, but it is not filed away.</text>
</svg>
