<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" width="1040" height="460" role="img" aria-label="One reply&#x27;s window holds the system prompt, the whole conversation so far, anything pasted in, and the reply being written, up to 1,048,576 tokens. The model keeps nothing between requests, so the browser re-sends everything. The windows share one pool of memory: how many run at once is a setting, and a request longer than its window is refused.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1040" height="460" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Everything one reply may hold</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The window is the model&#x27;s whole view of the conversation.</text>
  <rect x="40" y="108" width="540" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="58" y="97" width="169.6" height="22" rx="11" fill="#1B2430"/>
  <text x="142.8" y="112.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ONE REPLY&#x27;S WINDOW</text>
  <rect x="64" y="134" width="492" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M76,134.7 H70 V181.3 H76 A11.3,11.3 0 0 1 64.7,170 V146 A11.3,11.3 0 0 1 76,134.7 Z" fill="#7F8EA0"/>
  <text x="84.0" y="163.0" class="name" text-anchor="start" xml:space="preserve">the system prompt, if any</text>
  <rect x="64" y="194" width="492" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M76,194.7 H70 V241.3 H76 A11.3,11.3 0 0 1 64.7,230 V206 A11.3,11.3 0 0 1 76,194.7 Z" fill="#2F6FDB"/>
  <text x="84.0" y="223.0" class="name" text-anchor="start" xml:space="preserve">the conversation so far</text>
  <rect x="64" y="254" width="492" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M76,254.7 H70 V301.3 H76 A11.3,11.3 0 0 1 64.7,290 V266 A11.3,11.3 0 0 1 76,254.7 Z" fill="#2F6FDB"/>
  <text x="84.0" y="283.0" class="name" text-anchor="start" xml:space="preserve">anything pasted in</text>
  <rect x="64" y="314" width="492" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M76,314.7 H70 V361.3 H76 A11.3,11.3 0 0 1 64.7,350 V326 A11.3,11.3 0 0 1 76,314.7 Z" fill="#2E8B3D"/>
  <text x="84.0" y="343.0" class="name" text-anchor="start" xml:space="preserve">the reply being written</text>
  <text x="310.0" y="392.0" class="note" text-anchor="middle" xml:space="preserve">1,048,576 tokens at most, per reply</text>
  <rect x="630" y="116" width="370" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M642,116.7 H636 V187.3 H642 A11.3,11.3 0 0 1 630.7,176 V128 A11.3,11.3 0 0 1 642,116.7 Z" fill="#7A4FD0"/>
  <text x="650.0" y="148.0" class="name" text-anchor="start" xml:space="preserve">No memory between requests</text>
  <text x="650.0" y="166.0" class="sub" text-anchor="start" xml:space="preserve">the browser re-sends everything</text>
  <rect x="630" y="208" width="370" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M642,208.7 H636 V279.3 H642 A11.3,11.3 0 0 1 630.7,268 V220 A11.3,11.3 0 0 1 642,208.7 Z" fill="#7A4FD0"/>
  <text x="650.0" y="240.0" class="name" text-anchor="start" xml:space="preserve">One pool of memory</text>
  <text x="650.0" y="258.0" class="sub" text-anchor="start" xml:space="preserve">how many at once is a setting</text>
  <rect x="630" y="300" width="370" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M642,300.7 H636 V371.3 H642 A11.3,11.3 0 0 1 630.7,360 V312 A11.3,11.3 0 0 1 642,300.7 Z" fill="#CF4526"/>
  <text x="650.0" y="332.0" class="name" text-anchor="start" xml:space="preserve">Full is a wall</text>
  <text x="650.0" y="350.0" class="sub" text-anchor="start" xml:space="preserve">a longer request is refused</text>
  <text x="40.0" y="440.0" class="note" text-anchor="start" xml:space="preserve">A token is a piece of a word: about four characters of English.</text>
</svg>
