<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="One reply's window holds the system prompt, the whole conversation so far, anything pasted in, and the reply being written, up to 1,048,576 tokens. The model keeps no memory between requests, so the browser re-sends everything. The windows share one pool of memory: how many run at once is a setting, and a request longer than its window is refused.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <rect width="960" height="410" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">Everything one reply may hold</text>

  <rect x="30" y="70" width="560" height="260" rx="14" class="zone"/>
  <text x="46" y="94" class="zonelabel">one reply's window</text>
  <rect x="52" y="108" width="516" height="44" rx="8" class="box built"/>
  <text x="310" y="136" class="note" text-anchor="middle">the system prompt, if any</text>
  <rect x="52" y="162" width="516" height="44" rx="8" class="box built"/>
  <text x="310" y="190" class="note" text-anchor="middle">the conversation so far</text>
  <rect x="52" y="216" width="516" height="44" rx="8" class="box built"/>
  <text x="310" y="244" class="note" text-anchor="middle">anything pasted in</text>
  <rect x="52" y="270" width="516" height="44" rx="8" class="box built"/>
  <text x="310" y="298" class="note" text-anchor="middle">the reply being written</text>
  <text x="310" y="352" class="label" text-anchor="middle">1,048,576 tokens at most, per reply</text>

  <rect x="620" y="70" width="310" height="78" rx="10" class="outside"/>
  <text x="775" y="100" class="name" text-anchor="middle">No memory between requests</text>
  <text x="775" y="122" class="note" text-anchor="middle">the browser re-sends everything</text>

  <rect x="620" y="168" width="310" height="78" rx="10" class="outside"/>
  <text x="775" y="198" class="name" text-anchor="middle">One pool of memory</text>
  <text x="775" y="220" class="note" text-anchor="middle">how many at once is a setting</text>

  <rect x="620" y="266" width="310" height="78" rx="10" class="outside"/>
  <text x="775" y="296" class="name" text-anchor="middle">Full is a wall</text>
  <text x="775" y="318" class="note" text-anchor="middle">a longer request is refused</text>

  <text x="30" y="392" class="note">A token is a piece of a word: about four characters of English.</text>
</svg>
