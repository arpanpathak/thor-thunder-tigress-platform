<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" width="1040" height="490" role="img" aria-label="Of the Thor&#x27;s 122.8 GiB, Nemotron 3 Nano Q8_0 with a one-million-token context takes 38.3, Nemotron 3.5 Bolt with a 262K context, its drafter and its vision projector 25.7, Qwen3.6 NVFP4 on TensorRT Edge-LLM with a 64K context 23.7, and Linux, page cache, the agent and SearXNG about 11.9, leaving 23.2 free. The load order is the Nano, then the Edge-LLM engine, then Bolt, because Bolt is the slowest to place and an engine started after it did not answer for ten minutes.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1040" height="490" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Three models in 122.8 GiB</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">All three fit with 23 GiB to spare, if they load in the right order.</text>
  <clipPath id="clip-40-130"><rect x="40" y="130" width="960" height="46" rx="6"/></clipPath>
  <g clip-path="url(#clip-40-130)" filter="url(#lift)">
  <rect x="40.0" y="130" width="299.4" height="46" fill="#5E9400"/>
  <text x="189.7" y="157.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">Nano · 38.3</text>
  <rect x="339.4" y="130" width="200.9" height="46" fill="#7A4FD0"/>
  <text x="439.9" y="157.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">Bolt · 25.7</text>
  <rect x="540.3" y="130" width="185.3" height="46" fill="#2F6FDB"/>
  <text x="633.0" y="157.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">Qwen3.6 · 23.7</text>
  <rect x="725.6" y="130" width="93.0" height="46" fill="#7F8EA0"/>
  <rect x="818.6" y="130" width="181.4" height="46" fill="#E3E7EC"/>
  </g>
  <rect x="40" y="130" width="960" height="46" rx="6" fill="none" stroke="#D5DBE3" stroke-width="1.2"/>
  <rect x="40" y="204" width="14" height="14" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="61.0" y="215.5" class="note" text-anchor="start" xml:space="preserve">Nemotron 3 Nano Q8_0, 1M context</text>
  <rect x="294.20000000000005" y="204" width="14" height="14" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="315.2" y="215.5" class="note" text-anchor="start" xml:space="preserve">Bolt, 262K context, drafter, vision</text>
  <rect x="568.2" y="204" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="589.2" y="215.5" class="note" text-anchor="start" xml:space="preserve">Qwen3.6 NVFP4, 64K context</text>
  <rect x="782.8000000000001" y="204" width="14" height="14" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="803.8" y="215.5" class="note" text-anchor="start" xml:space="preserve">Linux, page cache, agent</text>
  <text x="909.0" y="157.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">free · 23.2</text>
  <text x="40.0" y="244.0" class="note" text-anchor="start" xml:space="preserve">GiB of the Thor&#x27;s 122.8. Each model&#x27;s share is its GPU memory as nvidia-smi reports it, after one reply.</text>
  <rect x="40" y="286" width="300" height="116" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,286.7 H46 V401.3 H52 A11.3,11.3 0 0 1 40.7,390 V298 A11.3,11.3 0 0 1 52,286.7 Z" fill="#1F8A70"/>
  <rect x="56" y="328.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(62.0,334.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="98.0" y="331.0" class="name" text-anchor="start" xml:space="preserve">1. The Nano</text>
  <text x="98.0" y="349.0" class="sub" text-anchor="start" xml:space="preserve">llama-server loads its</text>
  <text x="98.0" y="367.0" class="sub" text-anchor="start" xml:space="preserve">default model as it starts</text>
  <rect x="370" y="286" width="300" height="116" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M382,286.7 H376 V401.3 H382 A11.3,11.3 0 0 1 370.7,390 V298 A11.3,11.3 0 0 1 382,286.7 Z" fill="#1F8A70"/>
  <rect x="386" y="328.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(392.0,334.0) scale(0.8333)"><path d="M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z" fill="#76B900" fill-rule="evenodd"/></g>
  <text x="428.0" y="322.0" class="name" text-anchor="start" xml:space="preserve">2. Qwen3.6 on Edge-LLM</text>
  <text x="428.0" y="340.0" class="sub" text-anchor="start" xml:space="preserve">starts after llama-server</text>
  <text x="428.0" y="358.0" class="sub" text-anchor="start" xml:space="preserve">and maps its engine while</text>
  <text x="428.0" y="376.0" class="sub" text-anchor="start" xml:space="preserve">memory is plentiful</text>
  <rect x="700" y="286" width="300" height="116" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M712,286.7 H706 V401.3 H712 A11.3,11.3 0 0 1 700.7,390 V298 A11.3,11.3 0 0 1 712,286.7 Z" fill="#CF4526"/>
  <rect x="716" y="328.0" width="32" height="32" rx="8" fill="#FCEBE6"/>
  <g transform="translate(722.0,334.0) scale(0.8333)"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2.4a7.6 7.6 0 1 0 0 15.2 7.6 7.6 0 0 0 0-15.2zM11 7h2v4.6l3.3 2-1 1.7-4.3-2.6z" fill="#CF4526" fill-rule="evenodd"/></g>
  <text x="758.0" y="322.0" class="name" text-anchor="start" xml:space="preserve">3. Bolt, last</text>
  <text x="758.0" y="340.0" class="sub" text-anchor="start" xml:space="preserve">loaded once the engine</text>
  <text x="758.0" y="358.0" class="sub" text-anchor="start" xml:space="preserve">answers: 17 s to over 6 min</text>
  <text x="758.0" y="376.0" class="sub" text-anchor="start" xml:space="preserve">when free pages are scarce</text>
  <path class="wire" d="M340,344 L370,344" marker-end="url(#head)"/>
  <path class="wire" d="M670,344 L700,344" marker-end="url(#head)"/>
  <text x="40.0" y="440.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">Started after Bolt, the engine spent ten minutes at 100% CPU in the kernel without answering; before Bolt, it answered in 37 to 40 s.</text>
  <text x="40.0" y="457.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">thor-model up and the thor-models-up unit load in this order at every boot.</text>
</svg>
