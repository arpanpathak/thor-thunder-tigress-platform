<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="A chapter with a title, an intro, section 13.1 containing a bash code block with the line &#x27;# not a heading&#x27;, and a Summary section. Cuts occur before 13.1 and before Summary, not inside the code block. Three examples result.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1000" height="470" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Chapter splitting: headings inside code blocks are text</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">One chapter becomes one example per heading.</text>
  <path d="M50,96 H422 L440,114 V356 A10,10 0 0 1 430,366 H50 A10,10 0 0 1 40,356 V106 A10,10 0 0 1 50,96 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M422,96 V114 H440 Z" fill="#FBF1DC" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="56" y="112" width="4" height="14" rx="2" fill="#B7791F"/>
  <text x="68.0" y="123.5" class="tab" text-anchor="start" style="fill:#B7791F" xml:space="preserve">CHAPTER MARKDOWN</text>
  <text x="56.0" y="152.0" class="mono strong" text-anchor="start" xml:space="preserve"># 13 An LRU cache</text>
  <text x="56.0" y="170.0" class="mono" text-anchor="start" xml:space="preserve">Intro text.</text>
  <text x="56.0" y="188.0" class="mono strong" text-anchor="start" xml:space="preserve">## 13.1 What an LRU cache does</text>
  <text x="56.0" y="206.0" class="mono" text-anchor="start" xml:space="preserve">It evicts.</text>
  <text x="56.0" y="224.0" class="mono dim" text-anchor="start" xml:space="preserve">```bash</text>
  <text x="56.0" y="242.0" class="mono trap" text-anchor="start" xml:space="preserve"># not a heading</text>
  <text x="56.0" y="260.0" class="mono dim" text-anchor="start" xml:space="preserve">```</text>
  <text x="56.0" y="278.0" class="mono strong" text-anchor="start" xml:space="preserve">## Summary</text>
  <text x="56.0" y="296.0" class="mono" text-anchor="start" xml:space="preserve">We built one.</text>
  <text x="56.0" y="350.0" class="note" text-anchor="start" style="fill:#B7791F" xml:space="preserve">Inside the fence a # line is text.</text>
  <rect x="47" y="141" width="4" height="33" rx="2" fill="#2E8B3D"/>
  <rect x="47" y="178" width="4" height="86" rx="2" fill="#2E8B3D"/>
  <rect x="47" y="268" width="4" height="32" rx="2" fill="#2E8B3D"/>
  <path d="M570,96 H942 L960,114 V178 A10,10 0 0 1 950,188 H570 A10,10 0 0 1 560,178 V106 A10,10 0 0 1 570,96 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M942,96 V114 H960 Z" fill="#E7F5E9" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="576" y="112" width="4" height="14" rx="2" fill="#2E8B3D"/>
  <text x="588.0" y="123.5" class="tab" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">EXAMPLE 1</text>
  <text x="576.0" y="152.0" class="mono" text-anchor="start" xml:space="preserve">Introduce &quot;An LRU cache&quot;.</text>
  <text x="576.0" y="170.0" class="mono dim" text-anchor="start" xml:space="preserve">response: Intro text.</text>
  <path d="M570,204 H942 L960,222 V322 A10,10 0 0 1 950,332 H570 A10,10 0 0 1 560,322 V214 A10,10 0 0 1 570,204 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M942,204 V222 H960 Z" fill="#E7F5E9" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="576" y="220" width="4" height="14" rx="2" fill="#2E8B3D"/>
  <text x="588.0" y="231.5" class="tab" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">EXAMPLE 2</text>
  <text x="576.0" y="260.0" class="mono" text-anchor="start" xml:space="preserve">Explain &quot;What an LRU cache does&quot;</text>
  <text x="576.0" y="278.0" class="mono" text-anchor="start" xml:space="preserve">from &quot;An LRU cache&quot;.</text>
  <text x="576.0" y="296.0" class="mono dim" text-anchor="start" xml:space="preserve">response: It evicts, plus the whole</text>
  <text x="576.0" y="314.0" class="mono dim" text-anchor="start" xml:space="preserve">code block, # line included</text>
  <path d="M570,348 H942 L960,366 V430 A10,10 0 0 1 950,440 H570 A10,10 0 0 1 560,430 V358 A10,10 0 0 1 570,348 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M942,348 V366 H960 Z" fill="#E7F5E9" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="576" y="364" width="4" height="14" rx="2" fill="#2E8B3D"/>
  <text x="588.0" y="375.5" class="tab" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">EXAMPLE 3</text>
  <text x="576.0" y="404.0" class="mono" text-anchor="start" xml:space="preserve">Explain &quot;Summary&quot; from &quot;An LRU cache&quot;.</text>
  <text x="576.0" y="422.0" class="mono dim" text-anchor="start" xml:space="preserve">response: We built one.</text>
  <path class="wire" d="M440,157 L491,157 Q500,157 500.0,149.5 L500.0,149.5 Q500,142 509,142 L560,142" marker-end="url(#head)"/>
  <path class="wire" d="M440,222 L491,222 Q500,222 500,231 L500,259 Q500,268 509,268 L560,268" marker-end="url(#head)"/>
  <path class="wire" d="M440,287 L471,287 Q480,287 480,296 L480,385 Q480,394 489,394 L560,394" marker-end="url(#head)"/>
  <text x="40.0" y="400.0" class="note" text-anchor="start" xml:space="preserve">Each green bar on the left is one section, cut at its heading.</text>
  <text x="40.0" y="417.0" class="note" text-anchor="start" xml:space="preserve">Section numbers such as 13.1 are stripped from headings.</text>
  <text x="40.0" y="434.0" class="note" text-anchor="start" xml:space="preserve">A section over 12,000 characters is cut again at ###.</text>
</svg>
