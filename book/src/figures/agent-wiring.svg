  <path class="wire" d="M290,326 L350,326" marker-end="url(#head)"/>
  <path class="wire" d="M570,326 L603,326 Q612,326 612,317 L612,185 Q612,176 621,176 L654,176" marker-end="url(#head)"/>
  <path class="wire" d="M825,208 L825,276" marker-end="url(#head)"/>
</svg>
