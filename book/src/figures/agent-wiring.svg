<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 420" width="1044" height="420" role="img" aria-label="Agents call the .ts.net address through Tailscale Funnel with the key in a header; thor-tigress-agent checks it and passes requests to llama-server. A machine with SSH access reaches the same server through an SSH tunnel.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1044" height="420" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">How agents reach the Thor</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Two ways in, and both arrive at the same door: the agent on port 8080.</text>
  <rect x="40" y="120" width="250" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,120.7 H46 V199.3 H52 A11.3,11.3 0 0 1 40.7,188 V132 A11.3,11.3 0 0 1 52,120.7 Z" fill="#2F6FDB"/>
  <rect x="56" y="144.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(62.0,150.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="98.0" y="147.0" class="name" text-anchor="start" xml:space="preserve">Your agent</text>
  <text x="98.0" y="165.0" class="sub" text-anchor="start" xml:space="preserve">openbatrangs, Claude Code,</text>
  <text x="98.0" y="183.0" class="sub" text-anchor="start" xml:space="preserve">OpenCode, Python, curl</text>
  <rect x="350" y="120" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M362,120.7 H356 V199.3 H362 A11.3,11.3 0 0 1 350.7,188 V132 A11.3,11.3 0 0 1 362,120.7 Z" fill="#7A4FD0"/>
  <rect x="366" y="144.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(372.0,150.0) scale(0.8333)"><path d="M24 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm-9 9a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm0-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm6-6a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM3 24a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm18 .5a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM6 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm9-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm-3 2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM6 3a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM3 5.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z" fill="#242424" fill-rule="evenodd"/></g>
  <text x="408.0" y="147.0" class="name" text-anchor="start" xml:space="preserve">Tailscale Funnel</text>
  <text x="408.0" y="165.0" class="sub" text-anchor="start" xml:space="preserve">https://…ts.net</text>
  <text x="408.0" y="183.0" class="sub" text-anchor="start" xml:space="preserve">key in a header</text>
  <rect x="630" y="96" width="390" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="648" y="85" width="146.0" height="22" rx="11" fill="#1B2430"/>
  <text x="721.0" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">JETSON AGX THOR</text>
  <rect x="654" y="112" width="342" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M666,112.7 H660 V207.3 H666 A11.3,11.3 0 0 1 654.7,196 V124 A11.3,11.3 0 0 1 666,112.7 Z" fill="#1F8A70"/>
  <rect x="670" y="144.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(676.0,150.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="712.0" y="138.0" class="name" text-anchor="start" xml:space="preserve">thor-tigress-agent</text>
  <text x="712.0" y="156.0" class="sub" text-anchor="start" xml:space="preserve">:8080 checks the key;</text>
  <text x="712.0" y="174.0" class="sub" text-anchor="start" xml:space="preserve">/v1/messages: thinking</text>
  <text x="712.0" y="192.0" class="sub" text-anchor="start" xml:space="preserve">off unless asked</text>
  <rect x="654" y="276" width="342" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M666,276.7 H660 V371.3 H666 A11.3,11.3 0 0 1 654.7,360 V288 A11.3,11.3 0 0 1 666,276.7 Z" fill="#1F8A70"/>
  <rect x="670" y="308.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(676.0,314.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="712.0" y="302.0" class="name" text-anchor="start" xml:space="preserve">llama-server</text>
  <text x="712.0" y="320.0" class="sub" text-anchor="start" xml:space="preserve">:8079</text>
  <text x="712.0" y="338.0" class="sub" text-anchor="start" xml:space="preserve">OpenAI and</text>
  <text x="712.0" y="356.0" class="sub" text-anchor="start" xml:space="preserve">Anthropic APIs</text>
  <rect x="40" y="286" width="250" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,286.7 H46 V365.3 H52 A11.3,11.3 0 0 1 40.7,354 V298 A11.3,11.3 0 0 1 52,286.7 Z" fill="#2F6FDB"/>
  <rect x="56" y="310.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(62.0,316.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="98.0" y="313.0" class="name" text-anchor="start" xml:space="preserve">Your machine</text>
  <text x="98.0" y="331.0" class="sub" text-anchor="start" xml:space="preserve">with SSH access</text>
  <text x="98.0" y="349.0" class="sub" text-anchor="start" xml:space="preserve">to the Thor</text>
  <rect x="350" y="286" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M362,286.7 H356 V365.3 H362 A11.3,11.3 0 0 1 350.7,354 V298 A11.3,11.3 0 0 1 362,286.7 Z" fill="#7F8EA0"/>
  <text x="370.0" y="313.0" class="name" text-anchor="start" xml:space="preserve">SSH tunnel</text>
  <text x="370.0" y="331.0" class="sub" text-anchor="start" xml:space="preserve">127.0.0.1:8080</text>
  <text x="370.0" y="349.0" class="sub" text-anchor="start" xml:space="preserve">no public hop</text>
  <path class="wire" d="M290,160 L350,160" marker-end="url(#head)"/>
