<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 462" width="1060" height="462" role="img" aria-label="Five planned steps: QLoRA, merge, quantize, build engine, serve, each producing one artifact. A diagnosis path compares the merged model with the quantized model.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1060" height="462" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Stage 2 steps and artifacts (planned)</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each step, top, leaves one artifact, bottom. None of this is built yet.</text>
  <rect x="40" y="104" width="176" height="96" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M52,104.7 H46 V199.3 H52 A11.3,11.3 0 0 1 40.7,188 V116 A11.3,11.3 0 0 1 52,104.7 Z" fill="#B7791F"/>
  <text x="60.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">1. QLoRA</text>
  <text x="60.0" y="148.0" class="sub" text-anchor="start" xml:space="preserve">base frozen in 4 bit,</text>
  <text x="60.0" y="166.0" class="sub" text-anchor="start" xml:space="preserve">small adapters train</text>
  <text x="60.0" y="184.0" class="sub" text-anchor="start" xml:space="preserve">in 16 bit</text>
  <path d="M40,265 A88.0,9 0 0 1 216,265 V319 A88.0,9 0 0 1 40,319 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="128.0" cy="265" rx="88.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="128.0" y="295.0" class="name" text-anchor="middle" xml:space="preserve">adapter weights</text>
  <text x="128.0" y="313.0" class="sub" text-anchor="middle" xml:space="preserve">tens of MB</text>
  <path class="wire idle" d="M128,200 L128,256" marker-end="url(#head-idle)"/>
  <rect x="246" y="104" width="176" height="96" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M258,104.7 H252 V199.3 H258 A11.3,11.3 0 0 1 246.7,188 V116 A11.3,11.3 0 0 1 258,104.7 Z" fill="#B7791F"/>
  <text x="266.0" y="139.0" class="name" text-anchor="start" xml:space="preserve">2. Merge</text>
  <text x="266.0" y="157.0" class="sub" text-anchor="start" xml:space="preserve">adapters folded into</text>
  <text x="266.0" y="175.0" class="sub" text-anchor="start" xml:space="preserve">full-precision base</text>
  <path d="M246,265 A88.0,9 0 0 1 422,265 V319 A88.0,9 0 0 1 246,319 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="334.0" cy="265" rx="88.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="334.0" y="295.0" class="name" text-anchor="middle" xml:space="preserve">merged model</text>
  <text x="334.0" y="313.0" class="sub" text-anchor="middle" xml:space="preserve">16 bit, 9B ≈ 18 GB</text>
  <path class="wire idle" d="M334,200 L334,256" marker-end="url(#head-idle)"/>
  <path class="wire idle" d="M216,152 L246,152" marker-end="url(#head-idle)"/>
  <rect x="452" y="104" width="176" height="96" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M464,104.7 H458 V199.3 H464 A11.3,11.3 0 0 1 452.7,188 V116 A11.3,11.3 0 0 1 464,104.7 Z" fill="#B7791F"/>
  <text x="472.0" y="139.0" class="name" text-anchor="start" xml:space="preserve">3. Quantize</text>
  <text x="472.0" y="157.0" class="sub" text-anchor="start" xml:space="preserve">same mode for base</text>
  <text x="472.0" y="175.0" class="sub" text-anchor="start" xml:space="preserve">and fine-tuned</text>
  <path d="M452,265 A88.0,9 0 0 1 628,265 V319 A88.0,9 0 0 1 452,319 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="540.0" cy="265" rx="88.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="540.0" y="295.0" class="name" text-anchor="middle" xml:space="preserve">quantized model</text>
  <text x="540.0" y="313.0" class="sub" text-anchor="middle" xml:space="preserve">smaller, faster</text>
  <path class="wire idle" d="M540,200 L540,256" marker-end="url(#head-idle)"/>
  <path class="wire idle" d="M422,152 L452,152" marker-end="url(#head-idle)"/>
  <rect x="658" y="104" width="176" height="96" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M670,104.7 H664 V199.3 H670 A11.3,11.3 0 0 1 658.7,188 V116 A11.3,11.3 0 0 1 670,104.7 Z" fill="#B7791F"/>
  <text x="678.0" y="139.0" class="name" text-anchor="start" xml:space="preserve">4. Build engine</text>
  <text x="678.0" y="157.0" class="sub" text-anchor="start" xml:space="preserve">TensorRT-LLM</text>
  <text x="678.0" y="175.0" class="sub" text-anchor="start" xml:space="preserve">for sm_110</text>
  <path d="M658,265 A88.0,9 0 0 1 834,265 V319 A88.0,9 0 0 1 658,319 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="746.0" cy="265" rx="88.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="746.0" y="295.0" class="name" text-anchor="middle" xml:space="preserve">engine files</text>
  <text x="746.0" y="313.0" class="sub" text-anchor="middle" xml:space="preserve">tied to this GPU</text>
  <path class="wire idle" d="M746,200 L746,256" marker-end="url(#head-idle)"/>
  <path class="wire idle" d="M628,152 L658,152" marker-end="url(#head-idle)"/>
  <rect x="864" y="104" width="176" height="96" rx="12" fill="#FBF1DC" stroke="#B7791F" stroke-dasharray="6 5" stroke-width="1.3"/>
  <path d="M876,104.7 H870 V199.3 H876 A11.3,11.3 0 0 1 864.7,188 V116 A11.3,11.3 0 0 1 876,104.7 Z" fill="#B7791F"/>
  <text x="884.0" y="139.0" class="name" text-anchor="start" xml:space="preserve">5. Serve</text>
  <text x="884.0" y="157.0" class="sub" text-anchor="start" xml:space="preserve">trtllm-serve</text>
  <text x="884.0" y="175.0" class="sub" text-anchor="start" xml:space="preserve">HTTP, localhost</text>
  <path d="M864,265 A88.0,9 0 0 1 1040,265 V319 A88.0,9 0 0 1 864,319 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="952.0" cy="265" rx="88.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="952.0" y="295.0" class="name" text-anchor="middle" xml:space="preserve">endpoint</text>
  <text x="952.0" y="313.0" class="sub" text-anchor="middle" xml:space="preserve">/v1/chat/completions</text>
  <path class="wire idle" d="M952,200 L952,256" marker-end="url(#head-idle)"/>
  <path class="wire idle" d="M834,152 L864,152" marker-end="url(#head-idle)"/>
  <path class="wire danger" d="M334,328 L334,357 Q334,366 343,366 L531,366 Q540,366 540,357 L540,328" marker-end="url(#head-danger)"/>
  <rect x="373.9" y="357.0" width="126.2" height="18" rx="9" fill="#FBFAF6" stroke="#CF4526" stroke-width="1"/>
  <text x="437.0" y="369.8" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">compare these two</text>
  <text x="40.0" y="404.0" class="note" text-anchor="start" xml:space="preserve">Diagnosis: compare the merged model with the quantized model before changing data or training settings.</text>
  <text x="40.0" y="421.0" class="note" text-anchor="start" xml:space="preserve">Every reported result records the build command, quantization mode, maximum sequence length, batch size,</text>
  <text x="40.0" y="438.0" class="note" text-anchor="start" xml:space="preserve">tokens per second and peak memory. An unsupported mode on sm_110 stops the run.</text>
</svg>
