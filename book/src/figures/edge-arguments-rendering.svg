<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 582" width="1000" height="582" role="img" aria-label="An assistant message with a tool call whose arguments are JSON text is rendered by the engine&#x27;s chat template as a write_file call with no parameters, 471 prompt tokens, and Qwen says it called write_file without the required path and content. The same message with the arguments as an object is rendered with both parameters, 518 prompt tokens, and Qwen reads the result correctly.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1000" height="582" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">One earlier tool call, as a string and as an object</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Measured on Nemotron 3.5 Lightning for the token counts; the words are Qwen&#x27;s.</text>
  <path d="M50,96 H462 L480,114 V286 A10,10 0 0 1 470,296 H50 A10,10 0 0 1 40,286 V106 A10,10 0 0 1 50,96 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M462,96 V114 H480 Z" fill="#EAF1FD" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="56" y="112" width="4" height="14" rx="2" fill="#2F6FDB"/>
  <text x="68.0" y="123.5" class="tab" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">WHAT A CODING TOOL SENDS BACK</text>
  <text x="56.0" y="152.0" class="mono" text-anchor="start" xml:space="preserve">{ &quot;role&quot;: &quot;assistant&quot;, &quot;tool_calls&quot;: [ {</text>
  <text x="56.0" y="170.0" class="mono" text-anchor="start" xml:space="preserve">    &quot;id&quot;: &quot;call_1&quot;, &quot;type&quot;: &quot;function&quot;,</text>
  <text x="56.0" y="188.0" class="mono" text-anchor="start" xml:space="preserve">    &quot;function&quot;: {</text>
  <text x="56.0" y="206.0" class="mono" text-anchor="start" xml:space="preserve">      &quot;name&quot;: &quot;write_file&quot;,</text>
  <text x="56.0" y="224.0" class="mono" text-anchor="start" xml:space="preserve">      &quot;arguments&quot;: &quot;{\&quot;path\&quot;: \&quot;fizz.py\&quot;, …}&quot;</text>
  <text x="56.0" y="242.0" class="mono" text-anchor="start" xml:space="preserve">    } } ] }</text>
  <text x="56.0" y="280.0" class="note" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">Arguments as JSON text: the OpenAI format.</text>
  <path class="wire danger" d="M480,196 L560,196" marker-end="url(#head-danger)"/>
  <path d="M570,96 H942 L960,114 V286 A10,10 0 0 1 950,296 H570 A10,10 0 0 1 560,286 V106 A10,10 0 0 1 570,96 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M942,96 V114 H960 Z" fill="#FCEBE6" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="576" y="112" width="4" height="14" rx="2" fill="#CF4526"/>
  <text x="588.0" y="123.5" class="tab" text-anchor="start" style="fill:#CF4526" xml:space="preserve">WHAT THE MODEL READS · 471 PROMPT TOKENS</text>
  <text x="576.0" y="152.0" class="mono" text-anchor="start" xml:space="preserve">&lt;tool_call&gt;</text>
  <text x="576.0" y="170.0" class="mono" text-anchor="start" xml:space="preserve">&lt;function=write_file&gt;</text>
  <text x="576.0" y="188.0" class="mono dim" text-anchor="start" xml:space="preserve">    (no parameters)</text>
  <text x="576.0" y="206.0" class="mono" text-anchor="start" xml:space="preserve">&lt;/function&gt;</text>
  <text x="576.0" y="224.0" class="mono" text-anchor="start" xml:space="preserve">&lt;/tool_call&gt;</text>
  <text x="576.0" y="263.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">Qwen: “I called write_file without providing</text>
  <text x="576.0" y="280.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">the required path and content parameters”</text>
  <path d="M50,330 H462 L480,348 V520 A10,10 0 0 1 470,530 H50 A10,10 0 0 1 40,520 V340 A10,10 0 0 1 50,330 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M462,330 V348 H480 Z" fill="#E4F4EF" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="56" y="346" width="4" height="14" rx="2" fill="#1F8A70"/>
  <text x="68.0" y="357.5" class="tab" text-anchor="start" style="fill:#1F8A70" xml:space="preserve">WHAT THE AGENT NOW SENDS</text>
  <text x="56.0" y="386.0" class="mono" text-anchor="start" xml:space="preserve">{ &quot;role&quot;: &quot;assistant&quot;, &quot;tool_calls&quot;: [ {</text>
  <text x="56.0" y="404.0" class="mono" text-anchor="start" xml:space="preserve">    &quot;id&quot;: &quot;call_1&quot;, &quot;type&quot;: &quot;function&quot;,</text>
  <text x="56.0" y="422.0" class="mono" text-anchor="start" xml:space="preserve">    &quot;function&quot;: {</text>
  <text x="56.0" y="440.0" class="mono" text-anchor="start" xml:space="preserve">      &quot;name&quot;: &quot;write_file&quot;,</text>
  <text x="56.0" y="458.0" class="mono" text-anchor="start" xml:space="preserve">      &quot;arguments&quot;: { &quot;path&quot;: &quot;fizz.py&quot;, … }</text>
  <text x="56.0" y="476.0" class="mono" text-anchor="start" xml:space="preserve">    } } ] }</text>
  <text x="56.0" y="514.0" class="note" text-anchor="start" style="fill:#1F8A70" xml:space="preserve">The same call. One value changed type.</text>
  <path class="wire" d="M480,430 L560,430" marker-end="url(#head)"/>
  <path d="M570,330 H942 L960,348 V520 A10,10 0 0 1 950,530 H570 A10,10 0 0 1 560,520 V340 A10,10 0 0 1 570,330 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M942,330 V348 H960 Z" fill="#E7F5E9" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="576" y="346" width="4" height="14" rx="2" fill="#2E8B3D"/>
  <text x="588.0" y="357.5" class="tab" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">WHAT THE MODEL READS · 518 PROMPT TOKENS</text>
  <text x="576.0" y="386.0" class="mono" text-anchor="start" xml:space="preserve">&lt;tool_call&gt;</text>
  <text x="576.0" y="404.0" class="mono" text-anchor="start" xml:space="preserve">&lt;function=write_file&gt;</text>
  <text x="576.0" y="422.0" class="mono" text-anchor="start" xml:space="preserve">&lt;parameter=path&gt;fizz.py&lt;/parameter&gt;</text>
  <text x="576.0" y="440.0" class="mono" text-anchor="start" xml:space="preserve">&lt;parameter=content&gt;…&lt;/parameter&gt;</text>
  <text x="576.0" y="458.0" class="mono" text-anchor="start" xml:space="preserve">&lt;/function&gt;&lt;/tool_call&gt;</text>
  <text x="576.0" y="497.0" class="note" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">Qwen: “The test ran successfully with exit</text>
  <text x="576.0" y="514.0" class="note" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">code 0.”</text>
  <text x="40.0" y="560.0" class="note" text-anchor="start" xml:space="preserve">The text on the right is inferred from the token counts and the replies. The engine does not return the prompt it built.</text>
</svg>
