<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 604" width="1040" height="604" role="img" aria-label="Prompt tokens go through a token embedding of 2,560 numbers. An n-gram table of 20 million bigrams and trigrams, 51 billion parameters, joins at layer 2. The 48 layers are one block repeated 12 times: three Gated DeltaNet layers, which are linear attention with a fixed-size state, then one Qwen Sparse Attention layer, which attends over 2,048 chosen tokens. Every mixer is followed by a mixture of experts that runs 10 of 512 experts plus one shared expert. After the last block the language-model head gives the next token and the MTP layer drafts three more, which are checked in one pass.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
