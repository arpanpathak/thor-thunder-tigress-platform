<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" role="img" aria-label="Browsers and agents send a personal key as Authorization: Bearer over HTTPS through Tailscale Funnel. thor-tigress-agent compares it, in constant time, with the active keys in the encrypted keyring and with the operator&#x27;s single key, and answers 401 when it is wrong. A match is forwarded to llama-server with the agent&#x27;s own key, which checks again.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1040" height="480" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">How a personal key is checked</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Two checks, two keys: yours at the agent, the agent&#x27;s at the model server.</text>
  <rect x="40" y="120" width="260" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,120.7 H46 V199.3 H52 A11.3,11.3 0 0 1 40.7,188 V132 A11.3,11.3 0 0 1 52,120.7 Z" fill="#2F6FDB"/>
  <rect x="56" y="144.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(62.0,150.0) scale(0.8333)"><path d="M14.5 2a7.5 7.5 0 0 0-7.2 9.6L2 16.9V22h5.1v-2.5h2.5V17h2.4l1-1a7.5 7.5 0 1 0 1.5-14zm2.2 4.3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="98.0" y="147.0" class="name" text-anchor="start" xml:space="preserve">Browser and agents</text>
  <text x="98.0" y="165.0" class="sub" text-anchor="start" xml:space="preserve">a personal key in a header</text>
  <text x="98.0" y="183.0" class="sub" text-anchor="start" xml:space="preserve">Authorization: Bearer</text>
  <rect x="40" y="260" width="260" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,260.7 H46 V339.3 H52 A11.3,11.3 0 0 1 40.7,328 V272 A11.3,11.3 0 0 1 52,260.7 Z" fill="#7A4FD0"/>
  <rect x="56" y="284.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(62.0,290.0) scale(0.8333)"><path d="M24 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm-9 9a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm0-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm6-6a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM3 24a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm18 .5a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM6 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm9-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm-3 2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM6 3a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM3 5.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z" fill="#242424" fill-rule="evenodd"/></g>
  <text x="98.0" y="287.0" class="name" text-anchor="start" xml:space="preserve">Tailscale Funnel</text>
  <text x="98.0" y="305.0" class="sub" text-anchor="start" xml:space="preserve">HTTPS, so the header</text>
  <text x="98.0" y="323.0" class="sub" text-anchor="start" xml:space="preserve">is encrypted in transit</text>
  <path class="wire" d="M170,200 L170,260" marker-end="url(#head)"/>
  <rect x="350" y="100" width="666" height="356" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="368" y="89" width="146.0" height="22" rx="11" fill="#1B2430"/>
  <text x="441.0" y="104.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">JETSON AGX THOR</text>
  <path d="M380,139 A150.0,9 0 0 1 680,139 V201 A150.0,9 0 0 1 380,201 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="530.0" cy="139" rx="150.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="530.0" y="173.0" class="name" text-anchor="middle" xml:space="preserve">~/.config/thor-chat/keyring</text>
  <text x="530.0" y="191.0" class="sub" text-anchor="middle" xml:space="preserve">the active keys, re-read on change</text>
  <path d="M710,139 A145.0,9 0 0 1 1000,139 V201 A145.0,9 0 0 1 710,201 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="855.0" cy="139" rx="145.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="855.0" y="173.0" class="name" text-anchor="middle" xml:space="preserve">~/.config/thor-chat/api-key</text>
  <text x="855.0" y="191.0" class="sub" text-anchor="middle" xml:space="preserve">the key the agent forwards with</text>
  <rect x="400" y="260" width="260" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M412,260.7 H406 V339.3 H412 A11.3,11.3 0 0 1 400.7,328 V272 A11.3,11.3 0 0 1 412,260.7 Z" fill="#1F8A70"/>
  <rect x="416" y="284.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(422.0,290.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="458.0" y="287.0" class="name" text-anchor="start" xml:space="preserve">thor-tigress-agent</text>
  <text x="458.0" y="305.0" class="sub" text-anchor="start" xml:space="preserve">compares each key</text>
  <text x="458.0" y="323.0" class="sub" text-anchor="start" xml:space="preserve">in constant time</text>
  <rect x="740" y="252" width="250" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M752,252.7 H746 V347.3 H752 A11.3,11.3 0 0 1 740.7,336 V264 A11.3,11.3 0 0 1 752,252.7 Z" fill="#1F8A70"/>
  <rect x="756" y="284.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(762.0,290.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="798.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">llama-server</text>
  <text x="798.0" y="296.0" class="sub" text-anchor="start" xml:space="preserve">checks the one</text>
  <text x="798.0" y="314.0" class="sub" text-anchor="start" xml:space="preserve">service key</text>
  <text x="798.0" y="332.0" class="sub" text-anchor="start" xml:space="preserve">:8079 or :8081</text>
  <path class="wire" d="M300,300 L400,300" marker-end="url(#head)"/>
  <path class="wire" d="M660,300 L740,300" marker-end="url(#head)"/>
  <path class="wire idle" d="M530,210 L530,260" marker-end="url(#head-idle)"/>
  <path class="wire idle" d="M865,210 L865,252" marker-end="url(#head-idle)"/>
  <text x="400.0" y="366.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">no match: 401</text>
  <text x="740.0" y="374.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">a key with no match: 401</text>
  <text x="380.0" y="412.0" class="note" text-anchor="start" xml:space="preserve">A key that matches is forwarded with the agent&#x27;s own key,</text>
  <text x="380.0" y="429.0" class="note" text-anchor="start" xml:space="preserve">and llama-server checks that one again.</text>
</svg>
