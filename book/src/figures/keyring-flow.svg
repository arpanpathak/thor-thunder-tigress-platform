<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="A browser or an agent sends a personal key in a header over HTTPS through Tailscale Funnel. On the Thor, thor-tigress-agent compares it with the active keys in the sealed keyring, in constant time, and forwards the request to llama-server with the service key from api-key, which llama-server checks again. No key, or a revoked one, gets 401 before the model is reached.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
    <marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D9542B"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">How a personal key is checked</text>

  <rect x="30" y="170" width="220" height="100" rx="10" class="outside"/>
  <text x="140" y="204" class="name" text-anchor="middle">Browser and agents</text>
  <text x="140" y="228" class="note" text-anchor="middle">a personal key in a header</text>

  <rect x="300" y="170" width="180" height="100" rx="10" class="outside"/>
  <text x="390" y="204" class="name" text-anchor="middle">Tailscale Funnel</text>
  <text x="390" y="228" class="note" text-anchor="middle">HTTPS, so the header</text>
  <text x="390" y="246" class="note" text-anchor="middle">is encrypted in transit</text>

  <path class="flow" d="M250,220 L288,220" marker-end="url(#arrow)"/>

  <rect x="520" y="70" width="410" height="310" rx="14" class="zone"/>
  <text x="534" y="92" class="zonelabel">Jetson AGX Thor</text>

  <rect x="540" y="102" width="370" height="76" rx="10" class="box built"/>
  <text x="725" y="130" class="note mono" text-anchor="middle">~/.config/thor-chat/keyring</text>
  <text x="725" y="152" class="note" text-anchor="middle">the active keys, re-read on change</text>

  <rect x="540" y="200" width="200" height="90" rx="10" class="box built"/>
  <text x="640" y="232" class="name" text-anchor="middle">thor-tigress-agent</text>
  <text x="640" y="256" class="note" text-anchor="middle">compares each key</text>
  <text x="640" y="274" class="note" text-anchor="middle">in constant time</text>

  <rect x="780" y="200" width="150" height="90" rx="10" class="box built"/>
  <text x="855" y="232" class="name" text-anchor="middle">llama-server</text>
  <text x="855" y="256" class="note" text-anchor="middle">checks the one</text>
  <text x="855" y="274" class="note" text-anchor="middle">service key</text>

  <rect x="540" y="310" width="370" height="60" rx="10" class="box built"/>
  <text x="725" y="336" class="note mono" text-anchor="middle">~/.config/thor-chat/api-key</text>
  <text x="725" y="356" class="note" text-anchor="middle">the key the agent forwards with</text>

  <path class="flow" d="M480,220 L528,220" marker-end="url(#arrow)"/>
  <path class="flow" d="M725,178 L725,198" marker-end="url(#arrow)"/>
  <path class="flow" d="M740,245 L768,245" marker-end="url(#arrow)"/>
  <path class="flow" d="M620,310 L620,292" marker-end="url(#arrow)"/>

  <path class="deny" d="M528,404 L140,404 L140,272" marker-end="url(#arrow-deny)"/>
  <text x="330" y="376" class="warn" text-anchor="middle">no key, or a revoked one: 401 before the model is reached</text>
</svg>
