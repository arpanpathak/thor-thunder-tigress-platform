<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 556" width="1080" height="556" role="img" aria-label="Three sources feed thor-hammer-trainer, which writes train.jsonl. train.jsonl feeds the review page and the planned chain: QLoRA training, merge and quantize, TensorRT-LLM engine, trtllm-serve. trtllm-serve feeds the planned human evaluation, whose verdicts feed the next data round.">
