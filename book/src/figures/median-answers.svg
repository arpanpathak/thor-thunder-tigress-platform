<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-label="One bar per Nemotron answer, height is tokens. Eight of thirteen answers use unwrap, seven of them while saying they do not. Only answer 13, a copy of the user's own code, compiles.">
  <style>
