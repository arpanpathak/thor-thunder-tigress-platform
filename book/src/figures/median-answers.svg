<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 526" width="1020" height="526" role="img" aria-label="One bar per Nemotron answer, height is tokens. Eight of thirteen answers use unwrap, seven of them while saying they do not. Only answer 13, a copy of the user&#x27;s own code, compiles.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
