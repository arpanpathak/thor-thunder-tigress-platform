<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="The keyring file: a 15-byte magic line, a 16-byte random salt, a 24-byte nonce, then the records sealed as ciphertext with a 16-byte tag. Inside the sealed part is one JSON line per person: name, email, status and key. A wrong passphrase and a changed byte fail the same way.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <rect width="960" height="380" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">The keyring file, byte by byte</text>
  <text x="30" y="62" class="note">Only the last part is a secret.</text>

  <rect x="30" y="96" width="180" height="76" rx="10" class="box built"/>
  <text x="120" y="124" class="mono name" text-anchor="middle">thor-keyring-1</text>
  <text x="120" y="146" class="note" text-anchor="middle">magic, 15 bytes</text>

  <rect x="220" y="96" width="150" height="76" rx="10" class="box built"/>
  <text x="295" y="124" class="name" text-anchor="middle">salt</text>
  <text x="295" y="146" class="note" text-anchor="middle">16 random bytes</text>
  <text x="295" y="164" class="note" text-anchor="middle">stored, not secret</text>

  <rect x="380" y="96" width="160" height="76" rx="10" class="box built"/>
  <text x="460" y="124" class="name" text-anchor="middle">nonce</text>
  <text x="460" y="146" class="note" text-anchor="middle">24 bytes</text>
  <text x="460" y="164" class="note" text-anchor="middle">fresh each write</text>

  <rect x="550" y="96" width="380" height="76" rx="10" class="box built"/>
  <text x="740" y="124" class="name" text-anchor="middle">the records, sealed</text>
  <text x="740" y="146" class="note" text-anchor="middle">ciphertext, then a 16-byte tag</text>

  <line x1="30" y1="196" x2="930" y2="196" stroke="#D5DCE4" stroke-width="1"/>

  <rect x="30" y="216" width="420" height="110" rx="10" class="outside"/>
  <text x="240" y="244" class="name" text-anchor="middle">Each part has a job</text>
  <text x="240" y="266" class="note" text-anchor="middle">magic: refuses another version</text>
  <text x="240" y="284" class="note" text-anchor="middle">salt: a different key per file</text>
  <text x="240" y="302" class="note" text-anchor="middle">nonce: never reused</text>

  <rect x="480" y="216" width="450" height="110" rx="10" class="box built"/>
  <text x="705" y="244" class="name" text-anchor="middle">Inside: one line per person</text>
  <text x="705" y="270" class="note mono" text-anchor="middle">{"name":"Ada Lovelace",</text>
  <text x="705" y="290" class="note mono" text-anchor="middle"> "status":"active","key":"5397…"}</text>

  <text x="30" y="356" class="warn">A wrong passphrase and a changed byte fail the same way.</text>
</svg>
