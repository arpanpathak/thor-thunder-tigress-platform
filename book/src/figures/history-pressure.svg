  <rect width="1084" height="486" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Why the cub kept repeating itself</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">By answer 12 the conversation held far more unwrap() than requests to avoid it.</text>
  <rect x="24" y="112" width="468" height="350" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="42" y="101" width="224.6" height="22" rx="11" fill="#1B2430"/>
  <text x="154.3" y="116.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">THE REQUEST FOR ANSWER 12</text>
  <rect x="48" y="140" width="420" height="42" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,140.7 H54 V181.3 H60 A11.3,11.3 0 0 1 48.7,170 V152 A11.3,11.3 0 0 1 60,140.7 Z" fill="#2F6FDB"/>
