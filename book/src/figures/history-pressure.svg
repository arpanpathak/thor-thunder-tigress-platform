  <rect x="576" y="182.0" width="32" height="32" rx="8" fill="#EEF6DC"/>
  <g transform="translate(582.0,188.0) scale(0.8333)"><path d="M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z" fill="#76B900" fill-rule="evenodd"/></g>
  <text x="618.0" y="185.0" class="name" text-anchor="start" xml:space="preserve">Nemotron 3 Nano</text>
  <text x="618.0" y="203.0" class="sub" text-anchor="start" xml:space="preserve">30B weights, 3B active</text>
  <text x="618.0" y="221.0" class="sub" text-anchor="start" xml:space="preserve">per token, temperature 1.0</text>
  <rect x="560" y="330" width="260" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M572,330.7 H566 V425.3 H572 A11.3,11.3 0 0 1 560.7,414 V342 A11.3,11.3 0 0 1 572,330.7 Z" fill="#CF4526"/>
  <text x="580.0" y="365.0" class="name" text-anchor="start" xml:space="preserve">Answer 12</text>
  <text x="580.0" y="383.0" class="sub" text-anchor="start" xml:space="preserve">your code, rewritten, with</text>
  <text x="580.0" y="401.0" class="sub" text-anchor="start" xml:space="preserve">min_high.unwrap() back in it</text>
  <rect x="880" y="142" width="180" height="112" rx="12" fill="#FCEBE6" stroke="#CF4526" stroke-dasharray="6 5" stroke-width="1.3"/>
