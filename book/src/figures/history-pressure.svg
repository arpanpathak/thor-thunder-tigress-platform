  <text x="900.0" y="176.0" class="name" text-anchor="start" xml:space="preserve">No system prompt</text>
  <text x="900.0" y="194.0" class="sub" text-anchor="start" xml:space="preserve">the rules exist only</text>
  <text x="900.0" y="212.0" class="sub" text-anchor="start" xml:space="preserve">as complaints</text>
  <text x="900.0" y="230.0" class="sub" text-anchor="start" xml:space="preserve">between answers</text>
