  <path d="M60,192.7 H54 V233.3 H60 A11.3,11.3 0 0 1 48.7,222 V204 A11.3,11.3 0 0 1 60,192.7 Z" fill="#CF4526"/>
  <text x="68.0" y="218.0" class="name" text-anchor="start" xml:space="preserve">cub: code with unwrap()</text>
