<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="The request for answer 12 holds every earlier answer, most with unwrap, and the rules only as short user complaints. With no system prompt and temperature 1.0, Nemotron rewrote the pasted code and put unwrap back.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 17px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; }
    .warn { fill: #D9542B; font-size: 12px; }
    .num { fill: #1D2733; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .box { fill: #F4F7FA; stroke-width: 2; }
    .built { stroke: #4E8A16; }
    .planned { fill: #F4F7FA; stroke: #B7791F; stroke-width: 2; stroke-dasharray: 7 5; }
    .outside { fill: #F7F9FB; stroke: #3B6FD4; stroke-width: 2; }
    .zone { fill: none; stroke: #8A99AB; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zonelabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .flow { stroke: #1E88A8; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .deny { stroke: #D9542B; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
    <marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D9542B"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#FFFFFF"/>
  <text x="30" y="36" class="title">Why the cub kept repeating itself</text>
  <style>.bad { fill: #FBF1EE; stroke: #D9542B; stroke-width: 2; stroke-dasharray: 7 5; }</style>
  <rect x="30" y="56" width="440" height="400" rx="14" class="zone"/>
  <text x="44" y="76" class="zonelabel">The request for answer 12</text>
  <rect x="50" y="86" width="300" height="46" rx="10" class="box built"/>
  <text x="200" y="114" class="name" text-anchor="middle">you: write a running median, no unwrap</text>
  <rect x="130" y="144" width="300" height="46" rx="10" class="bad"/>
  <text x="280" y="172" class="name" text-anchor="middle">cub: code with unwrap()</text>
  <rect x="50" y="202" width="300" height="46" rx="10" class="box built"/>
  <text x="200" y="230" class="name" text-anchor="middle">you: I asked not to use unwrap</text>
  <rect x="130" y="260" width="300" height="46" rx="10" class="bad"/>
  <text x="280" y="288" class="name" text-anchor="middle">cub: code with unwrap()</text>
  <rect x="130" y="318" width="300" height="46" rx="10" class="outside"/>
  <text x="280" y="346" class="name" text-anchor="middle">7 more rounds like these</text>
  <rect x="50" y="376" width="300" height="46" rx="10" class="box built"/>
  <text x="200" y="404" class="name" text-anchor="middle">you: your own correct code, pasted</text>
  <rect x="560" y="150" width="200" height="90" rx="10" class="box built"/>
  <text x="660" y="183" class="name" text-anchor="middle">Nemotron 3 Nano</text>
  <text x="660" y="202" class="note" text-anchor="middle">30B weights, 3B active</text>
  <text x="660" y="219" class="note" text-anchor="middle">per token, temperature 1.0</text>
  <path class="flow" d="M470,250 L510.0,250.0 Q520,250 520.0,240.0 L520.0,205.0 Q520,195 530.0,195.0 L558,195" marker-end="url(#arrow)"/>
  <rect x="560" y="320" width="360" height="80" rx="10" class="bad"/>
  <text x="740" y="348" class="name" text-anchor="middle">Answer 12</text>
  <text x="740" y="367" class="note" text-anchor="middle">your code, rewritten, with</text>
  <text x="740" y="384" class="note" text-anchor="middle">min_high.unwrap() back in it</text>
  <path class="flow" d="M660,240 L660,318" marker-end="url(#arrow)"/>
  <rect x="790" y="120" width="150" height="120" rx="10" class="outside"/>
  <text x="865" y="160" class="name" text-anchor="middle">No system prompt</text>
  <text x="865" y="178" class="note" text-anchor="middle">the rules exist only</text>
  <text x="865" y="196" class="note" text-anchor="middle">as complaints</text>
  <text x="865" y="212" class="note" text-anchor="middle">between answers</text>
</svg>
