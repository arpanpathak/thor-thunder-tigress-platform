  <path d="M60,348.7 H54 V389.3 H60 A11.3,11.3 0 0 1 48.7,378 V360 A11.3,11.3 0 0 1 60,348.7 Z" fill="#7F8EA0"/>
  <text x="68.0" y="374.0" class="name" text-anchor="start" xml:space="preserve">7 more rounds like these</text>
  <rect x="48" y="400" width="420" height="42" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M60,400.7 H54 V441.3 H60 A11.3,11.3 0 0 1 48.7,430 V412 A11.3,11.3 0 0 1 60,400.7 Z" fill="#2F6FDB"/>
