<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 484" width="1080" height="484" role="img" aria-label="One answer, prose and a Rust block, goes to answer.rs, which splits them. slop.rs reads the prose for stock slop phrases with code blanked out. rules.rs reads each Rust block against the five rules, giving pass, fail or not applicable, with comments.rs finding the comments. claims.rs finds prose that says the rules are followed when one failed. report.rs adds the answers up into rates.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="1080" height="484" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">How spark scores one answer</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Three checks on one answer: its prose, its code, and whether the prose is honest about the code.</text>
  <path d="M50,124 H272 L290,142 V300 A10,10 0 0 1 280,310 H50 A10,10 0 0 1 40,300 V134 A10,10 0 0 1 50,124 Z" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M272,124 V142 H290 Z" fill="#EAF1FD" stroke="#D5DBE3" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="56" y="140" width="4" height="14" rx="2" fill="#2F6FDB"/>
  <text x="68.0" y="151.5" class="tab" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">ONE ANSWER</text>
  <text x="56.0" y="180.0" class="mono" text-anchor="start" xml:space="preserve">Here is the code. It</text>
  <text x="56.0" y="198.0" class="mono" text-anchor="start" xml:space="preserve">never uses unwrap.</text>
  <text x="56.0" y="216.0" class="mono dim" text-anchor="start" xml:space="preserve">```rust</text>
  <text x="56.0" y="234.0" class="mono trap" text-anchor="start" xml:space="preserve">let x = v.unwrap();</text>
  <text x="56.0" y="252.0" class="mono dim" text-anchor="start" xml:space="preserve">```</text>
  <text x="56.0" y="294.0" class="note" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">Prose, then a Rust block.</text>
  <rect x="340" y="172" width="190" height="88" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M352,172.7 H346 V259.3 H352 A11.3,11.3 0 0 1 340.7,248 V184 A11.3,11.3 0 0 1 352,172.7 Z" fill="#1F8A70"/>
  <text x="360.0" y="203.0" class="name" text-anchor="start" xml:space="preserve">answer.rs</text>
  <text x="360.0" y="221.0" class="sub" text-anchor="start" xml:space="preserve">splits the prose</text>
  <text x="360.0" y="239.0" class="sub" text-anchor="start" xml:space="preserve">from the Rust blocks</text>
  <rect x="590" y="104" width="230" height="88" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M602,104.7 H596 V191.3 H602 A11.3,11.3 0 0 1 590.7,180 V116 A11.3,11.3 0 0 1 602,104.7 Z" fill="#1F8A70"/>
  <text x="610.0" y="126.0" class="name" text-anchor="start" xml:space="preserve">slop.rs</text>
  <text x="610.0" y="144.0" class="sub" text-anchor="start" xml:space="preserve">reads the prose:</text>
  <text x="610.0" y="162.0" class="sub" text-anchor="start" xml:space="preserve">stock slop phrases,</text>
  <text x="610.0" y="180.0" class="sub" text-anchor="start" xml:space="preserve">code blanked out first</text>
  <rect x="590" y="216" width="230" height="88" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M602,216.7 H596 V303.3 H602 A11.3,11.3 0 0 1 590.7,292 V228 A11.3,11.3 0 0 1 602,216.7 Z" fill="#1F8A70"/>
  <text x="610.0" y="238.0" class="name" text-anchor="start" xml:space="preserve">rules.rs</text>
  <text x="610.0" y="256.0" class="sub" text-anchor="start" xml:space="preserve">reads each Rust block:</text>
  <text x="610.0" y="274.0" class="sub" text-anchor="start" xml:space="preserve">five rules, each pass,</text>
  <text x="610.0" y="292.0" class="sub" text-anchor="start" xml:space="preserve">fail or not applicable</text>
  <rect x="590" y="336" width="230" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M602,336.7 H596 V407.3 H602 A11.3,11.3 0 0 1 590.7,396 V348 A11.3,11.3 0 0 1 602,336.7 Z" fill="#7F8EA0"/>
  <text x="610.0" y="359.0" class="name" text-anchor="start" xml:space="preserve">comments.rs</text>
  <text x="610.0" y="377.0" class="sub" text-anchor="start" xml:space="preserve">a lexer for comments,</text>
  <text x="610.0" y="395.0" class="sub" text-anchor="start" xml:space="preserve">which syn throws away</text>
  <rect x="870" y="150" width="180" height="104" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M882,150.7 H876 V253.3 H882 A11.3,11.3 0 0 1 870.7,242 V162 A11.3,11.3 0 0 1 882,150.7 Z" fill="#CF4526"/>
  <text x="890.0" y="180.0" class="name" text-anchor="start" xml:space="preserve">claims.rs</text>
  <text x="890.0" y="198.0" class="sub" text-anchor="start" xml:space="preserve">prose that says the</text>
  <text x="890.0" y="216.0" class="sub" text-anchor="start" xml:space="preserve">rules are followed</text>
  <text x="890.0" y="234.0" class="sub" text-anchor="start" xml:space="preserve">when one failed</text>
  <path d="M870,327 A90.0,9 0 0 1 1050,327 V405 A90.0,9 0 0 1 870,405 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="960.0" cy="327" rx="90.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="960.0" y="360.0" class="name" text-anchor="middle" xml:space="preserve">report.rs</text>
  <text x="960.0" y="378.0" class="sub" text-anchor="middle" xml:space="preserve">adds answers up</text>
  <text x="960.0" y="396.0" class="sub" text-anchor="middle" xml:space="preserve">into rates</text>
  <path class="wire" d="M290,216 L340,216" marker-end="url(#head)"/>
  <path class="wire" d="M530,204 L551,204 Q560,204 560,195 L560,157 Q560,148 569,148 L590,148" marker-end="url(#head)"/>
  <path class="wire" d="M530,228 L551,228 Q560,228 560,237 L560,251 Q560,260 569,260 L590,260" marker-end="url(#head)"/>
  <path class="wire idle" d="M705,336 L705,304" marker-end="url(#head-idle)"/>
  <path class="wire" d="M820,148 L836,148 Q845,148 845,157 L845,181 Q845,190 854,190 L870,190" marker-end="url(#head)"/>
  <path class="wire" d="M820,260 L836,260 Q845,260 845,251 L845,223 Q845,214 854,214 L870,214" marker-end="url(#head)"/>
  <path class="wire" d="M960,254 L960,318" marker-end="url(#head)"/>
  <text x="40.0" y="446.0" class="note" text-anchor="start" xml:space="preserve">In the answer on the left, rule 1 fails on the red line, and the first two lines are a false claim.</text>
  <text x="40.0" y="463.0" class="note" text-anchor="start" xml:space="preserve">spark reads code. It does not compile it or run its tests.</text>
</svg>
