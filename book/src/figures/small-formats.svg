  <text x="384.0" y="434.0" class="note" text-anchor="start" xml:space="preserve">8 weights stored as one 8-bit index into a 256-entry grid</text>
  <rect x="40.0" y="510" width="14" height="14" rx="4" fill="#7F8EA0"/>
  <text x="61.0" y="521.5" class="note" text-anchor="start" xml:space="preserve">bar height: bits per weight</text>
  <rect x="263.2" y="510" width="14" height="14" rx="4" fill="#B7791F"/>
  <text x="284.2" y="521.5" class="note" text-anchor="start" xml:space="preserve">the block&#x27;s shared scale</text>
  <text x="40.0" y="556.0" class="note" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">A block&#x27;s weights share one scale, so a 4-bit or 2-bit number still covers a wide range. IQ2_XXS keeps its scales</text>
  <text x="40.0" y="573.0" class="note" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">per 32 and per 256 weights. Fewer bits mean fewer bytes per token, but each weight must be decoded before it is used.</text>
