<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="A visitor reaches app.example.com, which lands on a Tailscale node of their own running Funnel and a proxy. That node reaches the Thor over the tailnet, where their app listens on 127.0.0.1:9100. The Thor's own name does not change.">
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #1D2733; font-size: 19px; font-weight: 700; }
    .sheetlabel { fill: #5B6B7C; font-size: 12px; font-weight: 600; }
    .name { fill: #1D2733; font-size: 14px; font-weight: 600; }
    .note { fill: #5B6B7C; font-size: 12px; }
    .label { fill: #1E88A8; font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    .foot { fill: #5B6B7C; font-size: 12px; }
    .flow { stroke: #1E88A8; stroke-width: 2.2; fill: none; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E88A8"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#FFFFFF"/>
  <text x="34" y="44" class="title">Their name in front, the Thor behind it</text>
  <rect x="34" y="54" width="56" height="5" rx="2.5" fill="#1E88A8"/>
  <rect x="32" y="143" width="180" height="84" rx="12" fill="#1D2733" opacity="0.06"/>
  <rect x="34" y="146" width="180" height="84" rx="12" fill="#1D2733" opacity="0.04"/>
  <rect x="30" y="140" width="180" height="84" rx="12" fill="#EDF2FD" stroke="#3B6FD4" stroke-width="1.6"/>
  <rect x="40" y="154" width="4" height="56" rx="2" fill="#3B6FD4" opacity="0.85"/>
  <text x="126" y="176" class="name" text-anchor="middle" style="font-size:14px">visitor</text>
  <text x="126" y="197" class="note" text-anchor="middle">app.example.com</text>
  <path d="M242,109 H472 V274 L452,280 L432,274 L412,280 L392,274 L372,280 L352,274 L332,280 L312,274 L292,280 L272,274 L252,280 L242,274 L242,109 Z" fill="#1D2733" opacity="0.05"/>
  <path d="M240,105 H470 V270 L450,276 L430,270 L410,276 L390,270 L370,276 L350,270 L330,276 L310,270 L290,276 L270,270 L250,276 L240,270 L240,105 Z" fill="#FCFAF5" stroke="#E4DDCD" stroke-width="1.2"/>
  <rect x="256" y="92" width="120" height="26" rx="7" fill="#FFFFFF" stroke="#E4DDCD" stroke-width="1.2"/>
  <text x="316" y="109" class="sheetlabel" text-anchor="middle">their tailnet</text>
  <rect x="264" y="143" width="186" height="84" rx="12" fill="#1D2733" opacity="0.06"/>
  <rect x="266" y="146" width="186" height="84" rx="12" fill="#1D2733" opacity="0.04"/>
  <rect x="262" y="140" width="186" height="84" rx="12" fill="#F0F7E8" stroke="#4E8A16" stroke-width="1.6"/>
  <rect x="272" y="154" width="4" height="56" rx="2" fill="#4E8A16" opacity="0.85"/>
  <text x="361" y="176" class="name" text-anchor="middle" style="font-size:14px">their node</text>
  <text x="361" y="197" class="note" text-anchor="middle">Funnel + proxy</text>
  <path d="M562,109 H932 V274 L912,280 L892,274 L872,280 L852,274 L832,280 L812,274 L792,280 L772,274 L752,280 L732,274 L712,280 L692,274 L672,280 L652,274 L632,280 L612,274 L592,280 L572,274 L562,280 L562,109 Z" fill="#1D2733" opacity="0.05"/>
  <path d="M560,105 H930 V270 L910,276 L890,270 L870,276 L850,270 L830,276 L810,270 L790,276 L770,270 L750,276 L730,270 L710,276 L690,270 L670,276 L650,270 L630,276 L610,270 L590,276 L570,270 L560,276 L560,105 Z" fill="#FCFAF5" stroke="#E4DDCD" stroke-width="1.2"/>
  <rect x="576" y="92" width="185" height="26" rx="7" fill="#FFFFFF" stroke="#E4DDCD" stroke-width="1.2"/>
  <text x="668" y="109" class="sheetlabel" text-anchor="middle">your tailnet, unchanged</text>
  <rect x="584" y="143" width="326" height="84" rx="12" fill="#1D2733" opacity="0.06"/>
  <rect x="586" y="146" width="326" height="84" rx="12" fill="#1D2733" opacity="0.04"/>
  <rect x="582" y="140" width="326" height="84" rx="12" fill="#FDF5E7" stroke="#C9861A" stroke-width="1.6"/>
  <rect x="592" y="154" width="4" height="56" rx="2" fill="#C9861A" opacity="0.85"/>
  <text x="751" y="176" class="name" text-anchor="middle" style="font-size:14px">Jetson AGX Thor</text>
  <text x="751" y="197" class="note" text-anchor="middle">their app · 127.0.0.1:9100</text>
  <path class="flow" d="M212,182 L258,182" marker-end="url(#arrow)"/>
  <path class="flow" d="M452,182 L556,182" marker-end="url(#arrow)"/>
  <text x="504" y="170" class="label" text-anchor="middle">shared node</text>
  <text x="34" y="322" class="foot">Their app uses the GPU here. The name on the link is theirs, and your chat's address stays as it is.</text>
</svg>
