  <text x="768.0" y="186.0" class="name" text-anchor="start" xml:space="preserve">Jetson AGX Thor</text>
  <text x="768.0" y="204.0" class="sub" text-anchor="start" xml:space="preserve">their app · 127.0.0.1:9100</text>
  <path class="wire" d="M230,190 L290,190" marker-end="url(#head)"/>
  <path class="wire" d="M500,190 L710,190" marker-end="url(#head)"/>
  <rect x="561.7" y="181.0" width="86.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="605.0" y="193.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">shared node</text>
  <text x="40.0" y="310.0" class="note" text-anchor="start" xml:space="preserve">Their app uses the GPU here. The name on the link is theirs, and your chat&#x27;s address stays as it is.</text>
