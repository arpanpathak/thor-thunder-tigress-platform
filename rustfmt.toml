# The book prints this code, so it is formatted for reading.
#
# The import options are unstable, so format with nightly:
#   cargo +nightly fmt
#
# Method chains use rustfmt's default width. Imports are left exactly as they
# are written: reorder off, with the default Preserve granularity and grouping,
# so no `use` line changes.
reorder_imports = false
imports_granularity = "Preserve"
group_imports = "Preserve"
