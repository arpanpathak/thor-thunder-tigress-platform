# mypy --strict settings for the training script: python -m mypy --config-file train/mypy.ini train/lora.py
[mypy]
strict = True
# BitsAndBytesConfig and get_last_checkpoint have no annotations.
untyped_calls_exclude = transformers.utils.quantization_config, transformers.trainer_utils

# datasets ships no type information.
[mypy-datasets.*]
ignore_missing_imports = True
